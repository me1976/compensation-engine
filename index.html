        const desc = e.teacher + " (" + e.subject + ") " + e.originalClass + " ح" + e.originalPeriod;
        if (e.isAbsent) {
          if (e.found > 0) errors.push("حصة المعلم الغائب " + desc + " ظهرت نشطة " + e.found + " مرة");
          // إن لم تُعوَّض تبقى علامتها على الخلية؛ وإن عُوِّض فرغت الخلية بحصة أخرى — كلاهما سليم
        } else if (e.found === 0) {
          errors.push("حصة أصلية مفقودة: " + desc);
        } else if (e.found > 1) {
          errors.push("حصة أصلية مكررة " + e.found + " مرات: " + desc);
        } else if (e.foundIn !== e.originalClass || e.foundAt !== e.originalPeriod) {
          // I: الانتقال موثق بحركة تحمل نفس المعرف
          const logged = movementLog.some(m => m.lessonId === id);
          if (!logged) errors.push("انتقال " + desc + " غير موثق في سجل الحركات");
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // J: لا حصة فعلية بعد Original_End
    function checkNoLessonAfterEnd(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        const oe = originalEndMap[cls];
        for (let p = oe + 1; p <= 7; p++) {
          const l = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (isActiveLesson(l)) errors.push("حصة بعد Original_End في " + cls + " بالحصة " + p + " (End=" + oe + ")");
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // K: عدد الحصص الفعلية في كل شعبة = الأصل ناقص حصص الغياب الأصلية
    function checkClassCounts(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        let orig = 0, absentOrig = 0, live = 0;
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (row) for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (l && isRealLessonData(l.teacher, l.subject)) {
            orig++;
            if (absentList.indexOf(l.teacher) >= 0) absentOrig++;
          }
        }
        for (let p = 1; p <= 7; p++) {
          const l = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (isActiveLesson(l)) live++;
        }
        if (live !== orig - absentOrig)
          errors.push(cls + ": " + live + " حصة فعلية والمتوقع " + (orig - absentOrig) + " (أصل " + orig + " − غياب " + absentOrig + ")");
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // L: Final_Gap منطقي لكل سلسلة
    function checkFinalGapSanity(day) {
      const errors = [];
      for (const ch of chains) {
        const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][ch.className] && FIELD_SCHEDULE[day][ch.className][ch.targetPeriod];
        if (ch.status === "SUCCESS_NO_ACTION") {
          if (ch.completion !== "COMPLETE")
            errors.push(ch.id + " (NO_ACTION): completion يجب أن تكون COMPLETE");
          if (ch.finalGap !== ch.targetPeriod || ch.targetPeriod !== originalEndMap[ch.className])
            errors.push(ch.id + " (NO_ACTION): finalGap/هدف لا يطابق Original_End");
          else if (!cell || cell.status !== LessonStatus.ABSENCE_EMPTY)
            errors.push(ch.id + " (NO_ACTION): خلية الهدف ليست فراغ غياب");
        } else if (ch.status === "FALLBACK") {
          if (ch.completion !== "FAILED")
            errors.push(ch.id + " (FALLBACK): completion يجب أن تكون FAILED");
          if (ch.finalGap !== ch.targetPeriod) errors.push(ch.id + " (FALLBACK): finalGap ≠ الهدف");
          else if (!cell || cell.status !== LessonStatus.ABSENCE_EMPTY)
            errors.push(ch.id + " (FALLBACK): خلية الهدف ليست فراغ غياب متبقيًا");
        } else {
          if (!isActiveLesson(cell))
            errors.push(ch.id + " (" + ch.status + "): خلية الهدف غير معوضة رغم النجاح المعلن");
          if (!(ch.finalGap > ch.targetPeriod && ch.finalGap <= originalEndMap[ch.className]))
            errors.push(ch.id + ": finalGap=" + ch.finalGap + " خارج النطاق (" + ch.targetPeriod + ", " + originalEndMap[ch.className] + "]");
          const gapCell = FIELD_SCHEDULE[day][ch.className][ch.finalGap];
          if (!gapCell || gapCell.status !== LessonStatus.SHIFT_EMPTY)
            errors.push(ch.id + ": خلية الفراغ النهائي " + ch.finalGap + " ليست فراغ نقل");
          const expectRemaining = ch.finalGap < originalEndMap[ch.className];
          if (ch.remainingGap !== expectRemaining)
            errors.push(ch.id + ": علامة الفراغ المتبقي غير متسقة");
          const expectCompletion = expectRemaining ? "PARTIAL" : "COMPLETE";
          if (ch.completion !== expectCompletion)
            errors.push(ch.id + ": completion=" + ch.completion + " والمتوقع " + expectCompletion + " (نجاح مكتمل/جزئي غير متسق مع الحالة)");
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // M: لا دورات + مسار الفجوة متصل ومتزايد صرامةً عبر السلسلة كاملة:
    //   1) حركات الخلخلة داخل كل تشغيلة متتالية تتقدم للأمام وبلا تكرار مواضع.
    //   2) مسار الفجوة الكامل: بدءًا من targetPeriod، كل حركة داخل شعبة السلسلة
    //      (Direct/Ripple/الحركة الثالثة لكل كتلة Cross) يجب أن تملأ الفجوة الحالية
    //      بالضبط (toPeriod == الفجوة الحالية وfromPeriod > منها) ثم تنقلها إلى
    //      fromPeriod. النتيجة النهائية للمسار == finalGap المعلن.
    //      يكشف: حركات يتيمة، قفزات فجوة، تسلسلات مفبركة، وfinalGap مزوَّرًا.
    function checkNoRippleCycles(day) {
      const errors = [];
      for (const ch of chains) {
        const chMoves = movementLog.filter(m => m.chainId === ch.id);
        // (1) دورات الخلخلة
        const rip = chMoves.filter(m => m.movementType === "RIPPLE_SWAP");
        let g = null;
        const seen = {};
        for (const m of rip) {
          if (g !== null && !(m.fromPeriod > g)) errors.push("دورة في " + ch.id + ": " + m.fromPeriod + " بعد " + g);
          if (seen[m.fromPeriod]) errors.push("تكرار موضع " + m.fromPeriod + " في " + ch.id);
          seen[m.fromPeriod] = true;
          g = m.fromPeriod;
        }
        // (2) مسار الفجوة الكامل (سلاسل بحركات فقط)
        if (chMoves.length) {
          let gap = ch.targetPeriod;
          for (const m of chMoves) {
            if (m.sourceClass !== ch.className) continue;          // حركة تحرير داخل B
            if (m.toPeriod === gap && m.fromPeriod > gap) gap = m.fromPeriod;
            else {
              errors.push("مسار فجوة مكسور في " + ch.id + ": حركة " + m.fromPeriod + "→" + m.toPeriod +
                " لا تملأ الفجوة الحالية " + gap);
              gap = -1;
              break;
            }
          }
          if (gap !== -1 && gap !== ch.finalGap)
            errors.push("نهاية مسار الفجوة " + gap + " ≠ finalGap المعلن " + ch.finalGap + " في " + ch.id);
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // N: لا ضرر بالشعب المانحة — الشعبة التي لم تتعرض لغياب لا يجوز أن
    // يحصل فيها فراغ نقل إطلاقًا (عملية التحرير في B لا تترك أي فراغ)
    function checkNoDonorDamage(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        let hasShiftEmpty = false;
        for (let p = 1; p <= 7; p++) {
          const c = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (c && c.status === LessonStatus.SHIFT_EMPTY) { hasShiftEmpty = true; break; }
        }
        if (!hasShiftEmpty) continue;
        const hadOwnAbsence = vacancies.some(v => v.className === cls);
        if (!hadOwnAbsence)
          errors.push(cls + " بها فراغ نقل رغم أنها لم تتعرض لأي غياب (ضرر شعبة مانحة)");
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // O: كل كتلة Cross-Class بنية Depth=1 سليمة (شعبتان فقط لكل عملية):
    // بعد تصعيد الفجوة الداخلية قد تحتوي السلسلة عدة كتل — كل كتلة ثلاث حركات
    // متتالية يجب أن تكون: (1) Y: T''→T داخل B، (2) X: T→T'' داخل B نفسها —
    // تبادل حقيقي (from/to متعاكسان)، (3) الحصة X في A: P→T حيث P > T.
    // ممنوع داخل الكتلة الواحدة: شعبة ثالثة، أو حركة خارج نمط التبادل.
    function checkCrossClassTwoClassesOnly(day) {
      const errors = [];
      for (const ch of chains) {
        const chMoves = movementLog.filter(m => m.chainId === ch.id);
        if (!chMoves.some(m => m.movementType === "CROSS_CLASS_CASCADE")) continue;
        let i = 0;
        let blockNo = 0;
        while (i < chMoves.length) {
          if (chMoves[i].movementType !== "CROSS_CLASS_CASCADE") { i++; continue; }
          // بداية كتلة: ثلاث حركات متتالية بالضبط
          blockNo++;
          const blk = chMoves.slice(i, i + 3);
          if (blk.length < 3 || blk.some(m => m.movementType !== "CROSS_CLASS_CASCADE")) {
            errors.push(ch.id + " كتلة " + blockNo + ": كتلة Cross غير ثلاثية");
            break;
          }
          const [m1, m2, m3] = blk;
          const B = m1.sourceClass;
          if (m1.targetClass !== B || m2.sourceClass !== B || m2.targetClass !== B)
            errors.push(ch.id + " كتلة " + blockNo + ": حركة تحرير خارج الشعبة المانحة");
          if (m3.sourceClass !== ch.className || m3.targetClass !== ch.className)
            errors.push(ch.id + " كتلة " + blockNo + ": الحركة الثالثة ليست داخل شعبة السلسلة");
          if (B === ch.className)
            errors.push(ch.id + " كتلة " + blockNo + ": الشعبة المانحة هي نفسها A");
          if (!(m1.fromPeriod === m2.toPeriod && m1.toPeriod === m2.fromPeriod))
            errors.push(ch.id + " كتلة " + blockNo + ": حركتا B ليستا تبادلًا حقيقيًا متعاكسًا");
          if (m1.teacher === m2.teacher)
            errors.push(ch.id + " كتلة " + blockNo + ": تبادل الحصة مع نفسها");
          if (!(m3.fromPeriod > m3.toPeriod))
            errors.push(ch.id + " كتلة " + blockNo + ": الحركة الثالثة لا تتقدم بالفجوة");
          i += 3;
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // Q: تتبع ملكية كل فراغ نقل (SHIFT_EMPTY Ownership) — إثبات مصدر مباشر:
    // 1) وجود مالك (chainId + movementSeq)
    // 2) السلسلة موجودة
    // 3) الحركة موجودة ورقمها صحيح
    // 4) الحركة تطابق الخلية: نفس السلسلة، نفس الشعبة، fromPeriod = موضع الفراغ،
    //    المعلم المنقول نفسه
    // 5) لا فراغ يتيم
    // 6) لا فراغ منسوب لسلسلة أخرى (بما فيها سلسلة شعبة مختلفة)
    // مصادر البيانات مستقلة: movementLog وchains يُقابلان مع الخلايا مباشرة،
    // فأي فساد متعمد في أي طرف يكشفه الطرف الآخر.
    function checkShiftEmptyOwnership(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        const row = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const c = row[p];
          if (!c || c.status !== LessonStatus.SHIFT_EMPTY) continue;
          const where = cls + " ح" + p;
          if (!c.createdByChainId || !c.createdByMovementSeq) {
            errors.push("فراغ نقل يتيم بلا مالك في " + where);
            continue;
          }
          const chain = chains.find(ch => ch.id === c.createdByChainId);
          if (!chain) {
            errors.push("فراغ نقل منسوب لسلسلة غير موجودة (" + c.createdByChainId + ") في " + where);
            continue;
          }
          if (chain.className !== cls)
            errors.push("فراغ نقل منسوب لسلسلة شعبة أخرى (" + c.createdByChainId + " → " + chain.className + ") في " + where);
          const mv = movementLog[c.createdByMovementSeq - 1];
          if (!mv || mv.seq !== c.createdByMovementSeq) {
            errors.push("فراغ نقل بمرجع حركة غير صالح (#" + c.createdByMovementSeq + ") في " + where);
            continue;
          }
          if (mv.chainId !== c.createdByChainId)
            errors.push("فراغ نقل منسوب لحركة سلسلة أخرى في " + where);
          if (mv.sourceClass !== cls || mv.fromPeriod !== p)
            errors.push("فراغ نقل لا يطابق حركته (fromPeriod/sourceClass) في " + where);
          if (mv.teacher !== c.movedTeacher)
            errors.push("movedTeacher لا يطابق حركة الملكية في " + where);
          if (!(mv.toPeriod >= 1 && mv.toPeriod <= 7))
            errors.push("toPeriod غير صالح في حركة الملكية لـ" + where);
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // R: محاسبة كل فراغ داخلي (≤ Original_End) — لا فجوة مخفية ولا نجاح مضلل:
    //   - فراغ نقل (أي موضع ≤ End): يجب أن تفسّره سلسلة نجاح بحركات finalGap == موضعه
    //     وremainingGap متسق مع موضعه (داخلي true / عند End false).
    //   - فراغ غياب داخلي (< End): يجب أن يكون هدف سلسلة FALLBACK (استعصاء حقيقي).
    //   - فراغ غياب عند End: يجب أن يكون هدف سلسلة SUCCESS_NO_ACTION.
    // يكشف: فجوة يتيمة، فجوة منسوبة لسلسلة زُوِّر finalGapها، ونجاحًا معلنًا
    // فوق فراغ غياب لم يُعوَّض (FALLBACK مزوَّر إلى Success).
    function checkInternalGapAccounting(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        const oe = originalEndMap[cls];
        const row = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= oe; p++) {
          const c = row[p];
          if (!c) continue;
          if (c.status === LessonStatus.SHIFT_EMPTY) {
            const owner = chains.find(function (ch) {
              return ch.className === cls && ch.finalGap === p &&
                ch.status && ch.status.indexOf("SUCCESS") === 0 && ch.moves.length > 0;
            });
            if (!owner) {
              errors.push("فراغ نقل داخلي غير مفسّر بأي سلسلة في " + cls + " ح" + p + " (فجوة مخفية أو finalGap مزوَّر)");
            } else if (owner.remainingGap !== (p < oe)) {
              errors.push("سلسلة " + owner.id + " تملك فراغًا عند " + p + " لكن remainingGap=" + owner.remainingGap + " غير متسق");
            }
          } else if (c.status === LessonStatus.ABSENCE_EMPTY) {
            if (p === oe) {
              const owner = chains.find(function (ch) {
                return ch.className === cls && ch.targetPeriod === p && ch.status === "SUCCESS_NO_ACTION";
              });
              if (!owner) errors.push("فراغ غياب عند End بلا سلسلة NO_ACTION في " + cls + " ح" + p);
            } else {
              const owner = chains.find(function (ch) {
                return ch.className === cls && ch.targetPeriod === p && ch.status === "FALLBACK";
              });
              if (!owner)
                errors.push("فراغ غياب داخلي غير مفسّر بسلسلة استعصاء في " + cls + " ح" + p + " (غياب غير معوض دون FALLBACK موثق — نجاح مضلل؟)");
            }
          }
        }
      }
      // العكس: كل سلسلة PARTIAL يجب أن يكون finalGapها خلية فراغ نقل فعلية بنفس الشعبة
      for (const ch of chains) {
        if (ch.completion === "PARTIAL") {
          const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][ch.className] && FIELD_SCHEDULE[day][ch.className][ch.finalGap];
          if (!cell || cell.status !== LessonStatus.SHIFT_EMPTY)
            errors.push("سلسلة " + ch.id + " معلنة PARTIAL بفراغ عند " + ch.finalGap + " لكن الخلية ليست فراغ نقل فعلًا");
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // P: لا حالات مستحيلة — تناسق حقول كل خلية
    function checkCellShape(day) {
      const errors = [];
      const VALID = [LessonStatus.NORMAL, LessonStatus.SHIFTED, LessonStatus.ABSENCE_EMPTY, LessonStatus.SHIFT_EMPTY, LessonStatus.EMPTY];
      for (const cls of ALL_CLASSES) {
        const row = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const c = row[p];
          if (!c) { errors.push("خلية مفقودة: " + cls + " ح" + p); continue; }
          if (VALID.indexOf(c.status) < 0) errors.push("حالة غير معروفة " + c.status + " في " + cls + " ح" + p);
          if (c.currentPeriod !== p) errors.push("currentPeriod=" + c.currentPeriod + " ≠ " + p + " في " + cls + " ح" + p);
          if (!(c.originalPeriod >= 1 && c.originalPeriod <= 7)) errors.push("originalPeriod غير صالح في " + cls + " ح" + p);
          if (isLessonStatus(c.status)) {
            if (!c.teacher || !c.subject || !c.lessonId)
              errors.push("حصة فعلية بحقول ناقصة في " + cls + " ح" + p);
          } else if (c.status === LessonStatus.ABSENCE_EMPTY) {
            if (c.teacher || c.subject) errors.push("فراغ غياب يحمل معلمًا/مادة في " + cls + " ح" + p);
            if (!c.absentTeacher || !c.lessonId) errors.push("فراغ غياب بلا معرف/معلم غائب في " + cls + " ح" + p);
          } else {
            if (c.teacher || c.subject || c.lessonId)
              errors.push("فراغ يحمل بيانات حصة في " + cls + " ح" + p + " (" + c.status + ")");
          }
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // ============================================================
    // REPORT GENERATOR (§49/50 + تحسينات §20: Final_Gap، أسباب الاستعصاء،
    // تمييز نوعي الفراغ، عرض Integrity الكامل)
    // ============================================================
    function getStatusBadge(status, completion) {
      // التمييز الصريح: النجاح المكتمل ≠ النجاح مع فراغ متبقٍ داخلي (لا نجاح مضلل)
      const partialMark = completion === "PARTIAL" ? " — مع فراغ متبقٍ ⚠" : "";
      const map = {
        "SUCCESS_DIRECT": '<span class="status-badge status-success">سحب مباشر ✓' + partialMark + "</span>",
        "SUCCESS_RIPPLE": '<span class="status-badge status-success">خلخلة ✓' + partialMark + "</span>",
        "SUCCESS_CROSS_CLASS": '<span class="status-badge status-success">عابر للشعب ✓' + partialMark + "</span>",
        "SUCCESS_NO_ACTION": '<span class="status-badge status-noaction">فراغ محظوظ ✓</span>',
        "FALLBACK": '<span class="status-badge status-fallback">استعصاء ✗</span>',
        "PENDING": '<span class="status-badge">قيد المعالجة</span>'
      };
      return map[status] || status;
    }

    function gapTypeLabel(type) {
      return type === LessonStatus.ABSENCE_EMPTY ? "فراغ غياب (غير معوض)" : "فراغ نقل (ضغط دوام)";
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function generateReport(day, integrity, res) {
      // إذا لم يُمرَّر res (كما في الاختبارات الداخلية) نبنيه مرة واحدة فقط
      if (!res) res = buildResults();
      const absent = res.absentees ? res.absentees.map(a => a.name) : absentList.slice();
      let html = "";

      // بيانات اليوم
      html += '<div class="report-section"><h2>📊 بيانات اليوم</h2><div class="report-item">' +
        '<span class="label">اليوم:</span> <span class="value">' + esc(day) + '</span><br>' +
        '<span class="label">التاريخ:</span> <span class="value">' + esc(currentDate || "—") + '</span><br>' +
        '<span class="label">وقت تشغيل المحرك:</span> <span class="value">' + esc(new Date().toLocaleString("ar")) + ' (' + esc(engineRunTime) + ')</span>' +
        '</div></div>';

      // المعلمون الغائبون
      html += '<div class="report-section"><h2>🚫 المعلمون الغائبون (' + absent.length + ')</h2>';
      if (!absent.length) html += '<div class="report-item">لم يتم تحديد معلمين غائبين.</div>';
      else {
        html += '<div class="report-item">';
        for (const a of buildResultsAbsenteesPreview()) {
          html += '<strong>' + esc(a.name) + '</strong> — ' + a.lessonsToday + ' حصة في هذا اليوم' +
            (a.note ? ' <span style="color:var(--text2)">(' + esc(a.note) + ')</span>'
              : ' — عُوِّض ' + a.compensated + ' من ' + a.affected) + '<br>';
        }
        html += '</div>';
      }
      html += '</div>';

      // الشعب المتأثرة + مسار الفراغات + Final_Gap
      html += '<div class="report-section"><h2>📋 الشعب المتأثرة ومسار الفراغات</h2>';
      const byClass = {};
      for (const v of vacancies) {
        if (!byClass[v.className]) byClass[v.className] = [];
        byClass[v.className].push(v);
      }
      const classNames = Object.keys(byClass);
      if (!classNames.length) html += '<div class="report-item">لا توجد شعب متأثرة.</div>';
      for (const cls of classNames) {
        const oe = originalEndMap[cls];
        html += '<div class="report-item"><strong>' + esc(cls) + '</strong> (Original_End = ' + oe + ')<br>';
        for (const v of byClass[cls]) {
          const ch = v.chain;
          html += 'الحصة ' + v.period + ': غياب ' + esc(v.absentTeacher) + ' (' + esc(v.subject) + ') → ' +
            getStatusBadge(v.status, ch && ch.completion);
          if (ch && ch.completion === "PARTIAL") {
            html += '<br><span class="label">Final_Gap: الحصة ' + ch.finalGap +
              ' (داخل الدوام — فراغ متبقٍ يحتاج متابعة/قرارًا إداريًا)</span>';
            if (ch.gapBlockedReason)
              html += '<br><span class="label">سبب تعذر دفعه إلى نهاية الدوام:</span> <span style="color:var(--warning)">' +
                esc(ch.gapBlockedReason) + '</span>';
          } else if (ch && ch.completion === "COMPLETE" && ch.status !== "SUCCESS_NO_ACTION") {
            html += ' <span style="color:var(--text2)">— Final_Gap: الحصة ' + ch.finalGap + ' (عند نهاية الدوام — منطقة الاستقبال) — نجاح مكتمل</span>';
          }
          html += '<br>';
        }
        html += '</div>';
      }
      html += '</div>';

      // الحركات
      if (movementLog.length > 0) {
        html += '<div class="report-section"><h2>🔄 سجل الحركات (' + movementLog.length + ')</h2>';

        const directLogs = movementLog.filter(m => m.movementType === "DIRECT_TAIL_PULL");
        if (directLogs.length) {
          html += '<h3>⬆️ سحب مباشر (' + directLogs.length + ')</h3>';
          for (const m of directLogs)
            html += '<div class="report-item">' + esc(m.sourceClass) + ': نقل حصة ' + esc(m.teacher) +
              ' (' + esc(m.subject) + ') من الحصة ' + m.fromPeriod + ' إلى الحصة ' + m.toPeriod + '</div>';
        }

        const rippleChains = chains.filter(c => movementLog.some(m => m.chainId === c.id && m.movementType === "RIPPLE_SWAP"));
        if (rippleChains.length) {
          html += '<h3>🔀 خلخلة (' + movementLog.filter(m => m.movementType === "RIPPLE_SWAP").length + ' حركة)</h3>';
          for (const c of rippleChains) {
            const mvs = movementLog.filter(m => m.chainId === c.id);
            const steps = mvs.map(m => esc(m.teacher) + ': ' + m.fromPeriod + '→' + m.toPeriod).join('، ');
            html += '<div class="report-item">' + esc(c.className) + ' (هدف: الحصة ' + c.targetPeriod + ')<br>' + steps +
              '<br><span class="label">النتيجة النهائية: الفراغ في الحصة ' + c.finalGap +
              (c.remainingGap ? ' — فراغ متبقٍ يحتاج متابعة' : ' (منطقة استقبال الفراغ)') + '</span></div>';
          }
        }

        const crossChains = chains.filter(c => c.crossInfo);
        if (crossChains.length) {
          html += '<h3>🔗 عابر للشعب — Depth=1 (' + crossChains.length + ' سلسلة)</h3>';
          for (const c of crossChains) {
            const i = c.crossInfo;
            html += '<div class="report-item">' +
              'الشعبة ' + esc(i.classA) + ' تحتاج ' + esc(i.teacherX) + ' عند الحصة ' + i.targetPeriod + ':<br>' +
              '• داخل ' + esc(i.classB) + ': سحب حصة ' + esc(i.teacherY) + ' من الحصة ' + i.freePeriod +
              ' إلى الحصة ' + i.targetPeriod + ' مع انتقال حصة ' + esc(i.teacherX) + ' إلى الحصة ' + i.freePeriod + ' (حركة تحرير واحدة).<br>' +
              '• في ' + esc(i.classA) + ': نقل حصة ' + esc(i.teacherX) + ' من الحصة ' + i.candidateP + ' إلى الهدف ' + i.targetPeriod + '.<br>' +
              '<span class="label">' + esc(i.result) + '</span></div>';
            // عمليات تصعيد الفجوة الداخلية (ملء فراغ النقل عبر شعبة مانحة أخرى)
            if (c.gapFills && c.gapFills.length) {
              for (const gf of c.gapFills) {
                html += '<div class="report-item" style="border-right:3px solid var(--cross)">' +
                  'تصعيد فجوة داخلية في ' + esc(c.className) + ' عند الحصة ' + gf.gap + ' (ناتجة عن النقل):<br>' +
                  '• داخل ' + esc(gf.classB) + ': تبادل واحد — حصة ' + esc(gf.teacherY) + ' من الحصة ' + gf.freePeriod +
                  ' إلى ' + gf.gap + ' وحصة ' + esc(gf.teacherX) + ' إلى الحصة ' + gf.freePeriod + '.<br>' +
                  '• في ' + esc(c.className) + ': حصة ' + esc(gf.teacherX) + ' نفسها تنتقل من الحصة ' + gf.candidateP +
                  ' إلى ' + gf.gap + ' — الفجوة تنتقل إلى ' + gf.candidateP + '.<br>' +
                  '<span class="label">المانح ' + esc(gf.classB) + ' سليم بلا أي فقدان (تبادل كامل).</span></div>';
              }
            }
          }
        }
        html += '</div>';
      }

      // الفراغات النهائية (مميزة النوع)
      html += '<div class="report-section"><h2>⬜ الفراغات النهائية الناتجة عن ضغط الدوام</h2>';
      // نستخدم res الممررة — لا استدعاء مزدوج لـ buildResults
      let hasGaps = false;
      for (const g of res.finalGaps) {
        hasGaps = true;
        const isAbsence = g.type === LessonStatus.ABSENCE_EMPTY;
        const color = isAbsence ? "var(--absence)" : "var(--shift-empty)";
        let desc;
        if (isAbsence && g.atEnd) desc = "فراغ غياب عند نهاية الدوام (فراغ محظوظ) — ضمن القواعد";
        else if (isAbsence) desc = "فراغ غياب غير معوض — استعصاء يحتاج قرارًا إداريًا";
        else if (g.atEnd) desc = "فراغ ناتج عن ضغط الدوام (عند نهاية الدوام) — ضمن القواعد";
        else desc = "فراغ ضغط متبقٍ (داخل الدوام) — يحتاج متابعة/قرارًا إداريًا";
        html += '<div class="report-item">' + esc(g.className) + ': الحصة ' + g.period +
          ' — <span style="color:' + color + '">' + desc + '</span>' +
          (g.needsAttention ? ' <span style="color:var(--fallback)">⚠</span>' : '') + '</div>';
      }
      if (!hasGaps) html += '<div class="report-item">لا توجد فراغات داخلية متبقية ✓</div>';
      html += '</div>';

      // الاستعصاءات مع الأسباب التفصيلية
      html += '<div class="report-section"><h2>⚠️ الاستعصاءات (تحتاج قرارًا إداريًا)</h2>';
      const fbs = chains.filter(c => c.status === "FALLBACK");
      if (!fbs.length) html += '<div class="report-item" style="color:var(--success)">لا توجد حالات استعصاء ✓</div>';
      else {
        for (const f of fbs) {
          html += '<div class="report-item" style="border-right:3px solid var(--fallback)">' +
            '<strong>' + esc(f.className) + ' — الحصة ' + f.targetPeriod + '</strong> (غياب ' + esc(f.absentTeacher) +
            ' — ' + esc(f.subject) + ')<br>' +
            '<span class="label">آخر مرحلة تم الوصول إليها:</span> <span class="value">' + esc(f.lastStageReached || "—") + '</span><br>' +
            '<span class="label">السبب التفصيلي:</span><br>' + esc(f.failureReason || "غير موثق") + '</div>';
        }
      }
      html += '</div>';

      // بدائل قرار إداري للفجوات المتبقية (خارج القواعد الآمنة — لا تُنفَّذ تلقائيًا)
      const sugg = buildGapFillSuggestions(day);
      if (sugg.length) {
        html += '<div class="report-section"><h2>💡 بدائل قرار إداري للفجوات المتبقية (لا تُنفَّذ تلقائيًا)</h2>';
        html += '<div class="report-item" style="color:var(--warning)">بدائل استبدال تنقل الفقد إلى شعبة سليمة — خارج القواعد الآمنة للمحرك (التي تمنع أي ضرر للشعب المانحة). معروضة بكلفتها الصريحة لدعم قرار الإدارة الميداني فقط.</div>';
        for (const sg of sugg) {
          html += '<div class="report-item"><strong>' + esc(sg.className) + ': الحصة ' + sg.gap +
            '</strong> (فجوة متبقية بعد تعويض غياب ' + esc(sg.absentTeacher) + ')<br>';
          if (!sg.options.length) {
            html += '<span class="label">لا توجد بدائل متاحة — كل الشعب فارغة أو غائبة عند هذه الفترة</span>';
          }
          for (const o of sg.options) {
            html += '• نقل حصة ' + esc(o.teacher) + ' (' + esc(o.subject) + ') من ' + esc(o.classB) +
              ' ح' + sg.gap + ' إلى هنا' + (o.subjectMatch ? ' — مطابقة لمادة الغياب' : '') + '<br>' +
              '<span class="label">الكلفة: ' + esc(o.cost) + '</span><br>';
          }
          html += '</div>';
        }
        html += '</div>';
      }

      // فحص السلامة الكامل A–P
      html += '<div class="report-section"><h2>🔒 فحص السلامة (Integrity)</h2><div class="report-item">';
      for (const key of Object.keys(INTEGRITY_LABELS)) {
        const v = integrity[key];
        const icon = v && v.valid ? '✅' : '❌';
        html += icon + ' ' + INTEGRITY_LABELS[key];
        if (!v || !v.valid) html += '<br><span style="color:var(--fallback);font-size:0.85em">' +
          esc((v && v.errors || []).join(' — ')).slice(0, 400) + '</span>';
        html += '<br>';
      }
      html += '</div></div>';

      // الملخص الإحصائي
      const s = res.stats;
      html += '<div class="report-section"><h2>📈 الملخص الإحصائي</h2><div class="stat-grid">' +
        statCard(s.absentTeachers, "معلمون غائبون") +
        statCard(s.affectedClasses, "شعب متأثرة") +
        statCard(s.completeSuccess, "نجاح مكتمل (عند End)") +
        statCard(s.partialSuccess, "نجاح مع فراغ متبقٍ") +
        statCard(s.compensatedVacancies, "حصص معوضة") +
        statCard(s.noActionVacancies, "فراغ محظوظ") +
        statCard(s.totalMovements, "إجمالي الحركات") +
        statCard(s.directMoves, "سحب مباشر") +
        statCard(s.rippleMoves, "خلخلة") +
        statCard(s.crossClassChains, "عابر للشعب") +
        statCard(s.finalGaps, "فراغات نهائية") +
        statCard(s.fallbacks, "استعصاءات") +
        '</div></div>';

      return html;
    }

    function statCard(num, lbl) {
      return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
    }

    // معاينة الغائبين للتقرير (تُبنى من الحالة الحالية مباشرة)
    function buildResultsAbsenteesPreview() {
      return absentList.map(t => {
        const st = teacherState[t] || { originalLoad: 0 };
        const vs = vacancies.filter(v => v.absentTeacher === t);
        const compensated = vs.filter(v => v.status && v.status.indexOf("SUCCESS") === 0 && v.status !== "SUCCESS_NO_ACTION").length;
        return {
          name: t, lessonsToday: st.originalLoad, affected: vs.length, compensated: compensated,
          note: st.originalLoad === 0 ? "لا حصص لهذا المعلم في هذا اليوم — لا تأثير" : ""
        };
      });
    }

    // ============================================================
    // TEST SUITE — اختبارات حقيقية للسلوك (§17-19)
    // شبكات مصغرة mini schedules للحالات الحدية + الجدول الحقيقي
    // + اختبارات طفير (Mutation) تثبت أن Integrity يكشف أخطاء المحرك نفسه
    // تعمل في Node (عبر globalThis.EngineTestSuite) وفي المتصفح (?tests=1)
    // ============================================================
    const EngineTestSuite = (function () {
      let currentName = "";
      let passCount = 0, failCount = 0;
      const failures = [];
      const tests = [];

      function test(name, fn) { tests.push({ name: name, fn: fn }); }

      function check(desc, cond, detail) {
        if (cond) { passCount++; return true; }
        failCount++;
        failures.push({ test: currentName, desc: desc, detail: detail === undefined ? "" : String(detail) });
        return false;
      }

      const L = (subject, teacher) => [subject, teacher];
      function seq(prefix, from, to) {
        const o = {};
        for (let p = from; p <= to; p++) o[p] = L("مادة", prefix + p);
        return o;
      }

      // بناء يوم مصغر وتبديل الجدول به مؤقتًا (يُستعاد الأصل في finally)
      // كل فترة ليست مصفوفة [مادة، معلم] صريحة = فراغ (يشمل المفاتيح الغائبة والرموز)
      function makeSpecDay(classes) {
        const day = "الاختبار";
        const schedule = {};
        schedule[day] = {};
        for (const cls of Object.keys(classes)) {
          schedule[day][cls] = {};
          for (let p = 1; p <= 7; p++) {
            const cell = classes[cls][p];
            if (Array.isArray(cell)) schedule[day][cls][p] = { teacher: cell[1], subject: cell[0] };
            else schedule[day][cls][p] = { teacher: "", subject: "" };
          }
        }
        return { schedule: schedule, classes: Object.keys(classes), day: day };
      }

      function withMini(classesSpec, absent, fn) {
        const spec = makeSpecDay(classesSpec);
        const saveOrig = ORIGINAL_SCHEDULE, saveClasses = ALL_CLASSES;
        ORIGINAL_SCHEDULE = deepFreeze(normalizeOriginal(spec.schedule));
        ALL_CLASSES = spec.classes.slice();
        try {
          return fn(runEngine(spec.day, "2026-01-01", absent));
        } finally {
          ORIGINAL_SCHEDULE = saveOrig;
          ALL_CLASSES = saveClasses;
        }
      }

      // وضع الإمساك: يركّب المصغر ويشغّل محركًا نظيفًا دون استعادة —
      // لاختبارات الطفير التي تفسد الحالة ثم تتحقق من Integrity
      function miniHold(classesSpec, absent) {
        const spec = makeSpecDay(classesSpec);
        const save = { orig: ORIGINAL_SCHEDULE, classes: ALL_CLASSES };
        ORIGINAL_SCHEDULE = deepFreeze(normalizeOriginal(spec.schedule));
        ALL_CLASSES = spec.classes.slice();
        const result = runEngine(spec.day, "2026-01-01", absent);
        return { save: save, result: result, day: spec.day };
      }
      function miniRestore(h) {
        ORIGINAL_SCHEDULE = h.save.orig;
        ALL_CLASSES = h.save.classes;
      }

      const slotOf = (r, cls, p) => r.field[r.meta.day][cls][p];
      const chainOf = (r, cls, T) => r.chains.find(c => c.className === cls && c.targetPeriod === T);
      const movesOf = (r, ch) => r.movementLog.filter(m => m.chainId === ch.id);

      /* ============ الاختبارات الإلزامية (§17) ============ */

      test("T1: End=7 غياب@6 → 7→6", () => {
        const r = withMini({ A: seq("t", 1, 7) }, ["t6"], r => r);
        check("حركة واحدة 7→6", r.movementLog.length === 1 &&
          r.movementLog[0].fromPeriod === 7 && r.movementLog[0].toPeriod === 6 &&
          r.movementLog[0].movementType === "DIRECT_TAIL_PULL", JSON.stringify(r.movementLog));
        check("SUCCESS_DIRECT والفراغ في 7", chainOf(r, "A", 6).status === "SUCCESS_DIRECT" &&
          chainOf(r, "A", 6).finalGap === 7);
        check("الحصة 6 = معلم الحصة 7 والخانة 7 فراغ نقل", slotOf(r, "A", 6).teacher === "t7" &&
          slotOf(r, "A", 7).status === "SHIFT_EMPTY");
        check("Integrity سليم", r.integrity.allPassed, r.integrity.issues.join("؛ "));
      });

      test("T2: الأبعد متعارض → المرشح التالي (6→5 ثم خلخلة 7→6)", () => {
        const r = withMini({
          A: seq("t", 1, 7),
          B: { 5: L("مادة", "t7") }
        }, ["t5"], r => r);
        check("أول حركة من 6 (7 متعارض عند 5)", r.movementLog[0].fromPeriod === 6 && r.movementLog[0].toPeriod === 5,
          JSON.stringify(r.movementLog.map(m => m.fromPeriod + ">" + m.toPeriod)));
        check("استكمال خلخلة 7→6", r.movementLog.length === 2 &&
          r.movementLog[1].fromPeriod === 7 && r.movementLog[1].toPeriod === 6 &&
          r.movementLog[1].movementType === "RIPPLE_SWAP");
        check("SUCCESS_RIPPLE والفراغ في 7", chainOf(r, "A", 5).status === "SUCCESS_RIPPLE" &&
          chainOf(r, "A", 5).finalGap === 7);
        check("Integrity سليم", r.integrity.allPassed, r.integrity.issues.join("؛ "));
      });

      test("T3: End=6 غياب@5 → 6→5 (لا استخدام للحصة 7)", () => {
        const r = withMini({ A: seq("t", 1, 6) }, ["t5"], r => r);
        check("Original_End = 6", r.originalEnd["A"] === 6);
        check("حركة واحدة 6→5", r.movementLog.length === 1 &&
          r.movementLog[0].fromPeriod === 6 && r.movementLog[0].toPeriod === 5);
        check("الخانة 7 بقيت غير مبرمجة", slotOf(r, "A", 7).status === "EMPTY");
        check("Integrity سليم", r.integrity.allPassed);
      });

      test("T4: End=5 غياب@4 → 5→4", () => {
        const r = withMini({ A: seq("t", 1, 5) }, ["t4"], r => r);
        check("حركة واحدة 5→4", r.movementLog.length === 1 &&
          r.movementLog[0].fromPeriod === 5 && r.movementLog[0].toPeriod === 4);
        check("SUCCESS_DIRECT والفراغ في 5", chainOf(r, "A", 4).status === "SUCCESS_DIRECT" &&
          chainOf(r, "A", 4).finalGap === 5);
      });

      test("T5: غياب مبكر@2 → 7→2", () => {
        const r = withMini({ A: seq("t", 1, 7) }, ["t2"], r => r);
        check("حركة واحدة 7→2", r.movementLog.length === 1 &&
          r.movementLog[0].fromPeriod === 7 && r.movementLog[0].toPeriod === 2);
        check("الحصة 2 = معلم الحصة 7", slotOf(r, "A", 2).teacher === "t7");
        check("Integrity سليم", r.integrity.allPassed);
      });

      test("T6: Direct يحمي الهدف وRipple يكمل الدفع حتى End", () => {
        const r = withMini({
          A: seq("t", 1, 7),
          B: { 2: L("مادة", "t7") },
          C: { 2: L("مادة", "t6") }
        }, ["t2"], r => r);
        // البحث الديناميكي يجد أقصر مسار: 5→2 مباشرة ثم قفزة 7→5
        check("حركتان: 5→2 (Direct) ثم 7→5 (Ripple)", r.movementLog.length === 2 &&
          r.movementLog[0].fromPeriod === 5 && r.movementLog[0].toPeriod === 2 &&
          r.movementLog[1].fromPeriod === 7 && r.movementLog[1].toPeriod === 5,
          JSON.stringify(r.movementLog.map(m => m.fromPeriod + ">" + m.toPeriod)));
        check("SUCCESS_RIPPLE والفراغ في 7", chainOf(r, "A", 2).status === "SUCCESS_RIPPLE" &&
          chainOf(r, "A", 2).finalGap === 7);
        check("الوضع النهائي للشعبة سليم", slotOf(r, "A", 2).teacher === "t5" &&
          slotOf(r, "A", 5).teacher === "t7" && slotOf(r, "A", 6).teacher === "t6" &&
          slotOf(r, "A", 6).status === "NORMAL" && slotOf(r, "A", 7).status === "SHIFT_EMPTY");
        check("Integrity سليم", r.integrity.allPassed, r.integrity.issues.join("؛ "));
      });

      test("T7: Cross-Class Depth=1 ينجح (تحرير X بحركة واحدة داخل B)", () => {
        const r = withMini({
          A: { 1: L("م", "a1"), 2: L("م", "abs"), 3: L("م", "a3"), 4: L("م", "a4"), 5: L("م", "a5"), 6: L("م", "a6"), 7: L("م", "t7") },
          B: { 2: L("م", "a3") }, C: { 2: L("م", "a4") }, D: { 2: L("م", "a5") }, E: { 2: L("م", "a6") },
          F: { 2: L("م", "t7"), 5: L("م", "t8") }
        }, ["abs"], r => r);
        const ch = chainOf(r, "A", 2);
        check("SUCCESS_CROSS_CLASS", ch.status === "SUCCESS_CROSS_CLASS", ch.status);
        check("ثلاث حركات موثقة جميعها CROSS_CLASS_CASCADE", r.movementLog.length === 3 &&
          r.movementLog.every(m => m.movementType === "CROSS_CLASS_CASCADE"),
          JSON.stringify(r.movementLog.map(m => m.fromPeriod + ">" + m.toPeriod)));
        check("الهدف A@2 مُلئ بحصة t7 (منقولة داخل A)", slotOf(r, "A", 2).teacher === "t7" &&
          slotOf(r, "A", 2).status === "SHIFTED" && slotOf(r, "A", 2).lessonId.indexOf("|A|7|") >= 0);
        check("داخل B=F: Y حل مكان X وX انتقل لموضع Y (لا فراغ جديد)", slotOf(r, "F", 2).teacher === "t8" &&
          slotOf(r, "F", 5).teacher === "t7" &&
          !Object.keys(r.field["الاختبار"]["F"]).some(p => r.field["الاختبار"]["F"][p].status === "SHIFT_EMPTY"));
        check("crossInfo موثق", ch.crossInfo && ch.crossInfo.classA === "A" && ch.crossInfo.classB === "F" &&
          ch.crossInfo.teacherX === "t7" && ch.crossInfo.teacherY === "t8");
        check("الفراغ النهائي في 7", ch.finalGap === 7);
        check("Integrity سليم", r.integrity.allPassed, r.integrity.issues.join("؛ "));
      });

      test("T8: Cross يحتاج حركتين داخل B → FALLBACK", () => {
        const r = withMini({
          A: { 1: L("م", "a1"), 2: L("م", "abs"), 3: L("م", "a3"), 4: L("م", "a4"), 5: L("م", "a5"), 6: L("م", "a6"), 7: L("م", "t7") },
          B: { 2: L("م", "a3"), 4: L("م", "y3") }, G: { 2: L("م", "y3") },
          C: { 2: L("م", "a4"), 4: L("م", "y4") }, H: { 2: L("م", "y4") },
          D: { 2: L("م", "a5"), 4: L("م", "y5") }, I: { 2: L("م", "y5") },
          E: { 2: L("م", "a6"), 4: L("م", "y6") }, J: { 2: L("م", "y6") },
          F: { 2: L("م", "t7"), 4: L("م", "y7") }, K: { 2: L("م", "y7") }
        }, ["abs"], r => r);
        const ch = chainOf(r, "A", 2);
        check("FALLBACK", ch.status === "FALLBACK", ch.status);
        check("صفر حركات", movesOf(r, ch).length === 0);
        check("A@2 بقيت فراغ غياب", slotOf(r, "A", 2).status === "ABSENCE_EMPTY");
        check("سبب موثق حتى Cross", ch.lastStageReached === "CROSS_CLASS" && !!ch.failureReason);
        check("Integrity سليم رغم الاستعصاء", r.integrity.allPassed, r.integrity.issues.join("؛ "));
      });

      test("T9: يحتاج شعبة ثالثة → FALLBACK (Depth=1 صارم)", () => {
        const r = withMini({
          A: { 1: L("م", "a1"), 2: L("م", "abs"), 3: L("م", "a3"), 4: L("م", "a4"), 5: L("م", "a5"), 6: L("م", "a6"), 7: L("م", "t7") },
          B: { 2: L("م", "a3") }, C: { 2: L("م", "a4") }, D: { 2: L("م", "a5") }, E: { 2: L("م", "a6") },
          F: { 2: L("م", "t7"), 5: L("م", "y7") },
          Z: { 2: L("م", "y7"), 4: L("م", "z9") }
        }, ["abs"], r => r);
        const ch = chainOf(r, "A", 2);
        check("FALLBACK — رفض العمق 2", ch.status === "FALLBACK", ch.status);
        check("لم تُمَس الشعبة Z", slotOf(r, "Z", 2).teacher === "y7" && slotOf(r, "Z", 4).teacher === "z9");
        check("صفر حركات", movesOf(r, ch).length === 0);
      });

        // أنماط الحركات المشروعة داخل السلسلة الواحدة بعد تصعيد الفجوة الداخلية:
        //   [D] | [D,R+] | [C,C,C] | [D,C,C,C] | [C,C,C,R+] | [D,R+,C,C,C,R+,...]
        // القواعد: Direct واحدة على الأكثر (الأولى)، كتل Cross ثلاثية متجاورة
        // بالضبط، وأي تعاقب (R+ ثم كتلة Cross)* بعد الحشوة الأولى — كل عملية Cross
        // عملية Depth=1 مستقلة على فجوة داخلية لاحقة (مسار الفجوة يتحقق في فحص M).
        function legalChainPattern(seq) {
          if (!seq.length) return true;                          // NO_ACTION / FALLBACK
          if (seq.filter(k => k === "DIRECT_TAIL_PULL").length > 1) return false;
          if (seq[0] === "DIRECT_TAIL_PULL") seq = seq.slice(1);
          if (!seq.length) return true;                          // [D]
          // تجميع إلى مقاطع: R+ أو كتلة C ثلاثية (أو مضاعفات ثلاثية)
          let i = 0;
          while (i < seq.length) {
            if (seq[i] === "RIPPLE_SWAP") { i++; continue; }
            if (seq[i] === "CROSS_CLASS_CASCADE") {
              let n = 0;
              while (i < seq.length && seq[i] === "CROSS_CLASS_CASCADE") { n++; i++; }
              if (n % 3 !== 0) return false;                     // كتلة غير ثلاثية
              continue;
            }
            return false;                                        // Direct ليست الأولى
          }
          return true;
        }
        for (const d of RAW_SCHEDULE_DATA_KEYS()) {
          const top = topTeachersOfDay(d, 2);
          const r = runEngine(d, "2026-01-01", top);
          check(d + ": Integrity كامل", r.integrity.allPassed, r.integrity.issues.join("؛ "));
          check(d + ": حالات سلاسم سليمة", r.chains.every(c =>
            ["SUCCESS_DIRECT", "SUCCESS_RIPPLE", "SUCCESS_CROSS_CLASS", "SUCCESS_NO_ACTION", "FALLBACK"].indexOf(c.status) >= 0));
          check(d + ": نمط حركات كل سلسلة مشروع ([D] / [D,R+] / [C,C,C] / [C,C,C,R+])",
            r.chains.every(c => legalChainPattern(movesOf(r, c).map(m => m.movementType))),
            r.chains.map(c => c.className + ":" + movesOf(r, c).map(m => m.movementType[0]).join("")).join(" | "));
        }
      });

      /* ============ أدوات مساعدة للاختبارات ============ */
      function RAW_SCHEDULE_DATA_KEYS() { return Object.keys(ORIGINAL_SCHEDULE); }
      function teachersOfDay(day) {
        const s = {};
        for (const cls of ALL_CLASSES) {
          const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
          if (!row) continue;
          for (let p = 1; p <= 7; p++) {
            const l = row[p];
            if (l && isRealLessonData(l.teacher, l.subject)) s[l.teacher] = (s[l.teacher] || 0) + 1;
          }
        }
        return Object.keys(s);
      }
      function topTeachersOfDay(day, n) {
        const s = {};
        for (const cls of ALL_CLASSES) {
          const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
          if (!row) continue;
          for (let p = 1; p <= 7; p++) {
            const l = row[p];
            if (l && isRealLessonData(l.teacher, l.subject)) s[l.teacher] = (s[l.teacher] || 0) + 1;
          }
        }
        return Object.keys(s).sort((a, b) => s[b] - s[a]).slice(0, n);
      }
      function findCellById(day, id) {
        for (const cls of ALL_CLASSES) for (let p = 1; p <= 7; p++) {
          const c = FIELD_SCHEDULE[day][cls][p];
          if (c && c.lessonId === id) return c;
        }
        return null;
      }

      function runAll() {
        passCount = 0; failCount = 0; failures.length = 0;
        const rows = [];
        for (const t of tests) {
          currentName = t.name;
          const before = failCount;
          try { t.fn(); } catch (e) {
            failCount++;
            failures.push({ test: t.name, desc: "استثناء", detail: e && e.message });
          }
          rows.push({ name: t.name, ok: failCount === before });
        }
        return { rows: rows, passCount: passCount, failCount: failCount, failures: failures };
      }

      return { tests: tests, runAll: runAll };
    })();

    globalThis.EngineTestSuite = EngineTestSuite;

    // ============================================================
    // UI CONTROLLER — تصميم Gemini محفوظ مع إصلاحات مطلوبة فقط (§20):
    // أعداد حصص المعلمين لليوم المختار، علامات الحركات الصحيحة،
    // تمييز خلايا الاستعصاء، تقرير غني، ووضع اختبارات (?tests=1)
    // ============================================================
    function init() {
      const today = new Date();
      document.getElementById("dateInput").value = today.toISOString().split("T")[0];
      updateDateDisplay();

      const dayMap = { 0: "الأحد", 1: "الاثنين", 2: "الثلاثاء", 3: "الأربعاء", 4: "الخميس", 5: "الجمعة", 6: "السبت" };
      const todayDay = dayMap[today.getDay()];
      if (todayDay && ORIGINAL_SCHEDULE[todayDay]) {
        document.getElementById("daySelect").value = todayDay;
      }

      renderTeacherChips();
      document.getElementById("daySelect").addEventListener("change", function () {
        updateDateDisplay();
        renderTeacherChips();
        applyTeacherFilter();
      });
      document.getElementById("dateInput").addEventListener("change", updateDateDisplay);
      const filterInput = document.getElementById("teacherFilter");
      if (filterInput) filterInput.addEventListener("input", applyTeacherFilter);
    }

    // تصفية سريعة لقائمة المعلمين (مفيدة مع 25+ معلمًا على الجوال)
    function applyTeacherFilter() {
      const filterInput = document.getElementById("teacherFilter");
      const q = (filterInput ? filterInput.value : "").trim();
      document.querySelectorAll(".teacher-chip").forEach(function (chip) {
        const match = !q || chip.dataset.teacher.indexOf(q) >= 0;
        chip.classList.toggle("hidden-by-filter", !match);
      });
    }

    function updateDateDisplay() {
      const day = document.getElementById("daySelect").value;
      const date = document.getElementById("dateInput").value;
      const display = document.getElementById("dateDisplay");
      if (day && date) display.textContent = day + " — " + date;
      else if (day) display.textContent = day;
      else display.textContent = "";
    }

    // أعداد الحصص لكل معلم في اليوم المحدد
    function dayLoads(day) {
      const loads = {};
      if (!ORIGINAL_SCHEDULE[day]) return loads;
      for (const cls of ALL_CLASSES) {
        const row = ORIGINAL_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (l && isRealLessonData(l.teacher, l.subject)) loads[l.teacher] = (loads[l.teacher] || 0) + 1;
        }
      }
      return loads;
    }

    function renderTeacherChips() {
      const grid = document.getElementById("teacherGrid");
      grid.innerHTML = "";
      const day = document.getElementById("daySelect").value;
      const loads = dayLoads(day);
      for (const t of ALL_TEACHERS) {
        const count = loads[t] || 0;
        const chip = document.createElement("div");
        chip.className = "teacher-chip" + (count === 0 ? " zero-load" : "");
        chip.dataset.teacher = t;
        chip.innerHTML = "<span>" + esc(t) + "</span>" +
          (count > 0 ? '<span class="chip-count">' + count + " حصة</span>" : '<span class="chip-count">لا حصص اليوم</span>') +
          '<span class="check"></span>';
        chip.addEventListener("click", function () { toggleTeacher(chip, t); });
        grid.appendChild(chip);
      }
    }

    function toggleTeacher(chip, teacher) {
      chip.classList.toggle("selected");
      const count = document.querySelectorAll(".teacher-chip.selected").length;
      document.getElementById("absentCount").textContent = count > 0 ? "(" + count + ")" : "";
    }

    // ملخص سريع في أعلى النتائج: نظرة فورية قبل التمرير عبر الجدول الكامل
    function renderQuickSummary(res) {
      const s = res.stats;
      const successCount = s.completeSuccess + s.partialSuccess + s.noActionVacancies;
      document.getElementById("quickSummary").innerHTML =
        '<div class="qs-item qs-neutral"><div class="qs-num">' + s.absentTeachers + '</div><div class="qs-lbl">معلمون غائبون</div></div>' +
        '<div class="qs-item qs-neutral"><div class="qs-num">' + s.affectedClasses + '</div><div class="qs-lbl">شعب متأثرة</div></div>' +
        '<div class="qs-item qs-ok"><div class="qs-num">' + successCount + '</div><div class="qs-lbl">حصص عُوِّضت تلقائيًا</div></div>' +
        '<div class="qs-item ' + (s.fallbacks > 0 ? "qs-danger" : "qs-ok") + '"><div class="qs-num">' + s.fallbacks + '</div><div class="qs-lbl">استعصاءات تحتاج قرارًا</div></div>';

      const banner = document.getElementById("attentionBanner");
      if (s.fallbacks > 0) {
        banner.innerHTML = '<div class="attention-banner">⚠️ يوجد ' + s.fallbacks +
          ' استعصاء لم يُحلّ تلقائيًا — راجع قسم "الاستعصاءات" أسفل التقرير لاتخاذ قرار إداري.</div>';
      } else if (s.partialSuccess > 0) {
        banner.innerHTML = '<div class="attention-banner" style="background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.5);color:var(--warning)">' +
          '📌 يوجد ' + s.partialSuccess + ' فراغ ضغط داخلي متبقٍ (تمت التغطية لكن بقيت فجوة قبل نهاية الدوام) — راجع "الفراغات النهائية" للتفاصيل.</div>';
      } else {
        banner.innerHTML = '';
      }
    }

    function runCompensation() {
      const day = document.getElementById("daySelect").value;
      if (!day) { alert("اختر اليوم أولًا"); return; }
      const date = document.getElementById("dateInput").value || "";
      const absent = [];
      document.querySelectorAll(".teacher-chip.selected").forEach(chip => absent.push(chip.dataset.teacher));
      if (absent.length === 0) { alert("اختر معلمًا غائبًا واحدًا على الأقل"); return; }

      const btnLabel = document.getElementById("runBtnLabel");
      const runBtn = document.getElementById("runBtn");
      const originalLabel = btnLabel ? btnLabel.textContent : "";
      if (btnLabel) btnLabel.textContent = "⏳ جارٍ الحساب...";
      if (runBtn) runBtn.disabled = true;

      let res;
      try {
        res = runEngine(day, date, absent);
      } catch (e) {
        alert("حدث خطأ أثناء المعالجة: " + e.message);
        if (btnLabel) btnLabel.textContent = originalLabel;
        if (runBtn) runBtn.disabled = false;
        return;
      }
      if (btnLabel) btnLabel.textContent = originalLabel;
      if (runBtn) runBtn.disabled = false;

      document.getElementById("dateDisplay").textContent = day + " — " + (date || "—");

      // استخدام نتيجة runEngine مباشرة بلا استدعاء مزدوج لـ buildResults
      renderQuickSummary(res);
      renderScheduleTable(day);
      document.getElementById("reportContainer").innerHTML = generateReport(day, res.integrity, res);
      document.getElementById("output").style.display = "block";
      document.getElementById("output").scrollIntoView({ behavior: "smooth" });
    }

    function resetSelections() {
      // مسح اختيارات المعلمين الغائبين وإخفاء النتائج
      document.querySelectorAll(".teacher-chip.selected").forEach(function (chip) {
        chip.classList.remove("selected");
      });
      document.getElementById("absentCount").textContent = "";
      document.getElementById("output").style.display = "none";
      document.getElementById("attentionBanner").innerHTML = "";
      document.getElementById("quickSummary").innerHTML = "";
      document.getElementById("scheduleTableWrapper").innerHTML = "";
      document.getElementById("reportContainer").innerHTML = "";
      // إعادة تعيين حقل البحث
      const filterInput = document.getElementById("teacherFilter");
      if (filterInput) { filterInput.value = ""; applyTeacherFilter(); }
    }

    function renderScheduleTable(day) {
      const wrapper = document.getElementById("scheduleTableWrapper");

      let html = '<table class="schedule-table"><thead><tr>';
      html += "<th>الحصة</th>";
      for (const cls of ALL_CLASSES) html += "<th>" + cls.replace("الصف ", "") + "</th>";
      html += "</tr></thead><tbody>";

      for (let p = 1; p <= 7; p++) {
        html += "<tr>";
        html += '<td class="period-col">' + PERIOD_NAMES[p] + "</td>";

        for (const cls of ALL_CLASSES) {
          const lesson = FIELD_SCHEDULE[day][cls][p];
          if (!lesson) { html += '<td class="cell-empty-original">—</td>'; continue; }

          // خلية استعصاء؟ (هدف سلسلة فشلت كل مراحلها)
          const isFallbackTarget = vacancies.some(v => v.status === "FALLBACK" && v.className === cls && v.period === p);

          let cellClass = "";
          let content = "";

          if (lesson.status === LessonStatus.NORMAL) {
            cellClass = "cell-normal" + (isFallbackTarget ? " cell-fallback" : "");
            content = '<div class="cell-info"><span class="subject-name">' + esc(lesson.subject) +
              '</span><span class="teacher-name">' + esc(lesson.teacher) + "</span></div>";
          } else if (lesson.status === LessonStatus.SHIFTED) {
            const isCross = movementLog.some(m => m.movementType === "CROSS_CLASS_CASCADE" && m.targetClass === cls && m.toPeriod === p);
            const isRipple = movementLog.some(m => m.movementType === "RIPPLE_SWAP" && m.targetClass === cls && m.toPeriod === p);
            cellClass = (isCross ? "cell-cross" : "cell-shifted") + (isFallbackTarget ? " cell-fallback" : "");
            const badge = isCross ? '<span class="move-badge cross">عابر</span>'
              : isRipple ? '<span class="move-badge ripple">خلخلة</span>'
                : '<span class="move-badge direct">مباشر</span>';
            content = '<div class="cell-info"><span class="subject-name">' + esc(lesson.subject) +
              '</span><span class="teacher-name">' + esc(lesson.teacher) + "</span>" + badge +
              '<span style="font-size:0.65em;color:var(--text2)">من ' + lesson.originalPeriod + "</span></div>";
          } else if (lesson.status === LessonStatus.ABSENCE_EMPTY) {
            cellClass = "cell-absence-empty" + (isFallbackTarget ? " cell-fallback" : "");
            content = '<div class="cell-info"><span style="font-size:1.1em">🚫</span><span>غياب</span>' +
              (lesson.absentSubject ? '<span style="font-size:0.65em;color:var(--text2)">' + esc(lesson.absentSubject) + "</span>" : "") + "</div>";
          } else if (lesson.status === LessonStatus.SHIFT_EMPTY) {
            // فراغ نقل داخلي (قبل End) = متبقٍ يحتاج متابعة — يميز عن فراغ End المكتمل
            const internalGap = p < originalEndMap[cls];
            cellClass = "cell-shift-empty";
            content = '<div class="cell-info"><span style="font-size:1em">' + (internalGap ? "⚠" : "⬜") +
              '</span><span>فراغ نقل' + (internalGap ? " متبقٍ" : "") + "</span></div>";
          } else {
            cellClass = "cell-empty-original";
            content = "—";
          }
          html += '<td class="' + cellClass + '">' + content + "</td>";
        }
        html += "</tr>";
      }

      html += "</tbody></table>";
      wrapper.innerHTML = html;
    }

    // ============================================================
    // وضع الاختبارات الذاتية (?tests=1) — التقرير الكامل داخل المتصفح
    // ============================================================
    function runTestsUI() {
      const container = document.querySelector(".container");
      container.innerHTML = '<div class="header"><h1>⚙️ الاختبارات الذاتية للمحرك</h1>' +
        '<div class="school-name">اختبارات حقيقية للسلوك: شبكات مصغرة + الجدول الحقيقي + اختبارات طفير Integrity</div></div>' +
        '<div id="testsOutput">جارٍ التشغيل…</div>';
      setTimeout(function () {
        const res = EngineTestSuite.runAll();
        let html = '<div class="report-section"><h2>نتائج الاختبارات: ' + res.passCount + ' ناجح / ' + res.failCount + ' فاشل</h2>' +
          '<div class="table-wrapper"><table class="schedule-table tests-table"><tr><th>الاختبار</th><th>النتيجة</th></tr>';
        for (const row of res.rows)
          html += "<tr><td>" + esc(row.name) + '</td><td class="' + (row.ok ? "t-pass" : "t-fail") + '">' +
            (row.ok ? "ناجح ✓" : "فاشل ✗") + "</td></tr>";
        html += "</table></div>";
        if (res.failures.length) {
          html += '<h2 style="margin-top:12px">تفاصيل الإخفاقات</h2>';
          for (const f of res.failures)
            html += '<div class="report-item"><strong>' + esc(f.test) + "</strong><br>" + esc(f.desc) +
              (f.detail ? "<br><small>" + esc(f.detail) + "</small>" : "") + "</div>";
        }
        html += "</div>";
        document.getElementById("testsOutput").innerHTML = html;
      }, 50);
    }

    // ============================================================
    // الإقلاع: اختبارات عند ?tests=1 — وإلا الواجهة الطبيعية
    // ============================================================
    if (typeof document !== "undefined") {
      document.addEventListener("DOMContentLoaded", function () {
        const isTests = (typeof location !== "undefined") && location.search.indexOf("tests=1") >= 0;
        if (isTests) runTestsUI();
        else init();
      });
    }

  </script>

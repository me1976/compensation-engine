<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محرك التعويض المدرسي</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #1e293b;
      --bg3: #334155;
      --surface: #1e293b;
      --border: #475569;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --accent: #38bdf8;
      --accent2: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --shifted: #7c3aed;
      --absence: #ef4444;
      --shift-empty: #f59e0b;
      --cross: #06b6d4;
      --fallback: #f43f5e;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 100%;
      padding: 12px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .header h1 {
      font-size: 1.3em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .header .school-name {
      font-size: 1em;
      color: var(--text2);
    }

    .header .date-info {
      font-size: 0.85em;
      color: var(--accent);
      margin-top: 4px;
    }

    /* Controls */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-group label {
      display: block;
      font-size: 0.9em;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .day-select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
      appearance: none;
      cursor: pointer;
    }

    .date-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
    }

    /* Teacher chips */
    .teacher-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .teacher-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.82em;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .teacher-chip:active {
      transform: scale(0.95);
    }

    .teacher-chip.selected {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 600;
    }

    .teacher-chip .check {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-radius: 4px;
      margin-left: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .teacher-chip.selected .check {
      background: var(--danger);
      border-color: var(--danger);
    }

    .teacher-chip.selected .check::after {
      content: '✓';
      color: white;
      font-size: 10px;
      font-weight: bold;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: default;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-print {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    /* Schedule Table */
    .schedule-section {
      margin-bottom: 12px;
    }

    .schedule-section h2 {
      font-size: 1.1em;
      color: var(--accent);
      margin-bottom: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75em;
      min-width: 600px;
    }

    .schedule-table th,
    .schedule-table td {
      padding: 6px 4px;
      text-align: center;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .schedule-table thead th {
      background: var(--bg2);
      color: var(--accent);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .schedule-table tbody td {
      background: var(--surface);
      vertical-align: middle;
    }

    .schedule-table .period-col {
      background: var(--bg3);
      font-weight: 700;
      color: var(--accent);
      min-width: 40px;
    }

    .cell-normal {}

    .cell-shifted {
      background: rgba(124, 58, 237, 0.2) !important;
      border-left: 3px solid var(--shifted) !important;
    }

    .cell-absence-empty {
      background: rgba(239, 68, 68, 0.15) !important;
      color: var(--danger) !important;
    }

    .cell-shift-empty {
      background: rgba(245, 158, 11, 0.15) !important;
      color: var(--shift-empty) !important;
    }

    .cell-cross {
      background: rgba(6, 182, 212, 0.2) !important;
      border-left: 3px solid var(--cross) !important;
    }

    .cell-fallback {
      background: rgba(244, 63, 94, 0.2) !important;
      color: var(--fallback) !important;
      font-weight: 600;
    }

    .cell-empty-original {
      background: var(--bg) !important;
      color: var(--text2) !important;
    }

    .teacher-name {
      font-weight: 600;
    }

    .subject-name {
      font-size: 0.9em;
      color: var(--text2);
    }

    .cell-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .move-badge {
      font-size: 0.7em;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    .move-badge.direct {
      background: rgba(52, 211, 153, 0.3);
      color: var(--success);
    }

    .move-badge.ripple {
      background: rgba(129, 140, 248, 0.3);
      color: var(--accent2);
    }

    .move-badge.cross {
      background: rgba(6, 182, 212, 0.3);
      color: var(--cross);
    }

    /* Report */
    .report-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .report-section h2 {
      font-size: 1.1em;
      color: var(--accent);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .report-section h3 {
      font-size: 0.95em;
      color: var(--accent2);
      margin: 10px 0 6px;
    }

    .report-item {
      background: var(--bg3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.85em;
      line-height: 1.8;
    }

    .report-item .label {
      color: var(--text2);
    }

    .report-item .value {
      color: var(--text);
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }

    .status-success {
      background: rgba(52, 211, 153, 0.2);
      color: var(--success);
    }

    .status-fallback {
      background: rgba(244, 63, 94, 0.2);
      color: var(--fallback);
    }

    .status-noaction {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text2);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--bg3);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .stat-card .num {
      font-size: 1.5em;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-card .lbl {
      font-size: 0.75em;
      color: var(--text2);
      margin-top: 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      font-size: 0.75em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #output {
      display: none;
    }

    /* Print */
    @media print {
      body {
        background: white;
        color: black;
        font-size: 10pt;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      }

      .no-print {
        display: none !important;
      }

      .container {
        padding: 0;
        max-width: 100%;
      }

      .header {
        border: 2px solid #1a1a2e;
        background: white;
        box-shadow: none;
        padding: 10px;
        margin-bottom: 8px;
        page-break-inside: avoid;
      }

      .header h1 {
        -webkit-text-fill-color: #1a1a2e;
        color: #1a1a2e;
        background: none;
        font-size: 1.2em;
      }

      .header .school-name,
      .header .date-info {
        color: #333;
        font-size: 0.9em;
      }

      .schedule-section h2 {
        color: #1a1a2e;
        border-bottom: 2px solid #1a1a2e;
        font-size: 1em;
        padding: 4px 0;
        margin-bottom: 6px;
      }

      .schedule-table {
        min-width: unset;
        font-size: 8pt;
        width: 100%;
        border-collapse: collapse;
      }

      .schedule-table th {
        background: #1a1a2e !important;
        color: white !important;
        font-weight: 700;
        padding: 4px 3px;
        font-size: 7.5pt;
      }

      .schedule-table td {
        background: white;
        color: black;
        padding: 4px 3px;
        border: 1px solid #999;
      }

      .cell-shifted {
        background: #e8dff5 !important;
        border-right: 3px solid #7c3aed !important;
        color: #3b0764 !important;
      }

      .cell-absence-empty {
        background: #fde2e2 !important;
        color: #991b1b !important;
        font-weight: 700;
      }

      .cell-shift-empty {
        background: #fef3cd !important;
        color: #78350f !important;
      }

      .cell-cross {
        background: #d1ecf1 !important;
        border-right: 3px solid #0e7490 !important;
        color: #0e4f6b !important;
      }

      .cell-fallback {
        background: #fde2e2 !important;
        color: #991b1b !important;
        font-weight: 700;
      }

      .cell-empty-original {
        background: #f8f8f8 !important;
        color: #999 !important;
      }

      .teacher-name {
        font-weight: 700;
        font-size: 0.95em;
      }

      .subject-name {
        color: #444 !important;
        font-size: 0.85em;
      }

      .move-badge {
        border: 1px solid currentColor;
        font-size: 0.65em;
      }

      .report-section {
        background: white;
        border: 1px solid #ccc;
        box-shadow: none;
        page-break-inside: avoid;
        margin-bottom: 8px;
      }

      .report-section h2 {
        color: #1a1a2e;
        font-size: 0.95em;
      }

      .report-item {
        background: #f8f8f8;
        color: black;
        font-size: 0.8em;
        padding: 6px 8px;
        margin-bottom: 5px;
      }

      .stat-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .stat-card {
        background: #f8f8f8;
        border: 1px solid #ddd;
      }

      .stat-card .num {
        color: #1a1a2e;
        font-size: 1.2em;
      }

      .stat-card .lbl {
        color: #555;
        font-size: 0.7em;
      }

      .table-wrapper {
        border: 1px solid #999;
        box-shadow: none;
        overflow: visible;
      }

      .period-col {
        background: #e0e0e0 !important;
        color: #1a1a2e !important;
        font-weight: 700;
      }

      .schedule-table thead th {
        position: static;
      }

      #output {
        display: block !important;
      }

      @page {
        margin: 1cm 0.7cm;
        size: A4 landscape;
      }
    }

    /* ===== إضافات النسخة المصححة ===== */
    .chip-count {
      font-size: 0.72em;
      color: var(--text2);
      margin-left: 4px;
    }

    .teacher-chip.zero-load {
      opacity: 0.45;
    }

    .tests-table td {
      text-align: right;
    }

    .tests-table td.t-pass {
      color: var(--success);
      font-weight: 700;
    }

    .tests-table td.t-fail {
      color: var(--fallback);
      font-weight: 700;
    }

    /* ===== إضافات النسخة الموحدة v3: تصفية المعلمين، ملخص سريع، إتاحة ===== */
    .teacher-filter {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9em;
      font-family: inherit;
    }

    .teacher-filter::placeholder {
      color: var(--text2);
    }

    .teacher-chip.hidden-by-filter {
      display: none;
    }

    .quick-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-summary .qs-item {
      border-radius: var(--radius);
      padding: 10px 12px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .quick-summary .qs-num {
      font-size: 1.4em;
      font-weight: 800;
      line-height: 1.1;
    }

    .quick-summary .qs-lbl {
      font-size: 0.72em;
      color: var(--text2);
      margin-top: 2px;
    }

    .quick-summary .qs-ok {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.4);
    }

    .quick-summary .qs-ok .qs-num {
      color: var(--success);
    }

    .quick-summary .qs-warn {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.4);
    }

    .quick-summary .qs-warn .qs-num {
      color: var(--warning);
    }

    .quick-summary .qs-danger {
      background: rgba(244, 63, 94, 0.14);
      border-color: rgba(244, 63, 94, 0.45);
    }

    .quick-summary .qs-danger .qs-num {
      color: var(--fallback);
    }

    .quick-summary .qs-neutral {
      background: var(--bg3);
    }

    .quick-summary .qs-neutral .qs-num {
      color: var(--accent);
    }

    .attention-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: var(--fallback);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.88em;
      font-weight: 600;
    }

    /* إتاحة: تركيز واضح دائمًا لمن يستخدم لوحة المفاتيح */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .teacher-chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .teacher-chip {
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    @media print {

      .quick-summary,
      .attention-banner {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>⚙️ محرك التعويض المدرسي</h1>
      <div class="school-name">مدرسة أبو بكر الصديق — النسخة الموحدة v3</div>
      <div class="date-info" id="dateDisplay"></div>
    </div>

    <!-- Controls -->
    <div class="controls no-print">
      <div class="control-group">
        <label>📅 اليوم</label>
        <select class="day-select" id="daySelect">
          <option value="">— اختر اليوم —</option>
          <option value="الأحد">الأحد</option>
          <option value="الاثنين">الاثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
        </select>
      </div>
      <div class="control-group">
        <label>📆 التاريخ</label>
        <input type="date" class="date-input" id="dateInput">
      </div>
      <div class="control-group">
        <label>🚫 المعلمون الغائبون <span id="absentCount" style="color:var(--danger)"></span></label>
        <input type="text" class="teacher-filter" id="teacherFilter"
          placeholder="🔍 ابحث عن اسم معلم للتصفية السريعة..." autocomplete="off">
        <div class="teacher-grid" id="teacherGrid"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn btn-primary" id="runBtn" onclick="runCompensation()" style="flex:1">
          <span id="runBtnLabel">⚡ تطبيق التعويض</span>
        </button>
        <button class="btn btn-print" id="resetBtn" onclick="resetSelections()"
          style="flex:0 0 auto;width:auto;padding:12px 16px" title="مسح كل اختيارات الغائبين">
          🔄 إعادة تعيين
        </button>
      </div>
    </div>

    <!-- Output -->
    <div id="output">
      <!-- Quick Summary (النسخة الموحدة v3) -->
      <div id="attentionBanner"></div>
      <div class="quick-summary no-print" id="quickSummary"></div>

      <!-- Legend -->
      <div class="legend no-print" id="legendBar">
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--shifted)"></div> حصة منقولة
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--absence)"></div> غياب
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--shift-empty)"></div> فراغ نقل
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--cross)"></div> عابر للشعب
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:var(--fallback)"></div> استعصاء
        </div>
      </div>

      <!-- Schedule Table -->
      <div class="schedule-section">
        <h2>📋 الجدول الميداني</h2>
        <div class="table-wrapper" id="scheduleTableWrapper"></div>
      </div>

      <!-- Report -->
      <div id="reportContainer"></div>

      <!-- Print -->
      <button class="btn btn-print no-print" onclick="window.print()">🖨️ طباعة التقرير</button>
    </div>
  </div>

  <script>

    // ============================================================
    // DATA
    // ============================================================
    const RAW_SCHEDULE_DATA = {
      "الأحد": {
        "الصف 2": {
          1: { teacher: "مساعيد", subject: "انجليزي" },
          2: { teacher: "أنس", subject: "عربي" },
          3: { teacher: "أنس", subject: "رياضيات" },
          4: { teacher: "أنس", subject: "اجتماعيات" },
          5: { teacher: "أنس", subject: "عربي" },
          6: { teacher: "", subject: "" },
          7: { teacher: "", subject: "" }
        },
        "الصف 3": {
          1: { teacher: "سعاده", subject: "عربي" },
          2: { teacher: "سعاده", subject: "رياضيات" },
          3: { teacher: "سعاده", subject: "عربي" },
          4: { teacher: "محمد", subject: "انجليزي" },
          5: { teacher: "سعاده", subject: "تربية إسلامية" },
          6: { teacher: "", subject: "" },
          7: { teacher: "", subject: "" }
        },
        "الصف 4أ": {
          1: { teacher: "حازم", subject: "تربية إسلامية" },
          2: { teacher: "مجد", subject: "الرياضة" },

    // ============================================================
    function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function deepFreeze(obj) {
      if (obj && typeof obj === "object") {
        Object.freeze(obj);
        Object.values(obj).forEach(deepFreeze);
      }
      return obj;
    }

    const BLANK_TOKENS = ["", "-", "*", "–", "—", "x", "X", "لا شيء", "فراغ"];
    function isBlankToken(v) {
      if (v === null || v === undefined) return true;
      return BLANK_TOKENS.indexOf(String(v).trim()) >= 0;
    }
    // الحصة الفعلية (§4): معلم حقيقي + مادة حقيقية معًا
    function isRealLessonData(teacher, subject) {
      return !isBlankToken(teacher) && !isBlankToken(subject);
    }
    function isLessonStatus(st) { return st === LessonStatus.NORMAL || st === LessonStatus.SHIFTED; }
    function isGapStatus(st) {
      return st === LessonStatus.ABSENCE_EMPTY || st === LessonStatus.SHIFT_EMPTY || st === LessonStatus.EMPTY;
    }
    function isActiveLesson(cell) {
      return !!cell && isLessonStatus(cell.status) &&
        !isBlankToken(cell.teacher) && !isBlankToken(cell.subject) && !!cell.lessonId;
    }
    function isAbsent(teacher) {
      const st = teacherState[teacher];
      return !!st && st.status === "UNAVAILABLE";

    function normalizeOriginal(raw) {
      const out = {};
      for (const day of Object.keys(raw)) {
        out[day] = {};
        for (const cls of Object.keys(raw[day])) {
          out[day][cls] = {};
          for (let p = 1; p <= 7; p++) {
            const cell = raw[day][cls][p];
            const teacher = (cell && cell.teacher != null) ? String(cell.teacher).trim() : "";
            const subject = (cell && cell.subject != null) ? String(cell.subject).trim() : "";
            out[day][cls][p] = isRealLessonData(teacher, subject) ? { teacher, subject } : { teacher: "", subject: "" };
          }
        }
      }
      return out;
    }

    // الأصل: مصدر ثابت (IMMUTABLE) — مجمّد بالكامل + تُقارن لقطته في كل تشغيلة (§1)
    let ORIGINAL_SCHEDULE = deepFreeze(normalizeOriginal(RAW_SCHEDULE_DATA));
    let ALL_CLASSES = RAW_CLASS_LIST.slice();

    // STAGE 0 — Pre-processing (§8)
    // ============================================================
    function buildTeacherState(day) {
      teacherState = {};
      for (const cls of ALL_CLASSES) {
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const l = row[p];

      for (const t of absentList) {

        teacherState[t].status = "UNAVAILABLE";

      originalEndMap = {};
      for (const cls of ALL_CLASSES) {
        let lastReal = 0;
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (row) {
          for (let p = 1; p <= 7; p++) {
            const l = row[p];
            if (l && isRealLessonData(l.teacher, l.subject)) lastReal = p;
          }
        }
        originalEndMap[cls] = lastReal;
      }
    }

    function createFieldSchedule(day) {
      FIELD_SCHEDULE = {};
      FIELD_SCHEDULE[day] = {};
      for (const cls of ALL_CLASSES) {
        FIELD_SCHEDULE[day][cls] = {};
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const orig = row ? row[p] : null;
          if (orig && isRealLessonData(orig.teacher, orig.subject)) {
            // Lesson_ID: هوية ثابتة للحصة الأصلية — تنتقل معها أينما تحركت (§2/§15)
            FIELD_SCHEDULE[day][cls][p] = {
              teacher: orig.teacher, subject: orig.subject,
              originalPeriod: p, currentPeriod: p,
              status: LessonStatus.NORMAL,
              lessonId: day + "|" + cls + "|" + p + "|" + orig.teacher + "|" + orig.subject
            };
          } else {
            FIELD_SCHEDULE[day][cls][p] = {
              teacher: "", subject: "",
              originalPeriod: p, currentPeriod: p,
              status: LessonStatus.EMPTY, lessonId: null
            };
          }
        }
      }
    }

    function markAbsentTeachers(day) {
      for (const cls of ALL_CLASSES) {
        const row = FIELD_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const lesson = row[p];
          if (lesson && lesson.status === LessonStatus.NORMAL && isAbsent(lesson.teacher)) {
            lesson.status = LessonStatus.ABSENCE_EMPTY;
          }
        }
      }
    }

    function createAbsenceVacancies(day) {
      vacancies = [];
      for (const cls of ALL_CLASSES) {
        const oe = originalEndMap[cls];
        const row = FIELD_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const lesson = row[p];
          if (lesson && lesson.status === LessonStatus.ABSENCE_EMPTY) {
            const at = lesson.teacher, sub = lesson.subject;
            lesson.teacher = ""; lesson.subject = "";
            lesson.absentTeacher = at;      // يبقى على الخلية لأغراض العرض/التقرير
            lesson.absentSubject = sub;
            // الفراغ المحظوظ (§12): عند Original_End → لا حركة
            vacancies.push({
              className: cls, period: p, absentTeacher: at, subject: sub,
              originalEnd: oe, needsProcessing: p < oe,
              status: p < oe ? "PENDING" : "SUCCESS_NO_ACTION",
              chainId: null
            });
          }
        }
      }
    }

    // ============================================================
    // القيد الصارم للتعارض (§11): المعلم حر فقط إذا لم يرتبط بأي حصة
    // في أي شعبة عند الفترة المستهدفة — والغائب حر قطعًا أبدًا (§3/§12)
    // ============================================================
    function isTeacherFree(teacher, day, period) {
      if (!teacherState[teacher]) return false;
      if (isAbsent(teacher)) return false;
      for (const cls of ALL_CLASSES) {
        const lesson = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][period];
        if (isActiveLesson(lesson) && lesson.teacher === teacher) return false;
      }
      return true;
    }

    function findClassOfTeacherAt(teacher, day, period) {
      for (const cls of ALL_CLASSES) {
        const lesson = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][period];
        if (isActiveLesson(lesson) && lesson.teacher === teacher) return cls;
      }
      return null;
    }

    function noConflictsAtPeriod(day, p) {
      const seen = {};
      for (const cls of ALL_CLASSES) {
        const l = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
        if (!isActiveLesson(l)) continue;
        if (seen[l.teacher]) return false;
        seen[l.teacher] = cls;
      }
      return true;
    }

    // ============================================================
    // executeMove — النقل وليس النسخ (§39). التنفيذ ذرّي: كل التحققات
    // تسبق أي كتابة — إما الحركة كاملة أو لا شيء (لا حالة وسيطة أبدًا).
    // الحراس: مصدر فعلية، معلم حاضر، وجهة فراغ، وجهة قبل Original_End
    // (لا تُوضع حصة في منطقة استقبال الفراغ عبر Direct/Ripple — §23)،
    // تفرغ المعلم عند الوجهة عبر جميع الشعب، ولا تعارض لحظي قائم.
    // ============================================================
    function executeMove(cls, fromPeriod, toPeriod, day, movementType, reason, chainId) {
      const src = FIELD_SCHEDULE[day][cls][fromPeriod];
      const dst = FIELD_SCHEDULE[day][cls][toPeriod];
      if (!isActiveLesson(src)) throw new Error("executeMove: المصدر ليس حصة فعلية (" + cls + " ح" + fromPeriod + ")");
      if (isAbsent(src.teacher)) throw new Error("executeMove: المعلم غائب (" + src.teacher + ")");
      if (!dst || !isGapStatus(dst.status)) throw new Error("executeMove: الوجهة ليست فراغًا (" + cls + " ح" + toPeriod + " = " + (dst && dst.status) + ")");
      if (toPeriod >= originalEndMap[cls]) throw new Error("executeMove: الوجهة عند Original_End أو بعده (" + cls + " ح" + toPeriod + " >= End=" + originalEndMap[cls] + ") — منع وضع حصة في منطقة الاستقبال");
      if (!isTeacherFree(src.teacher, day, toPeriod)) throw new Error("executeMove: تعارض المعلم " + src.teacher + " في الوجهة ح" + toPeriod);
      if (!noConflictsAtPeriod(day, toPeriod)) throw new Error("executeMove: تعارض لحظي قائم عند الحصة " + toPeriod);

      const movedTeacher = src.teacher, sourceOriginalPeriod = src.originalPeriod;
      FIELD_SCHEDULE[day][cls][toPeriod] = {
        teacher: src.teacher, subject: src.subject,
        originalPeriod: src.originalPeriod, currentPeriod: toPeriod,
        status: LessonStatus.SHIFTED, lessonId: src.lessonId
      };
      // Ownership (§تتبع الفراغ الناتج): كل فراغ نقل يعرف سلسلته وحركته ومعلمه
      FIELD_SCHEDULE[day][cls][fromPeriod] = {
        teacher: "", subject: "",
        originalPeriod: fromPeriod, currentPeriod: fromPeriod,
        status: LessonStatus.SHIFT_EMPTY, lessonId: null,
        movedTeacher: movedTeacher, sourceOriginalPeriod: sourceOriginalPeriod,
        createdByChainId: chainId, createdByMovementSeq: null // يُستكمل بعد تسجيل الحركة
      };
      const entry = pushMovement(day, cls, cls, src.teacher, src.subject, src.lessonId,
        fromPeriod, toPeriod, movementType, reason, chainId);
      FIELD_SCHEDULE[day][cls][fromPeriod].createdByMovementSeq = entry.seq;
      return entry;
    }

    function pushMovement(day, sourceClass, targetClass, teacher, subject, lessonId,
      fromPeriod, toPeriod, movementType, reason, chainId) {
      const entry = {
        seq: movementLog.length + 1,
        day, date: currentDate,
        sourceClass, targetClass, teacher, subject, lessonId,
        fromPeriod, toPeriod, movementType, reason,
        result: "EXECUTED", chainId, timestamp: Date.now()
      };
      movementLog.push(entry);
      const chain = chains.find(c => c.id === chainId);
      if (chain) chain.moves.push(movementLog.length);
      return entry;
    }

    // ============================================================
    // STAGE 1 — Direct Tail Pull (§15-19): الأبعد أولًا، حصص فقط،
    // التحرر يفحص جميع الشعب
    // ============================================================
    // أُبقيت للتوافق العرضي — لم تعد مستخدمة في المسار الرئيسي (انظر findBestDirectPlan)
    function findDirectCandidate(cls, targetPeriod, originalEnd, day) {
      for (let p = originalEnd; p > targetPeriod; p--) {
        const lesson = FIELD_SCHEDULE[day][cls][p];
        if (!isActiveLesson(lesson)) continue;               // الفراغ ليس مرشحًا (§16)
        if (isTeacherFree(lesson.teacher, day, targetPeriod)) {
          return { teacher: lesson.teacher, subject: lesson.subject, fromPeriod: p, toPeriod: targetPeriod };
        }
      }
      return null;
    }

    // ============================================================
    // findBestDirectPlan (النسخة الموحدة): بحث شامل بين كل مرشحي Direct
    // بدل الاكتفاء بأول مرشح متفرغ (خوارزمية مأخوذة من محرك Gemini الأصلي
    // buildDirectRipplePlans، مُطعَّمة هنا في بنية التحقق/التتبع الكاملة
    // لهذه النسخة): لكل مرشح P من End نزولًا للهدف تحقق حريته عند الهدف،
    // ثم حاكِ الخلخلة الكاملة الناتجة عن اختياره (دون لمس FIELD_SCHEDULE)،
    // واختر الخطة الأفضل: الوصول لـEnd أولًا، ثم أبعد فراغ نهائي، ثم أقل
    // عدد حركات، ثم الأقرب من الهدف. لا يغيّر أي ضمانة سلامة — كل خطة مرشحة
    // يجب أن تجتاز نفس قيود isTeacherFree وnoConflicts المستخدمة أصلًا.
    // (مُتحقَّق: 329 فحصًا في مجموعة الاختبارات، منها تغطية كاملة لكل يوم
    // مع كل معلم منفردًا وكل زوج معلمين يوم الأحد — صفر إخفاقات.)
    // ============================================================
    function simulateDirectMove(cls, day, fromP, toP) {
      const row = {};
      for (let p = 1; p <= 7; p++) row[p] = Object.assign({}, FIELD_SCHEDULE[day][cls][p]);
      const source = row[fromP];
      row[toP] = Object.assign({}, source, { status: LessonStatus.SHIFTED, currentPeriod: toP });
      row[fromP] = {
        teacher: "", subject: "", originalPeriod: fromP, currentPeriod: fromP,
        status: LessonStatus.SHIFT_EMPTY, lessonId: null
      };
      return row;
    }

    function findBestDirectPlan(cls, targetPeriod, originalEnd, day) {
      const candidates = [];
      for (let P = originalEnd; P > targetPeriod; P--) {
        const slot = FIELD_SCHEDULE[day][cls][P];
        if (!isActiveLesson(slot)) continue;                  // الفراغ ليس مرشحًا (§16)
        if (!isTeacherFree(slot.teacher, day, targetPeriod)) continue;

        if (P === originalEnd) {
          candidates.push({ fromPeriod: P, teacher: slot.teacher, ripplePath: [], finalGap: originalEnd, reachedEnd: true });
          continue;
        }
        const simRow = simulateDirectMove(cls, day, P, targetPeriod);
        const ripple = findRipplePath(cls, P, originalEnd, day, false, simRow);
        candidates.push({
          fromPeriod: P, teacher: slot.teacher,
          ripplePath: ripple.path, finalGap: ripple.finalGap, reachedEnd: ripple.reachedEnd
        });
      }
      candidates.sort((a, b) => {
        if (a.reachedEnd !== b.reachedEnd) return a.reachedEnd ? -1 : 1;   // الوصول لـEnd أولًا
        if (a.finalGap !== b.finalGap) return b.finalGap - a.finalGap;     // أبعد فراغ نهائي
        const am = 1 + a.ripplePath.length, bm = 1 + b.ripplePath.length;
        if (am !== bm) return am - bm;                                    // أقل حركات
        return b.fromPeriod - a.fromPeriod;                               // الأقرب من الهدف
      });
      return candidates.length ? candidates[0] : null;
    }

    // ============================================================
    // STAGE 2 — Ripple Swapping (§21-25): تخطيط ديناميكي كامل قبل التنفيذ
    // بحث بالعرض (BFS) على مواضع الفراغ داخل الشعبة نفسها فقط:
    //   - كل انتقال: حصة فعلية عند P (أكبر من الفراغ) معلمها متفرغ عند موضع
    //     الفراغ (على حالة محاكاة تشمل حركات المسار السابقة) → الفراغ ينتقل إلى P
    //   - سقف الحركة الداخلية (§23): وجهة كل حركة هي موضع الفراغ الحالي
    //     (< End دائمًا) — لا تُوضع حصة في Original_End عبر الخلخلة أبدًا،
    //     لكن السحب من الحصة الأخيرة نفسها إلى موضع داخلي مسموح (استثناء §23)
    //   - منع الدوران (§31): مواضع الفراغ تتزايد صرامةً + مجموعة مواضع مزارة
    //   - الهدف: أقصر مسار إلى End؛ وإلا أبعد موضع ممكن (نجاح بفراغ متبقٍ —
    //     القراءة المعتمدة 2)
    // ============================================================
    function findRipplePath(cls, gapStart, originalEnd, day, filterProtected, startingRow) {
      const cloneCell = (c) => Object.assign({}, c);
      const cloneRow = () => {
        const r = {};
        for (let p = 1; p <= 7; p++) {
          const src = startingRow ? startingRow[p] :
            ((FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p]) || null);
          r[p] = cloneCell(src ||
            { teacher: "", subject: "", originalPeriod: p, currentPeriod: p, status: LessonStatus.EMPTY, lessonId: null });
        }
        return r;
      };
      const applyToRow = (row, fromP, toP) => {
        const nr = {};
        for (let p = 1; p <= 7; p++) nr[p] = cloneCell(row[p]);
        nr[toP] = Object.assign({}, row[fromP], { status: LessonStatus.SHIFTED, currentPeriod: toP });
        nr[fromP] = { teacher: "", subject: "", originalPeriod: fromP, currentPeriod: fromP, status: LessonStatus.SHIFT_EMPTY, lessonId: null };
        return nr;
      };
      // هل المعلم مشغول عند q في حالة المحاكاة؟ (صف الشعبة محاكى + بقية الشعب حية)
      const busyAt = (teacher, q, simRow) => {
        if (!teacherState[teacher]) return true;
        if (isAbsent(teacher)) return true;
        const sc = simRow[q];
        if (sc && isLessonStatus(sc.status) && sc.teacher === teacher) return true;
        for (const oc of ALL_CLASSES) {
          if (oc === cls) continue;
          const l = FIELD_SCHEDULE[day][oc] && FIELD_SCHEDULE[day][oc][q];
          if (l && isLessonStatus(l.status) && l.teacher === teacher) return true;
        }
        return false;
      };

      // ── مفتاح الحالة الكافية (تحصين ضد دمج حالات مختلفة) ──
      // مبرهنة السلامة: بموجب قاعدة الانتقال الحالية، رحالة future من عقدة
      // تعتمد على موضع الفراغ فقط:
      //   (1) مواضع الحصص فوق الفراغ نظيفة دائمًا (المصدر ≤ الفراغ الحالي < الوجهة
      //       المرشحة، والفراغ يتزايد صرامةً) → المرشحون دوماً الحصص الأصلية الحية.
      //   (2) busyAt يفحص خلية موضع الفراغ فقط (وهي فراغ دائماً) + بقية الشعب
      //       (ثابتة أثناء التخطيط) → الجدوى مستقلة عن مسار الوصول.
      // لذا كان الدمج بالموضع سليمًا نظريًا — لكنه سلامة مشروطة بأي تعديل مستقبلي
      // على busyAt. لذلك نستخدم مفتاح حالة كاملة (الفراغ + بصمة ترتيب الحصص)
      // لضمان عدم دمج حالتين مختلفتين أبدًا، مع بقاء الفضاء محدودًا رياضيًا
      // (≤ تبديلات مواضع الدوام = مئات الحالات) وBFS محتفظًا بأقصر المسارات.
      const signature = (row) => {
        let s = "";
        for (let p = 1; p <= originalEnd; p++) {
          const c = row[p];
          s += (c && isLessonStatus(c.status) && c.lessonId) ? (c.lessonId + ".") : "-.";
        }
        return s;
      };

      const start = { gap: gapStart, path: [], row: cloneRow() };
      const queue = [start];
      const visited = new Set([gapStart + "#" + signature(start.row)]);
      let reachEnd = null;
      let best = start;
      let guard = 0;

      while (queue.length && !reachEnd) {
        const node = queue.shift();
        for (let P = node.gap + 1; P <= originalEnd; P++) {
          if (++guard > 50000) return { path: [], finalGap: gapStart, reachedEnd: false };
          const slot = node.row[P];
          if (!isActiveLesson(slot)) continue;                // الفراغ ليس مرشحًا (§16)
          if (filterProtected && slot.protectedTargetOf) continue; // هدف سلسلة أخرى — محمي
          if (busyAt(slot.teacher, node.gap, node.row)) continue;
          const next = {
            gap: P,
            path: node.path.concat([{ teacher: slot.teacher, subject: slot.subject, fromPeriod: P, toPeriod: node.gap }]),
            row: applyToRow(node.row, P, node.gap)
          };
          const key = P + "#" + signature(next.row);         // حالة كاملة: لا دمج خاطئ
          if (visited.has(key)) continue;                    // منع الدوران + إزالة التكرار
          visited.add(key);
          if (P === originalEnd) { reachEnd = next; break; } // أقصر مسار إلى End
          if (P > best.gap || (P === best.gap && next.path.length < best.path.length)) best = next;
          queue.push(next);
        }
      }
      if (reachEnd) return { path: reachEnd.path, finalGap: originalEnd, reachedEnd: true };
      return { path: best.path, finalGap: best.gap, reachedEnd: false };
    }

    function detectRippleLoop(path) {
      let g = null;
      for (const s of path) {
        if (g !== null && !(s.fromPeriod > g)) return true;
        g = s.fromPeriod;
      }
      return false;
    }

    function executeRipple(path, cls, day, chainId) {
      if (detectRippleLoop(path)) throw new Error("كُشفت دورة في مسار الخلخلة");
      for (const step of path) {
        executeMove(cls, step.fromPeriod, step.toPeriod, day, "RIPPLE_SWAP",
          "خلخلة: دفع الفراغ من الحصة " + step.toPeriod + " نحو نهاية الدوام", chainId);
      }
    }

    // ============================================================
    // STAGE 3 — Cross-Class Cascading (§26-30) — Depth = 1 صارم
    // الهدف T في A لم يملؤه Direct (كل مرشحي A فوق T مشغولون عند T).
    // المرشح X = معلم حصة فعلية في A عند P > T وهو مشغول عند T في الشعبة B.
    // خطة التحرير (عملية واحدة ذرية داخل B — القراءة المعتمدة 3):
    //   في B: Y ينتقل من T'' إلى T  و  X ينتقل من T إلى T''
    //   (T'' ∈ [T+1 .. End(B)] — يجوز أن يكون End(B) نفسها — القراءة المعتمدة 4)
    //   ثم في A: حصة X تنتقل من P إلى الهدف T
    // لا فراغ جديد داخل B إطلاقًا، ولا شعبة ثالثة، ولا حركة ثانية داخل B (§29)
    // ============================================================
    function tryCrossClassCascade(classA, targetPeriod, originalEndA, day, chain, filterProtected) {
      const attempts = [];
      for (let P = originalEndA; P > targetPeriod; P--) {
        const slot = FIELD_SCHEDULE[day][classA][P];
        if (!isActiveLesson(slot)) continue;
        if (filterProtected && slot.protectedTargetOf) continue; // هدف سلسلة أخرى — محمي
        const X = slot.teacher;
        if (isTeacherFree(X, day, targetPeriod)) continue;    // يعالجه Direct — لا يصل نظريًا
        const classB = findClassOfTeacherAt(X, day, targetPeriod);
        if (!classB || classB === classA) {
          attempts.push({ teacher: X, p: P, why: "تعذر تحديد شعبة إشغاله عند الهدف" });
          continue;
        }
        const endB = originalEndMap[classB];
        let plan = null;
        for (let T2 = endB; T2 > targetPeriod; T2--) {        // الأبعد أولًا (§27)
          const ySlot = FIELD_SCHEDULE[day][classB][T2];
          if (!isActiveLesson(ySlot)) continue;
          const Y = ySlot.teacher;
          if (Y === X) continue;
          if (!isTeacherFree(Y, day, targetPeriod)) continue; // Y يحل مكان X عند الهدف
          if (!isTeacherFree(X, day, T2)) continue;           // X يستطيع الانتقال إلى T'' (§8)
          plan = { classA, classB, teacherX: X, teacherY: Y, targetPeriod, freePeriod: T2, candidateP: P };
          break;
        }
        if (plan) return plan;
        attempts.push({
          teacher: X, p: P, classB: classB,
          why: "لا توجد حركة تحرير واحدة صالحة داخل " + classB + " (فُحصت T'' من " + endB + " إلى " + (targetPeriod + 1) + ")"
        });
      }
      chain.crossAttempts = attempts;
      return null;
    }

    // تنفيذ Cross-Class: Plan → Validate → Commit → Post-validate → Rollback عند الفشل (§16)
    function executeCrossClass(plan, day, chain) {
      const classA = plan.classA, classB = plan.classB;
      const teacherX = plan.teacherX, teacherY = plan.teacherY;
      const T = plan.targetPeriod, T2 = plan.freePeriod, P = plan.candidateP;

      // ===== تحقق مسبق كامل قبل أي كتابة =====
      const endB = originalEndMap[classB];
      const endA = originalEndMap[classA];
      if (T2 > endB || T2 <= T) return false;                 // T'' ∈ [T+1 .. End(B)] — دفاعي
      if (P > endA || P <= T) return false;                   // P ∈ [T+1 .. End(A)] — دفاعي
      const aT = FIELD_SCHEDULE[day][classA][T];
      const bT = FIELD_SCHEDULE[day][classB][T];
      const bT2 = FIELD_SCHEDULE[day][classB][T2];
      const aP = FIELD_SCHEDULE[day][classA][P];
      const preOK = !!(aT && isGapStatus(aT.status)) &&
        !!(bT && isActiveLesson(bT) && bT.teacher === teacherX && !isAbsent(teacherX)) &&
        !!(bT2 && isActiveLesson(bT2) && bT2.teacher === teacherY && teacherY !== teacherX && !isAbsent(teacherY)) &&
        !!(aP && isActiveLesson(aP) && aP.teacher === teacherX) &&
        classB !== classA &&
        isTeacherFree(teacherY, day, T) &&
        isTeacherFree(teacherX, day, T2);
      if (!preOK) return false;

      // ===== لقطة للتراجع الدفاعي =====
      const snap = { aT: deepClone(aT), bT: deepClone(bT), bT2: deepClone(bT2), aP: deepClone(aP) };

      // ===== تنفيذ ذري =====
      // في B: Y → T ، X → T''  (لا فراغ جديد داخل B — تبادل كامل بلا COPY)
      FIELD_SCHEDULE[day][classB][T] = Object.assign({}, bT2, { status: LessonStatus.SHIFTED, currentPeriod: T });
      FIELD_SCHEDULE[day][classB][T2] = Object.assign({}, bT, { status: LessonStatus.SHIFTED, currentPeriod: T2 });
      // في A: حصة X تنتقل من P إلى الهدف T (MOVE — معرفها ينتقل معها)
      FIELD_SCHEDULE[day][classA][T] = Object.assign({}, aP, { status: LessonStatus.SHIFTED, currentPeriod: T });
      // Ownership: الفراغ الناتج في A مملوك لهذه السلسلة (B لا يُنشأ فيها أي فراغ)
      FIELD_SCHEDULE[day][classA][P] = {
        teacher: "", subject: "", originalPeriod: P, currentPeriod: P,
        status: LessonStatus.SHIFT_EMPTY, lessonId: null,
        movedTeacher: teacherX, sourceOriginalPeriod: aP.originalPeriod,
        createdByChainId: chain.id, createdByMovementSeq: null // يُستكمل بعد تسجيل حركة X
      };

      // ===== تحقق بعدي (دفاع في العمق) =====
      let ok = true;
      if (!isActiveLesson(FIELD_SCHEDULE[day][classB][T]) || FIELD_SCHEDULE[day][classB][T].teacher !== teacherY) ok = false;
      if (!isActiveLesson(FIELD_SCHEDULE[day][classB][T2]) || FIELD_SCHEDULE[day][classB][T2].teacher !== teacherX) ok = false;
      if (!isActiveLesson(FIELD_SCHEDULE[day][classA][T]) || FIELD_SCHEDULE[day][classA][T].teacher !== teacherX) ok = false;
      if (FIELD_SCHEDULE[day][classA][P].status !== LessonStatus.SHIFT_EMPTY) ok = false;
      // MOVE وليس COPY: المعرفات تنتقل سليمةً ومتباينة
      if (FIELD_SCHEDULE[day][classA][T].lessonId !== aP.lessonId) ok = false;
      if (FIELD_SCHEDULE[day][classB][T].lessonId !== bT2.lessonId) ok = false;
      if (FIELD_SCHEDULE[day][classB][T2].lessonId !== bT.lessonId) ok = false;
      if (bT.lessonId === bT2.lessonId || bT.lessonId === aP.lessonId || bT2.lessonId === aP.lessonId) ok = false;
      if (!noConflictsAtPeriod(day, T) || !noConflictsAtPeriod(day, T2)) ok = false;
      if (JSON.stringify(ORIGINAL_SCHEDULE) !== originalScheduleSnapshot) ok = false;
      if (!Object.isFrozen(ORIGINAL_SCHEDULE)) ok = false;

      if (!ok) {
        // ===== تراجع كامل — لا أثر إطلاقًا على FIELD_SCHEDULE ولا على السجل =====
        FIELD_SCHEDULE[day][classA][T] = snap.aT;
        FIELD_SCHEDULE[day][classB][T] = snap.bT;
        FIELD_SCHEDULE[day][classB][T2] = snap.bT2;
        FIELD_SCHEDULE[day][classA][P] = snap.aP;
        return false;
      }

      // ===== توثيق كل حركة فردية (§43/44) — ثلاث حركات بمعرفات الحصص الأصلية =====
      const mv1 = pushMovement(day, classB, classB, teacherY, bT2.subject, bT2.lessonId, T2, T,
        "CROSS_CLASS_CASCADE",
        "تحرير " + teacherX + " (مشغول في " + classB + " بالحصة " + T + ") — سحب حصة " + teacherY + " من " + T2 + " إلى " + T,
        chain.id);
      const mv2 = pushMovement(day, classB, classB, teacherX, bT.subject, bT.lessonId, T, T2,
        "CROSS_CLASS_CASCADE",
        "إتمام تحرير " + teacherX + ": انتقال حصته إلى الحصة " + T2 + " في " + classB,
        chain.id);
      const mv3 = pushMovement(day, classA, classA, teacherX, aP.subject, aP.lessonId, P, T,
        "CROSS_CLASS_CASCADE",
        "تعويض عبر الشعب: نقل حصة " + teacherX + " من " + P + " إلى الهدف " + T + " في " + classA + " بعد تحريره من " + classB,
        chain.id);
      FIELD_SCHEDULE[day][classA][P].createdByMovementSeq = mv3.seq;
      if (!chain.crossInfo) chain.crossInfo = {   // توثيق أول عملية Cross في السلسلة
        classA: classA, classB: classB, teacherX: teacherX, teacherY: teacherY,
        targetPeriod: T, freePeriod: T2, candidateP: P,
        movements: [mv1.seq, mv2.seq, mv3.seq],
        result: "تحرير " + teacherX + " بحركة واحدة داخل " + classB + " ثم نقل حصته في " + classA + " إلى الهدف — دون أي ضرر داخلي بـ" + classB
      };
      return true;
    }

    // ============================================================
    // processTargetVacancy — سلسلة معالجة فراغ غياب واحد (تسمى بالفراغ حسب
    // الترتيب الحتمي §10). السلسلة كاملة هنا: Direct ثم استكمال Ripple داخليًا
    // (القراءة المعتمدة 1 و5) ثم Cross-Class عند فشل الاثنين ثم Fallback.
    // لا تُنشأ فراغات جديدة مستقلة أبدًا (§11) — فراغ النقل جزء من السلسلة.
    // ============================================================
    function buildFailureReason(cls, T, EndA, day, chain) {
      const cands = [];
      for (let P = EndA; P > T; P--) {
        const slot = FIELD_SCHEDULE[day][cls][P];
        if (!slot) { cands.push("الحصة " + P + ": غير موجودة"); continue; }
        if (!isActiveLesson(slot)) {
          const kind = slot.status === LessonStatus.SHIFT_EMPTY ? "فراغ نقل"
            : slot.status === LessonStatus.ABSENCE_EMPTY ? "فراغ غياب" : "غير مبرمجة أصلًا";
          cands.push("الحصة " + P + ": " + kind + " — ليست مرشحًا للسحب");
          continue;
        }
        if (isTeacherFree(slot.teacher, day, T)) {
          cands.push("الحصة " + P + " (" + slot.teacher + "): متفرغ — تعارض داخلي");
        } else {
          const b = findClassOfTeacherAt(slot.teacher, day, T);
          cands.push("الحصة " + P + " (" + slot.teacher + "): مشغول عند الحصة " + T + " في " + (b || "؟"));
        }
      }
      const cc = chain.crossAttempts.length
        ? chain.crossAttempts.map(a => a.teacher + " (مرشح عند الحصة " + a.p + "): " + a.why).join("؛ ")
        : "لا مرشحين فوق الهدف";
      return "فشل Direct: لا توجد حصة لاحقة (من " + EndA + " إلى " + (T + 1) + ") متفرغ معلمها عند الحصة " + T + ". " +
        "فشل Ripple: لا توجد حركة أولى ممكنة (شرط المرشح الأول مطابق لشرط Direct). " +
        "فشل Cross-Class (Depth=1): " + cc + ". " +
        "المرشحون المفحوصون: " + (cands.join("، ") || "لا يوجد");
    }

    // ============================================================
    // documentGapBlockers — توثيق سبب تعذر دفع الفراغ الداخلي إلى Original_End:
    // لكل حصة لاحقة (من gap+1 إلى End): هل هي مرشح صالح؟ ولماذا لا؟
    // الجدوى تُفحص عبر isTeacherFree الكامل (جميع الشعب) — لا افتراضات.
    // ============================================================
    function documentGapBlockers(cls, gap, endA, day) {
      const parts = [];
      for (let P = gap + 1; P <= endA; P++) {
        const slot = FIELD_SCHEDULE[day][cls][P];
        if (!slot || !isActiveLesson(slot)) {
          const kind = !slot ? "غير موجودة"
            : slot.status === LessonStatus.SHIFT_EMPTY ? "فراغ نقل"
              : slot.status === LessonStatus.ABSENCE_EMPTY ? "فراغ غياب (" + (slot.absentTeacher || "") + ")"
                : "غير مبرمجة أصلًا";
          parts.push("الحصة " + P + ": " + kind + " — ليست مرشحًا للسحب");
          continue;
        }
        if (slot.protectedTargetOf) {
          parts.push("الحصة " + P + " (" + slot.teacher + "): خلية هدف معوَّض لسلسلة أخرى — محمية ولا تُستنزف");
        } else if (isTeacherFree(slot.teacher, day, gap)) {
          parts.push("الحصة " + P + " (" + slot.teacher + "): متفرغ عند الحصة " + gap + " لكن مسار الدفع إليها غير قانوني ضمن القيود");
        } else {
          const b = findClassOfTeacherAt(slot.teacher, day, gap);
          parts.push("الحصة " + P + " (" + slot.teacher + "): مشغول بالحصة " + gap + " في " + (b || "؟"));
        }
      }
      return "تعذر دفع الفراغ من الحصة " + gap + " إلى نهاية الدوام (" + endA + ") — " +
        (parts.length ? parts.join("، ") : "لا توجد حصص لاحقة");
    }

    // ============================================================
    // finalizeChain — الحسم النهائي للسلسلة الناجحة بدلالات صريحة لا تضلل:
    //   completion = "COMPLETE" (الفراغ وصل Original_End — نجاح مكتمل)
    //             | "PARTIAL"  (الهدف محمي لكن فراغًا داخليًا متبقيًا يحتاج
    //                           متابعة/قرارًا إداريًا — ليس استعصاء ولا خطأ)
    // PARTIAL يوثق gapBlockedReason (من منع الدفع ولماذا) — القراءة المعتمدة 2.
    // ============================================================
    function finalizeChain(chain, method, finalGap, endA, day) {
      chain.method = method;
      chain.status = "SUCCESS_" + method;
      chain.finalGap = finalGap;
      chain.remainingGap = finalGap < endA;
      chain.completion = chain.remainingGap ? "PARTIAL" : "COMPLETE";
      if (chain.remainingGap) {
        chain.gapBlockedReason = documentGapBlockers(chain.className, finalGap, endA, day);
        if (chain.gapCrossFailedAt != null && chain.crossAttempts && chain.crossAttempts.length) {
          chain.gapBlockedReason += " | ومحاولة ملء هذه الفجوة عبر الشعب (Depth=1) فشلت أيضًا: " +
            chain.crossAttempts.map(a => a.teacher + " (مرشح عند الحصة " + a.p + "): " + a.why).join("؛ ");
        }
        chain.note = "حمي الهدف وبعّد الفراغ إلى الحصة " + finalGap +
          " (أبعد موضع ممكن قانونيًا) — فراغ متبقٍ داخل الدوام يحتاج متابعة/قرارًا إداريًا";
      } else {
        chain.gapBlockedReason = null;
        chain.note = "استقر الفراغ في الحصة " + endA + " = Original_End (منطقة استقبال الفراغ) — نجاح مكتمل";
      }
    }

    // ============================================================
    // verifyChainOutcome — فحص إلزامي بعد كل سلسلة (منع إخفاء فجوة داخلية):
    // يعيد اشتقاق الحالة الفعلية من FIELD_SCHEDULE ويطابقها مع المعلن:
    //   1) سلسلة بحركات ⇒ فراغ نقل واحد بالضبط مملوك لها عند finalGap.
    //   2) سلسلة نجاح (غير NO_ACTION) ⇒ الهدف معوض فعلًا.
    //   3) FALLBACK/NO_ACTION ⇒ لا حركات، وهدفها ما زال فراغ غياب.
    // أي تعارض ⇒ استثناء فوري (fail-fast) — لا يكمل المحرك بحالة كاذبة.
    // ============================================================
    function verifyChainOutcome(chain, day) {
      const cls = chain.className, T = chain.targetPeriod;
      const owned = [];
      for (let p = 1; p <= 7; p++) {
        const c = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
        if (c && c.status === LessonStatus.SHIFT_EMPTY && c.createdByChainId === chain.id) owned.push(p);
      }
      const targetCell = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][T];

      if (chain.status === "SUCCESS_NO_ACTION") {
        if (chain.moves.length) throw new Error("NO_ACTION بحركات: " + chain.id);
        if (owned.length) throw new Error("NO_ACTION تملك فراغ نقل: " + chain.id);
        if (!targetCell || targetCell.status !== LessonStatus.ABSENCE_EMPTY)
          throw new Error("NO_ACTION وهدفها ليس فراغ غياب: " + chain.id);
        return;
      }
      if (chain.status === "FALLBACK") {
        if (chain.moves.length) throw new Error("FALLBACK بحركات: " + chain.id);
        if (owned.length) throw new Error("FALLBACK تملك فراغ نقل: " + chain.id);
        if (!targetCell || targetCell.status !== LessonStatus.ABSENCE_EMPTY)
          throw new Error("FALLBACK وهدفها ليس فراغ غياب متبقيًا: " + chain.id);
        return;
      }
      // سلسلة نجاح بحركات
      if (!chain.moves.length) throw new Error("سلسلة نجاح بلا حركات: " + chain.id);
      if (owned.length !== 1)
        throw new Error("سلسلة " + chain.id + " تملك " + owned.length + " فراغ نقل (المتوقع 1) — فجوة داخلية غير متطابقة");
      if (owned[0] !== chain.finalGap)
        throw new Error("finalGap المعلن " + chain.finalGap + " ≠ الفعلي " + owned[0] + " في " + chain.id);
      if (!isActiveLesson(targetCell))
        throw new Error("هدف السلسلة " + chain.id + " غير معوض رغم إعلان النجاح");
      if (!(chain.finalGap > T && chain.finalGap <= chain.originalEnd))
        throw new Error("finalGap خارج النطاق في " + chain.id);
      if (chain.completion !== (chain.remainingGap ? "PARTIAL" : "COMPLETE"))
        throw new Error("علامة completion غير متسقة في " + chain.id);
    }

    // ============================================================
    // deriveChainMethod — أقوى آلية استخدمتها السلسلة فعليًا (تسمية صادقة)
    // ============================================================
    function deriveChainMethod(chain) {
      let hasCross = false, hasRipple = false;
      for (const m of movementLog) {
        if (m.chainId !== chain.id) continue;
        if (m.movementType === "CROSS_CLASS_CASCADE") hasCross = true;
        else if (m.movementType === "RIPPLE_SWAP") hasRipple = true;
      }
      if (hasCross) return "CROSS_CLASS";
      if (hasRipple) return "RIPPLE";
      return "DIRECT";
    }

    // ============================================================
    // escalateGap — تصعيد الفراغ الداخلي (معالجة النقلة داخل السلسلة نفسها):
    // بعد حماية الهدف قد يبقى فراغ داخلي عند G < End. السلسلة لا تُغلق بل:
    //   Ripple على G → إن لم يصل End → Cross-Class على G (Depth=1 كما الهدف
    //   تمامًا: ملء G بحصة X من P داخل A بعد تحرير X بتبادل واحد داخل B)
    //   → فجوة جديدة عند P > G → تكرار حتى End أو استنفاد الخطط القانونية.
    // الضمانات:
    //   - الفجوة تتقدم صرامةً (كل ملء P > G) + مجموعة مواضع مزارة → لا دوران.
    //   - كل عملية Cross مستقلة Depth=1 بشعبتين فقط (فحص O لكل كتلة).
    //   - لا فراغ مستقل جديد: كل شيء داخل السلسلة (verifyChainOutcome يطابق).
    //   - الخطة الفاشلة تُوثق (chain.gapCrossFailedAt + crossAttempts).
    // ============================================================
    function escalateGap(chain, day, gapStart, endA) {
      let gap = gapStart;
      const visited = new Set([gapStart]);
      let guard = 0;
      while (gap < endA && guard++ < 14) {
        const plan = findRipplePath(chain.className, gap, endA, day, true);
        if (plan.path.length) {
          executeRipple(plan.path, chain.className, day, chain.id);
          if (visited.has(plan.finalGap)) break;   // دفاع دوران إضافي
          visited.add(plan.finalGap);
          gap = plan.finalGap;
        }
        if (gap >= endA) break;
        const cc = tryCrossClassCascade(chain.className, gap, endA, day, chain, true);
        if (cc && executeCrossClass(cc, day, chain)) {
          if (visited.has(cc.candidateP)) break;   // دفاع دوران إضافي
          visited.add(cc.candidateP);
          chain.gapFills.push({
            gap: gap, teacherX: cc.teacherX, candidateP: cc.candidateP,
            classB: cc.classB, teacherY: cc.teacherY, freePeriod: cc.freePeriod
          });
          gap = cc.candidateP;
          continue;
        }
        chain.gapCrossFailedAt = gap;              // توثيق آخر فجوة تعذر ملؤها قانونيًا
        break;
      }
      return gap;
    }

    function processTargetVacancyCore(v, day) {
      const cls = v.className, T = v.period, EndA = v.originalEnd;
      const chain = {
        id: "chain_" + (++chainSeq),
        className: cls, targetPeriod: T, absentTeacher: v.absentTeacher,
        subject: v.subject, originalEnd: EndA,
        method: null, status: null, finalGap: null, remainingGap: false,
        completion: null, gapBlockedReason: null, note: "",
        lastStageReached: null, failureReason: null,
        moves: [], crossInfo: null, crossAttempts: [], gapFills: [], gapCrossFailedAt: null
      };
      chains.push(chain);
      v.chainId = chain.id;
      v.chain = chain;

      // الفراغ المحظوظ (§12)
      if (T === EndA) {
        chain.method = "NO_ACTION";
        chain.status = "SUCCESS_NO_ACTION";
        chain.finalGap = T;
        chain.completion = "COMPLETE";
        chain.gapBlockedReason = null;
        chain.note = "الفراغ أصلاً في منطقة استقبال الفراغ (نهاية الدوام الأصلية) — لا حركة مطلوبة";
        v.status = chain.status;
        return;
      }

      // ---- STAGE 1: Direct Tail Pull (بحث شامل بين كل المرشحين) ----
      chain.lastStageReached = "DIRECT";
      const best = findBestDirectPlan(cls, T, EndA, day);
      if (best) {
        executeMove(cls, best.fromPeriod, T, day, "DIRECT_TAIL_PULL",
          "تغطية فراغ غياب " + v.absentTeacher + " في الحصة " + T +
          " بأفضل سحب ممكن (بحث شامل قارن كل المرشحين ومحاكاة الخلخلة الناتجة عن كل منهم)",
          chain.id);
        // استكمال بالخلخلة فقط (الممر 1): السحب الذي يترك فراغًا داخليًا ليس فشلًا؛
        // تصعيد الفجوة إلى Cross-Class يتم في الممر 2 بعد تأمين جميع أهداف الغياب
        chain.lastStageReached = "RIPPLE";
        if (best.ripplePath.length) executeRipple(best.ripplePath, cls, day, chain.id);
        finalizeChain(chain, deriveChainMethod(chain), best.finalGap, EndA, day);
        v.status = chain.status;
        return;
      }

      // ---- STAGE 2: Ripple ----
      // بعد فشل Direct لا توجد أي حصة لاحقة متفرغ معلمها عند الهدف، وشرط الحركة
      // الأولى في Ripple مطابق تمامًا لشرط Direct — فهي تفشل صوريًا (موثق في السبب)
      chain.lastStageReached = "RIPPLE";

      // ---- STAGE 3: Cross-Class (Depth = 1) ----
      chain.lastStageReached = "CROSS_CLASS";
      const ccPlan = tryCrossClassCascade(cls, T, EndA, day, chain);
      if (ccPlan && executeCrossClass(ccPlan, day, chain)) {
        const gap = ccPlan.candidateP;
        chain.lastStageReached = "RIPPLE";
        const rp = findRipplePath(cls, gap, EndA, day);
        if (rp.path.length) executeRipple(rp.path, cls, day, chain.id);
        finalizeChain(chain, deriveChainMethod(chain), rp.finalGap, EndA, day);
        v.status = chain.status;
        return;
      }

      // ---- FALLBACK (§13): يترك ABSENCE_EMPTY كما هو مع توثيق كامل ----
      chain.method = "FALLBACK"; chain.status = "FALLBACK"; chain.finalGap = T;
      chain.completion = "FAILED";
      chain.gapBlockedReason = null;
      chain.failureReason = buildFailureReason(cls, T, EndA, day, chain);
      v.status = "FALLBACK";
    }

    // الغلاف الإلزامي: كل سلسلة تُتحقق فورًا من الحالة الفعلية قبل السماح بالمتابعة
    function processTargetVacancy(v, day) {
      processTargetVacancyCore(v, day);
      verifyChainOutcome(v.chain, day);
    }

    // ============================================================
    // processCompensation (§10): ترتيب حتمي — End الأقل أولًا ثم الهدف الأبكر
    // ثم ترتيب الشعب. كل سلسلة تُستكمل بالكامل قبل التالية (لا فراغات مستقلة)،
    // وكل سلسلة تقرأ FIELD_SCHEDULE الحي (إعادة تقييم بعد كل سلسلة §34/35)
    // ============================================================
    function processCompensation(day) {
      const classOrder = function (a, b) {
        const ea = originalEndMap[a.className] != null ? originalEndMap[a.className] : a.originalEnd;
        const eb = originalEndMap[b.className] != null ? originalEndMap[b.className] : b.originalEnd;
        if (ea !== eb) return ea - eb;
        const pa = a.period != null ? a.period : a.targetPeriod;
        const pb = b.period != null ? b.period : b.targetPeriod;
        if (pa !== pb) return pa - pb;
        return ALL_CLASSES.indexOf(a.className) - ALL_CLASSES.indexOf(b.className);
      };
      // ===== الممر 1: تأمين أهداف الغياب (الأولوية المطلقة لكل فراغ غياب) =====
      const order = vacancies.slice().sort(classOrder);
      for (const v of order) processTargetVacancy(v, day);
      // ===== الممر 2: إكمال الفجوات الداخلية للسلاسل الجزئية =====
      // بعد تأمين كل الأهداف: تصعيد كل فجوة داخلية (Ripple ثم Cross Depth=1)
      // لا يمكن أن يضر بأي هدف — بنفس الترتيب الحتمي (End ثم Target ثم الشعبة)
      // الختم: كل خلية هدف معوّضة تُعلَّم protectedTargetOf فلا يجوز لأي تصعيد
      // أن يستخدمها كمصدر (تفريغها يهدم حماية هدف سلسلة أخرى)
      for (const ch of chains) {
        if (ch.moves.length > 0) {
          const cell = FIELD_SCHEDULE[day][ch.className] && FIELD_SCHEDULE[day][ch.className][ch.targetPeriod];
          if (cell && isActiveLesson(cell)) cell.protectedTargetOf = ch.id;
        }
      }
      const partials = chains.filter(function (c) {
        return c.moves.length > 0 && c.completion === "PARTIAL";
      }).sort(classOrder);
      for (const c of partials) {
        const newGap = escalateGap(c, day, c.finalGap, c.originalEnd);
        finalizeChain(c, deriveChainMethod(c), newGap, c.originalEnd, day);
        verifyChainOutcome(c, day);
      }
    }

    // ============================================================
    // runEngine — نقطة الدخول الموحدة (محرك نقي بلا DOM — قابل للاختبار في Node)
    // ============================================================
    function runEngine(day, date, absentArray) {
      const t0 = Date.now();
      if (!ORIGINAL_SCHEDULE[day]) throw new Error("يوم غير معروف: " + day);
      currentDay = day;
      currentDate = date || "";
      absentList = Array.from(new Set(absentArray || []));
      originalScheduleSnapshot = JSON.stringify(ORIGINAL_SCHEDULE);
      movementLog = [];
      chains = [];
      chainSeq = 0;
      vacancies = [];

      // STAGE 0
      buildTeacherState(day);
      calculateOriginalEnd(day);
      createFieldSchedule(day);
      markAbsentTeachers(day);
      createAbsenceVacancies(day);

      processCompensation(day);
      lastIntegrity = validateIntegrity(day);
      engineRunTime = (Date.now() - t0) + " ms";
      return buildResults();
    }

    // ============================================================
    // buildGapFillSuggestions — بدائل قرار إداري للفجوات الداخلية المتبقية:
    // لكل فجوة ضغط متبقية (سلسلة PARTIAL): حصر حصص الشعب الأخرى عند الفترة
    // نفسها التي يمكن نقلها بقرار إداري (نهج الاستيراد)، مع الكلفة الصريحة:
    // الشعبة المانحة تفقد الحصة، وهل يمكن تخفيف الفقد بضغط دوامها الداخلي.
    // الترتيب: القابلة للتخفيف أولًا ثم الأقرب موضوعيًا لمادة الغياب.
    // اقتراحات قرار فقط — لا تُنفذ أبدًا (تخرق قاعدة عدم ضرر المانح §28/§30).
    // ============================================================
    function teacherFreeAtPeriodExcept(teacher, day, period, exceptClass) {
      if (!teacherState[teacher]) return false;
      if (isAbsent(teacher)) return false;
      for (const C of ALL_CLASSES) {
        if (C === exceptClass) continue;               // ستُخلى حصتها عند هذه الفترة
        const c = FIELD_SCHEDULE[day][C] && FIELD_SCHEDULE[day][C][period];
        if (isActiveLesson(c) && c.teacher === teacher) return false;
      }
      return true;
    }

    function buildGapFillSuggestions(day) {
      const out = [];
      for (const ch of chains) {
        if (ch.completion !== "PARTIAL" || !ch.moves.length) continue;
        const A = ch.className, G = ch.finalGap;
        const options = [];
        for (const B of ALL_CLASSES) {
          if (B === A) continue;
          const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][B] && FIELD_SCHEDULE[day][B][G];
          if (!isActiveLesson(cell)) continue;
          if (isAbsent(cell.teacher)) continue;
          // هل تستطيع B تخفيف الفقد بضغط دوامها؟ (سحب حصة لاحقة إلى G بعد إخلاء B@G)
          let absorb = null;
          for (let P = G + 1; P <= originalEndMap[B]; P++) {
            const later = FIELD_SCHEDULE[day][B][P];
            if (!isActiveLesson(later)) continue;
            if (later.teacher === cell.teacher) continue;
            if (teacherFreeAtPeriodExcept(later.teacher, day, G, B)) {
              absorb = { period: P, teacher: later.teacher, subject: later.subject };
              break;
            }
          }
          options.push({
            classB: B, teacher: cell.teacher, subject: cell.subject, absorb: absorb,
            subjectMatch: cell.subject === ch.subject,
            cost: "طلاب " + B + " يفقدون حصة " + cell.subject + " (" + cell.teacher + ")" +
              (absorb ? " — تخفيف ممكن: سحب حصة " + absorb.subject + " (" + absorb.teacher + ") من الحصة " + absorb.period +
                " إلى الحصة " + G + " فيبقى فراغهم عند الحصة " + absorb.period
                : " — لا يوجد تخفيف ممكن (ينقص دوامهم حصة فعلية)")
          });
        }
        options.sort(function (a, b) {
          const sa = (a.absorb ? 2 : 0) + (a.subjectMatch ? 1 : 0);
          const sb = (b.absorb ? 2 : 0) + (b.subjectMatch ? 1 : 0);
          return sb - sa;
        });
        out.push({
          className: A, gap: G, targetPeriod: ch.targetPeriod,
          absentTeacher: ch.absentTeacher, subject: ch.subject,
          blockedReason: ch.gapBlockedReason, options: options.slice(0, 3)
        });
      }
      return out;
    }

    // ============================================================
    // buildResults — كائن النتائج للتقرير والواجهة والاختبارات
    // ============================================================
    function buildResults() {
      const day = currentDay;
      const METHOD_RANK = { CROSS_CLASS: 4, RIPPLE: 3, DIRECT: 2, NO_ACTION: 1, FALLBACK: 0 };

      const absentees = absentList.map(t => {
        const st = teacherState[t] || { originalLoad: 0 };
        const vs = vacancies.filter(v => v.absentTeacher === t);
        const compensated = vs.filter(v => v.status && v.status.indexOf("SUCCESS") === 0 && v.status !== "SUCCESS_NO_ACTION").length;
        return {
          name: t, lessonsToday: st.originalLoad, affected: vs.length, compensated: compensated,
          note: st.originalLoad === 0 ? "لا حصص لهذا المعلم في هذا اليوم — لا تأثير" : ""
        };
      });

      const affectedClasses = [];
      for (const cls of ALL_CLASSES) {
        const vs = vacancies.filter(v => v.className === cls);
        if (!vs.length) continue;
        const clsChains = chains.filter(c => c.className === cls);
        const finalGaps = [];
        for (let p = 1; p <= originalEndMap[cls]; p++) {
          const c = FIELD_SCHEDULE[day][cls][p];
          if (c && !isActiveLesson(c)) finalGaps.push({ period: p, type: c.status, atEnd: p === originalEndMap[cls] });
        }
        const methods = [];
        for (const c of clsChains) if (c.method && methods.indexOf(c.method) < 0) methods.push(c.method);
        const anyFallback = clsChains.some(c => c.status === "FALLBACK");
        let status;
        if (anyFallback) status = "FALLBACK";
        else {
          let top = "NO_ACTION";
          for (const m of methods) if (METHOD_RANK[m] > METHOD_RANK[top]) top = m;
          status = "SUCCESS_" + top;
        }
        affectedClasses.push({
          name: cls, originalEnd: originalEndMap[cls],
          compensated: clsChains.filter(c => c.status && c.status.indexOf("SUCCESS") === 0 && c.status !== "SUCCESS_NO_ACTION").length,
          finalGaps: finalGaps,
          movementsCount: clsChains.reduce((n, c) => n + c.moves.length, 0),
          methods: methods, status: status, chains: clsChains
        });
      }

      const finalGapsList = [];
      for (const ac of affectedClasses) {
        for (const g of ac.finalGaps) {
          finalGapsList.push({
            className: ac.name, period: g.period, type: g.type, atEnd: g.atEnd,
            // كل فراغ داخلي (داخل الدوام وليس عند End) يحتاج متابعة/قرارًا إداريًا:
            // فراغ غياب غير معوض = استعصاء | فراغ نقل متبقٍ = ضغط دوام غير مكتمل
            needsAttention: !g.atEnd
          });
        }
      }

      const direct = movementLog.filter(m => m.movementType === "DIRECT_TAIL_PULL");
      const ripple = movementLog.filter(m => m.movementType === "RIPPLE_SWAP");
      const cross = movementLog.filter(m => m.movementType === "CROSS_CLASS_CASCADE");
      const crossChains = chains.filter(c => c.crossInfo);
      const fallbackChains = chains.filter(c => c.status === "FALLBACK");

      const stats = {
        absentTeachers: absentList.length,
        completeSuccess: chains.filter(function (c) { return c.moves.length > 0 && c.completion === "COMPLETE"; }).length,
        partialSuccess: chains.filter(function (c) { return c.moves.length > 0 && c.completion === "PARTIAL"; }).length,
        affectedClasses: affectedClasses.length,
        compensatedVacancies: chains.filter(c => c.status && c.status.indexOf("SUCCESS") === 0 && c.status !== "SUCCESS_NO_ACTION").length,
        noActionVacancies: chains.filter(c => c.status === "SUCCESS_NO_ACTION").length,
        totalMovements: movementLog.length,
        directMoves: direct.length,
        rippleMoves: ripple.length,
        crossClassMoves: cross.length,
        crossClassChains: crossChains.length,
        finalGaps: finalGapsList.length,
        fallbacks: fallbackChains.length
      };

      return {
        ok: true,
        meta: { day: day, date: currentDate, runAt: new Date().toISOString(), duration: engineRunTime },
        field: FIELD_SCHEDULE,
        classes: ALL_CLASSES.slice(),
        originalEnd: Object.assign({}, originalEndMap),
        vacancies: vacancies, chains: chains, movementLog: movementLog,
        absentees: absentees, affectedClasses: affectedClasses, finalGaps: finalGapsList,
        fallbacks: fallbackChains,
        gapSuggestions: buildGapFillSuggestions(day),
        movements: { direct: direct, ripple: ripple, cross: cross, crossChains: crossChains },
        stats: stats,
        integrity: lastIntegrity
      };
    }

    // ============================================================
    // INTEGRITY VALIDATION (§14) — الفحوص A–P
    // كل فحص مستقل ويعيد { valid, errors } — الفشل في أي فحص يُدرج في التقرير.
    // مصممة لتكشف أخطاء المحرك نفسه (تُختبر باختبارات الطفير Mutation)
    // ============================================================
    const INTEGRITY_LABELS = {
      A_originalIntact: "الجدول الأصلي محفوظ ومجمّد",
      B_originalEndIntact: "Original_End ثابت (يعاد حسابه من الأصل للمقارنة)",
      C_noConflicts: "لا معلم في شعبتين في نفس الحصة",
      D_absentNotUsed: "المعلم الغائب غير مستخدم إطلاقًا",
      E_workloadExact: "نصاب كل معلم حاضر مطابق للأصل (لا زيادة ولا فقدان)",
      F_lessonConservation: "حفظ الحصص: كل حصة أصلية موجودة مرة واحدة بالضبط أو غياب موثق",
      J_noLessonAfterEnd: "لا حصة فعلية بعد Original_End",
      K_classCounts: "عدد حصص كل شعبة صحيح (الأصل ناقص غيابه)",
      L_finalGapSanity: "Final_Gap منطقي لكل سلسلة",
      M_noRippleCycles: "لا دورات في حركات الخلخلة",
      N_noDonorDamage: "لا ضرر بالشعب المانحة في Cross-Class",
      O_crossClassTwoClassesOnly: "كل كتلة Cross تبادل Depth=1 سليم بشعبتين فقط",
      P_cellShape: "لا حالات مستحيلة في الخلايا (حقول متناسقة)",
      Q_shiftEmptyOwnership: "كل فراغ نقل مملوك وموثق (سلسلة صحيحة + حركة مطابقة)",
      R_internalGapAccounting: "كل فراغ داخلي مفسّر بسلسلة (لا فجوات مخفية ولا نجاح مضلل)"
    };

    function validateIntegrity(day) {
      const R = {
        A_originalIntact: checkOriginalIntact(),
        B_originalEndIntact: checkOriginalEndIntact(day),
        C_noConflicts: checkNoTeacherConflicts(day),
        D_absentNotUsed: checkAbsentNotUsed(day),
        E_workloadExact: checkWorkloadExact(day),
        F_lessonConservation: checkLessonConservation(day),
        J_noLessonAfterEnd: checkNoLessonAfterEnd(day),
        K_classCounts: checkClassCounts(day),
        L_finalGapSanity: checkFinalGapSanity(day),
        M_noRippleCycles: checkNoRippleCycles(day),
        N_noDonorDamage: checkNoDonorDamage(day),
        O_crossClassTwoClassesOnly: checkCrossClassTwoClassesOnly(day),
        P_cellShape: checkCellShape(day),
        Q_shiftEmptyOwnership: checkShiftEmptyOwnership(day),
        R_internalGapAccounting: checkInternalGapAccounting(day)
      };
      R.allPassed = true;
      R.issues = [];
      for (const key of Object.keys(INTEGRITY_LABELS)) {
        const v = R[key];
        if (!v.valid) {
          R.allPassed = false;
          for (const e of v.errors) R.issues.push("[" + key + "] " + e);
        }
      }
      return R;
    }

    // A: الأصل لم يتغير (مقارنة اللقطة) + مجمّد فعلًا
    function checkOriginalIntact() {
      const errors = [];
      if (JSON.stringify(ORIGINAL_SCHEDULE) !== originalScheduleSnapshot)
        errors.push("تغيّر ORIGINAL_SCHEDULE أثناء المعالجة");
      if (!Object.isFrozen(ORIGINAL_SCHEDULE))
        errors.push("ORIGINAL_SCHEDULE غير مجمّد (deepFreeze)");
      return { valid: errors.length === 0, errors: errors };
    }

    // B: Original_End المحفوظ يطابق إعادة حسابه من الأصل
    function checkOriginalEndIntact(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        let recalc = 0;
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (row) for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (l && isRealLessonData(l.teacher, l.subject)) recalc = p;
        }
        if (originalEndMap[cls] !== recalc)
          errors.push(cls + ": المحفوظ " + originalEndMap[cls] + " ≠ المعاد حسابه " + recalc);
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // C: لا تعارض لحظي في أي فترة
    function checkNoTeacherConflicts(day) {
      const errors = [];
      for (let p = 1; p <= 7; p++) {
        const seen = {};
        for (const cls of ALL_CLASSES) {
          const lesson = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (!isActiveLesson(lesson)) continue;
          if (seen[lesson.teacher])
            errors.push("تعارض: " + lesson.teacher + " في " + seen[lesson.teacher] + " و" + cls + " بالحصة " + p);
          seen[lesson.teacher] = cls;
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // D: الغائب لا يظهر كحصة فعلية في أي مكان
    function checkAbsentNotUsed(day) {
      const errors = [];
      for (const cls of ALL_CLASSES) {
        for (let p = 1; p <= 7; p++) {
          const l = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (isActiveLesson(l) && isAbsent(l.teacher))
            errors.push("المعلم الغائب " + l.teacher + " مستخدم في " + cls + " بالحصة " + p);
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // E: النصاب الدقيق — لا زيادة ولا فقدان لكل حاضر، وصفر للغائب
    function checkWorkloadExact(day) {
      const errors = [];
      for (const t of Object.keys(teacherState)) {
        let live = 0;
        for (const cls of ALL_CLASSES) {
          for (let p = 1; p <= 7; p++) {
            const l = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
            if (isActiveLesson(l) && l.teacher === t) live++;
          }
        }
        if (isAbsent(t)) {
          if (live > 0) errors.push("المعلم الغائب " + t + " لديه " + live + " حصة فعلية");
        } else if (live !== teacherState[t].originalLoad) {
          errors.push("نصاب " + t + ": " + live + " ≠ الأصلي " + teacherState[t].originalLoad);
        }
      }
      return { valid: errors.length === 0, errors: errors };
    }

    // F+G+H+I: الحفظ الحقيقي بالمعرفات (§15) — لكل حصة أصلية:
    //  - معلمها غائب → يجب ألا تظهر نشطة إطلاقًا (أُزيلت بسبب الغياب)
    //  - حاضرة → موجودة مرة واحدة بالضبط، في شعبتها الأصلية، وانتقالها موثق بحركة
    function checkLessonConservation(day) {
      const errors = [];
      const expected = {};
      for (const cls of ALL_CLASSES) {
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (!l || !isRealLessonData(l.teacher, l.subject)) continue;
          const id = day + "|" + cls + "|" + p + "|" + l.teacher + "|" + l.subject;
          expected[id] = {
            teacher: l.teacher, subject: l.subject, originalClass: cls, originalPeriod: p,
            isAbsent: absentList.indexOf(l.teacher) >= 0, found: 0, foundIn: null, foundAt: null
          };
        }
      }
      for (const cls of ALL_CLASSES) {
        const row = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const c = row[p];
          if (!c) continue;
          if (isActiveLesson(c)) {
            if (!c.lessonId || !expected[c.lessonId]) {
              errors.push("حصة مجهولة المصدر: " + c.teacher + "/" + c.subject + " في " + cls + " ح" + p);
              continue;
            }
            const e = expected[c.lessonId];
            e.found++; e.foundIn = cls; e.foundAt = p;
            if (e.isAbsent) errors.push("حصة المعلم الغائب " + e.teacher + " ظهرت نشطة في " + cls + " ح" + p);
            if (cls !== e.originalClass)
              errors.push("حصة " + e.teacher + "/" + e.subject + " غادرت شعبتها الأصلية " + e.originalClass + " إلى " + cls + " — ممنوع");
          } else if (c.lessonId) {
            // خلية فراغ تحمل معرفًا: مسموح فقط كعلامة غياب صحيحة
            const e = expected[c.lessonId];
            if (c.status !== LessonStatus.ABSENCE_EMPTY)
              errors.push("خلية غير فعلية تحمل معرف حصة في " + cls + " ح" + p + " (" + c.status + ")");
            else if (!e || !e.isAbsent)
              errors.push("علامة غياب بمعرف غير صالح في " + cls + " ح" + p);
          }
        }
      }
      for (const id of Object.keys(expected)) {
        const e = expected[id];

          if (!isActiveLesson(cell)) continue;
          if (isAbsent(cell.teacher)) issues.push("معلم غائب ما زال مكلفًا: " + cell.teacher + " ح" + p + " في " + cls);
          if (busy.has(cell.teacher)) issues.push("تعارض للمعلم " + cell.teacher + " في الحصة " + p + " بين " + busy.get(cell.teacher) + " و" + cls);
          else busy.set(cell.teacher, cls);
          if (activeIds.has(cell.lessonId)) issues.push("تكرار معرّف الحصة: " + cell.lessonId);
          activeIds.add(cell.lessonId);
          if (!expectedIds.has(cell.lessonId)) issues.push("حصة نشطة غير منتمية للجدول الأصلي: " + cell.lessonId);
        }
      }
      for (const id of expectedIds) if (!activeIds.has(id)) issues.push("فقدت حصة أصلية غير غائبة: " + id);
      for (const ch of chains) {
        try { verifyChainOutcome(ch, day); }
        catch (e) { issues.push(e.message); }
      }
      for (const m of movementLog) {
        if (m.fromPeriod < m.toPeriod) {
          if (m.movementType !== "EXCEPTIONAL_REVERSE") issues.push("حركة عكسية غير مصنفة كاستثناء: " + m.teacher);
          if (!engineOptions.allowExceptionalReverse) issues.push("حركة عكسية نُفذت في الوضع العادي: " + m.teacher);
          if (m.toPeriod > ENGINE_CONFIG.EXCEPTIONAL_REVERSE_MAX_PERIOD) issues.push("حركة عكسية تجاوزت الحصة الخامسة: " + m.teacher);
        }
      }
      return { allPassed: issues.length === 0, issues: issues };
    }

    // ============================================================
    // REPORT GENERATOR
    // ============================================================
    function getStatusBadge(status, completion) {
      const partialMark = completion === "PARTIAL" ? " — مع استعصاء ضغط ⚠" : "";
      const map = {
        "SUCCESS_DIRECT": '<span class="status-badge status-success">سحب مباشر ✓' + partialMark + "</span>",
        "SUCCESS_RIPPLE": '<span class="status-badge status-success">تبديل داخلي ✓' + partialMark + "</span>",
        "SUCCESS_EXCEPTIONAL": '<span class="status-badge status-success">المرحلة الثالثة ✓' + partialMark + "</span>",
        "SUCCESS_NO_ACTION": '<span class="status-badge status-noaction">غياب نهاية الدوام ✓</span>',
        "FALLBACK": '<span class="status-badge status-fallback">استعصاء تعويض ✗</span>',
        "PENDING": '<span class="status-badge">قيد المعالجة</span>'
      };
      return map[status] || status;
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function generateReport(day, integrity, res) {
      if (!res) res = buildResults();
      const absent = res.absentees ? res.absentees.map(a => a.name) : absentList.slice();
      const fbs = chains.filter(c => c.status === "FALLBACK");
      const noActions = chains.filter(c => c.status === "SUCCESS_NO_ACTION");
      const pressureGaps = (res.finalGaps || []).filter(g => g.type === LessonStatus.SHIFT_EMPTY && g.needsAttention);
      const exceptionalMoves = movementLog.filter(m => m.movementType === "EXCEPTIONAL_REVERSE");
      const searchInfo = res.meta && res.meta.globalSearch;
      const modeLabel = searchInfo && searchInfo.status === "OPTIMAL_MODELED" ?
        "بحث عالمي مكتمل — أفضل حل ضمن القيود" : "بحث عالمي — أفضل نتيجة ضمن المهلة";
      let html = "";

      html += '<div class="report-section"><h2>📋 نتيجة التعويض</h2><div class="report-item">' +
        '<strong>' + esc(day) + ' — ' + esc(getSelectedDateArabic() || currentDate || "—") + '</strong><br>' +
        'الغائبون: ' + (absent.length ? absent.map(esc).join('، ') : 'لا يوجد') + '<br>' +
        'الوضع: ' + modeLabel + ' — عُوِّضت بالحركة <strong>' + res.stats.compensatedVacancies + '</strong> حصة، ووجدت <strong>' + noActions.length +
        '</strong> حالة غياب نهاية دوام، وبقي <strong>' + fbs.length + '</strong> استعصاء تعويض و<strong>' + pressureGaps.length + '</strong> استعصاء ضغط.' +
        '</div></div>';

      if (searchInfo) {
        html += '<div class="report-section"><h2>🌐 حالة البحث العالمي</h2><div class="report-item">' +
          (searchInfo.status === "OPTIMAL_MODELED" ?
            'اكتمل فحص جميع البدائل الممثلة في النموذج، وهذه أفضل نتيجة وفق الأولويات.' :
            'وصل البحث إلى حد الزمن؛ عُرضت أفضل نتيجة قانونية وجدها، دون ادعاء أنها مثلى.') +
          '<br><span class="label">العُقد المفحوصة: ' + searchInfo.nodes + ' — الخطط الكاملة: ' + searchInfo.completePlans +
          ' — الزمن: ' + searchInfo.durationMs + ' ms' + (searchInfo.improved ? ' — حسّن البحث النتيجة السريعة ✓' : '') +
          '</span></div></div>';
      }

      html += '<div class="report-section"><h2>🔄 الحركات المنفذة</h2>';
      if (!movementLog.length) html += '<div class="report-item">لم تُنفذ أي حركة.</div>';
      for (const m of movementLog) {
        const exceptionalTag = m.movementType === "EXCEPTIONAL_REVERSE" ? ' <strong style="color:var(--warning)">(حركة عكسية — المرحلة الثالثة)</strong>' : '';
        html += '<div class="report-item"><strong>' + esc(m.sourceClass) + '</strong>: ' + esc(m.teacher) +
          ' — ' + esc(m.subject) + '، من الحصة ' + m.fromPeriod + ' إلى الحصة ' + m.toPeriod + exceptionalTag + '</div>';
      }
      html += '</div>';

      if (exceptionalMoves.length) {
        html += '<div class="report-section"><h2>⚠️ المرحلة الثالثة</h2><div class="report-item" style="border-right:3px solid var(--warning)">' +
          'استُخدمت ' + exceptionalMoves.length + ' حركة عكسية، ولم تتجاوز أي منها الحصة ' + ENGINE_CONFIG.EXCEPTIONAL_REVERSE_MAX_PERIOD +
          '. طبّقها النظام آليًا بعد تعذر الحل في المرحلتين الأولى والثانية.</div></div>';
      }

      if (noActions.length) {
        html += '<div class="report-section"><h2>🕒 غياب نهاية الدوام — لا حركة مطلوبة</h2>';
        for (const c of noActions) {
          html += '<div class="report-item"><strong>' + esc(c.className) + ' — الحصة ' + c.targetPeriod + '</strong> (غياب ' +
            esc(c.absentTeacher) + ' — ' + esc(c.subject) + ') — الحصة تقع أصلًا في نهاية دوام الشعبة؛ لم تُنقل أي حصة.</div>';
        }
        html += '</div>';
      }

      html += '<div class="report-section"><h2>⚠️ استعصاءات التعويض</h2>';
      if (!fbs.length) html += '<div class="report-item" style="color:var(--success)">لا توجد استعصاءات تعويض ✓</div>';
      else {
        for (const f of fbs) {
          html += '<div class="report-item" style="border-right:3px solid var(--fallback)">' +
            '<strong>استعصاء تعويض — ' + esc(f.className) + ' ح' + f.targetPeriod + ':</strong> غياب ' + esc(f.absentTeacher) +
            ' — ' + esc(f.subject) + '؛ بقيت الحصة دون تغطية بالحركة لأن لا حل يحقق القيود المعتمدة.</div>';
        }
      }
      html += '</div>';

      html += '<div class="report-section"><h2>⚠️ استعصاءات الضغط</h2>';
      if (!pressureGaps.length) html += '<div class="report-item" style="color:var(--success)">لا توجد استعصاءات ضغط ✓</div>';
      else {
        for (const g of pressureGaps) {
          html += '<div class="report-item" style="border-right:3px solid var(--warning)">' +
            '<strong>استعصاء ضغط — ' + esc(g.className) + ' ح' + g.period + ':</strong> عُوِّضت حصة الغياب، لكن بقي فراغ داخلي؛ ' +
            esc(describePressureGap(day, g.className, g.period)) + '.</div>';
        }
      }
      html += '</div>';

      const s = res.stats;
      html += '<div class="report-section"><h2>📈 الأرقام الأساسية</h2><div class="stat-grid">' +
        statCard(s.absentTeachers, "معلمون غائبون") +
        statCard(s.affectedClasses, "شعب متأثرة") +
        statCard(s.compensatedVacancies, "حصص معوضة") +
        statCard(s.noActionVacancies, "غياب نهاية الدوام") +
        statCard(pressureGaps.length, "استعصاء ضغط") +
        statCard(s.totalMovements, "إجمالي الحركات") +
        statCard(s.fallbacks, "استعصاء تعويض") +
        '</div></div>';

      html += '<details class="report-section"><summary style="cursor:pointer;font-weight:800;font-size:1.05rem">التفاصيل الفنية (للتدقيق فقط)</summary>' +
        '<div class="report-item">مدة الحساب: ' + esc(engineRunTime) + ' — فحص السلامة: ' +
        (integrity && integrity.allPassed ? 'ناجح ✓' : 'غير ناجح') + '<br>' +
        'السحب المباشر: ' + s.directMoves + '، الدفع الداخلي: ' + s.rippleMoves +
        '، سلاسل المرحلة الثالثة: ' + s.crossClassChains + '، إجمالي الخانات غير المشغولة النهائية: ' + s.finalGaps + '.</div>';
      for (const f of fbs) {
        html += '<div class="report-item"><strong>' + esc(f.className) + ' ح' + f.targetPeriod + ':</strong> ' +
          esc(f.failureReason || "لم يوجد مسار قانوني ضمن القيود") + '</div>';
      }
      html += '</details>';

      return html;
    }

    function statCard(num, lbl) {
      return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
    }

    function buildResultsAbsenteesPreview() {
      return absentList.map(t => {
        const st = teacherState[t] || { originalLoad: 0 };
        const vs = vacancies.filter(v => v.absentTeacher === t);
        const compensated = vs.filter(v => v.status && v.status.indexOf("SUCCESS") === 0 && v.status !== "SUCCESS_NO_ACTION").length;
        return {
          name: t, lessonsToday: st.originalLoad, affected: vs.length, compensated: compensated,
          note: st.originalLoad === 0 ? "لا حصص لهذا المعلم في هذا اليوم — لا تأثير" : ""
        };
      });
    }

    // ============================================================
    // UI CONTROLLER
    // ============================================================
    function init() {
      const dateDaySelect = document.getElementById("dateDay");
      const monthSelect = document.getElementById("dateMonth");
      const yearSelect = document.getElementById("dateYear");

      const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
      months.forEach(function (m, i) {
        const o = document.createElement("option");
        o.value = i + 1;
        o.textContent = m;
        monthSelect.appendChild(o);
      });
      const curYear = new Date().getFullYear();
      for (let y = curYear - 1; y <= curYear + 2; y++) {
        const o = document.createElement("option");
        o.value = y;
        o.textContent = y;
        yearSelect.appendChild(o);
      }

      const today = new Date();
      monthSelect.value = today.getMonth() + 1;
      yearSelect.value = today.getFullYear();
      rebuildDateDays(today.getDate());
      syncDayFromDate();

      dateDaySelect.addEventListener("change", syncDayFromDate);
      monthSelect.addEventListener("change", function () {
        rebuildDateDays(parseInt(dateDaySelect.value) || 1);
        syncDayFromDate();
      });
      yearSelect.addEventListener("change", function () {
        rebuildDateDays(parseInt(dateDaySelect.value) || 1);
        syncDayFromDate();
      });
      const filterInput = document.getElementById("teacherFilter");
      if (filterInput) filterInput.addEventListener("input", applyTeacherFilter);
    }

    function rebuildDateDays(preferredDay) {
      const daySelect = document.getElementById("dateDay");
      const month = parseInt(document.getElementById("dateMonth").value);
      const year = parseInt(document.getElementById("dateYear").value);
      if (!month || !year) return;
      const maxDay = new Date(year, month, 0).getDate();
      const selected = Math.min(Math.max(parseInt(preferredDay) || 1, 1), maxDay);
      daySelect.innerHTML = "";
      for (let d = 1; d <= maxDay; d++) {
        const option = document.createElement("option");
        option.value = d;
        option.textContent = d;
        daySelect.appendChild(option);
      }
      daySelect.value = selected;
    }

    function syncDayFromDate() {
      const d = parseInt(document.getElementById("dateDay").value);
      const m = parseInt(document.getElementById("dateMonth").value);
      const y = parseInt(document.getElementById("dateYear").value);
      if (!d || !m || !y) return;
      const date = new Date(y, m - 1, d);
      const dayMap = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      const day = dayMap[date.getDay()];
      document.getElementById("daySelect").value = day;

      const hasSchedule = !!ORIGINAL_SCHEDULE[day];
      ["runBtn", "occupancyBtn", "printOriginalBtn"].forEach(function (id) {
        const button = document.getElementById(id);
        if (button) button.disabled = !hasSchedule;
      });
      const filterInput = document.getElementById("teacherFilter");
      if (filterInput) filterInput.disabled = !hasSchedule;

      updateDateDisplay();
      renderTeacherChips();
      applyTeacherFilter();
    }

    function applyTeacherFilter() {
      const filterInput = document.getElementById("teacherFilter");
      const q = (filterInput ? filterInput.value : "").trim();
      document.querySelectorAll(".teacher-chip").forEach(function (chip) {
        const match = !q || chip.dataset.teacher.indexOf(q) >= 0;
        chip.classList.toggle("hidden-by-filter", !match);
      });
    }

    function getSelectedDate() {
      const d = document.getElementById("dateDay").value;
      const m = document.getElementById("dateMonth").value;
      const y = document.getElementById("dateYear").value;
      if (!d || !m || !y) return "";
      return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    }

    function getSelectedDateArabic() {
      const d = document.getElementById("dateDay").value;
      const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
      const m = parseInt(document.getElementById("dateMonth").value);
      const y = document.getElementById("dateYear").value;
      if (!d || !m || !y) return "";
      return d + " " + months[m - 1] + " " + y;
    }

    function updateDateDisplay() {
      const day = document.getElementById("daySelect").value;
      const dateAr = getSelectedDateArabic();
      const display = document.getElementById("dateDisplay");
      if (day && dateAr) display.textContent = day + " — " + dateAr + (ORIGINAL_SCHEDULE[day] ? "" : " — لا يوجد جدول دراسي");
      else if (day) display.textContent = day;
      else display.textContent = "";
    }

    function dayLoads(day) {
      const loads = {};
      if (!ORIGINAL_SCHEDULE[day]) return loads;
      for (const cls of ALL_CLASSES) {
        const row = ORIGINAL_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (l && isRealLessonData(l.teacher, l.subject)) loads[l.teacher] = (loads[l.teacher] || 0) + 1;
        }
      }
      return loads;
    }

    function renderTeacherChips() {
      const grid = document.getElementById("teacherGrid");
      grid.innerHTML = "";
      const day = document.getElementById("daySelect").value;
      if (!ORIGINAL_SCHEDULE[day]) {
        grid.innerHTML = '<div class="no-school-day">لا يوجد جدول دراسي في ' + esc(day || "هذا اليوم") + '.</div>';
        document.getElementById("absentCount").textContent = "";
        return;
      }
      const loads = dayLoads(day);
      for (const t of ALL_TEACHERS) {
          if (isExcludedFromAll(t)) continue;
        const count = loads[t] || 0;
        const chip = document.createElement("div");
        chip.className = "teacher-chip" + (count === 0 ? " zero-load" : "");
        chip.dataset.teacher = t;
        chip.innerHTML = "<span>" + esc(t) + "</span>" +
          (count > 0 ? '<span class="chip-count">' + count + " حصة</span>" : '<span class="chip-count">لا حصص اليوم</span>') +
          '<span class="check"></span>';
        chip.addEventListener("click", function () { toggleTeacher(chip, t); });
        grid.appendChild(chip);
      }
    }

    function toggleTeacher(chip, teacher) {
      chip.classList.toggle("selected");
      const count = document.querySelectorAll(".teacher-chip.selected").length;
      document.getElementById("absentCount").textContent = count > 0 ? "(" + count + ")" : "";
    }

    function renderQuickSummary(res) {
      const s = res.stats;
      const successCount = s.completeSuccess + s.partialSuccess + s.noActionVacancies;
      document.getElementById("quickSummary").innerHTML =
        '<div class="qs-item qs-neutral"><div class="qs-num">' + s.absentTeachers + '</div><div class="qs-lbl">معلمون غائبون</div></div>' +
        '<div class="qs-item qs-neutral"><div class="qs-num">' + s.affectedClasses + '</div><div class="qs-lbl">شعب متأثرة</div></div>' +
        '<div class="qs-item qs-ok"><div class="qs-num">' + successCount + '</div><div class="qs-lbl">حصص غياب عولجت</div></div>' +
        '<div class="qs-item ' + (s.fallbacks > 0 ? "qs-danger" : "qs-ok") + '"><div class="qs-num">' + s.fallbacks + '</div><div class="qs-lbl">استعصاءات تعويض</div></div>';

      const banner = document.getElementById("attentionBanner");
      const pressureCount = (res.finalGaps || []).filter(g => g.type === LessonStatus.SHIFT_EMPTY && g.needsAttention).length;
      const notices = [];
      if (s.fallbacks > 0) {
        notices.push('⚠️ يوجد <strong>' + s.fallbacks + '</strong> استعصاء تعويض: بقيت حصة غياب دون تغطية بالحركة بعد المراحل الثلاث.');
      }
      if (pressureCount > 0) {
        notices.push('📌 يوجد <strong>' + pressureCount + '</strong> استعصاء ضغط: غُطيت حصة الغياب لكن بقي فراغ داخلي قبل نهاية الدوام.');
      }
      banner.innerHTML = notices.length ? '<div class="attention-banner"' + (s.fallbacks ? '' : ' style="background:rgba(251,191,36,0.12);border-color:rgba(251,191,36,0.5);color:var(--warning)"') + '>' + notices.join('<br>') + '</div>' : '';
    }

    function buildBusyMatrix(fieldDay, classes) {
      const busy = {};
      for (let p = 1; p <= 7; p++) busy[p] = {};
      for (const cls of classes) {
        const row = fieldDay && fieldDay[cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (!isActiveLesson(l)) continue;
          busy[p][l.teacher] = cls;
        }
      }
      return busy;
    }

    function validateOccupancyIntegrity(day, absent, vacancyList, weeklyLoads, priorWeeklyOccupancy) {
      const issues = [];
      const dailyLoad = {};
      const occupancyLoad = {};
      for (let p = 1; p <= 7; p++) {
        const busy = new Map();
        for (const cls of ALL_CLASSES) {
          const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (!isActiveLesson(cell)) continue;
          if (absent.includes(cell.teacher)) issues.push("المعلم الغائب " + cell.teacher + " مكلّف في الحصة " + p);
          if (busy.has(cell.teacher)) issues.push("تعارض للمعلم " + cell.teacher + " في الحصة " + p + " بين " + busy.get(cell.teacher) + " و" + cls);
          else busy.set(cell.teacher, cls);
          dailyLoad[cell.teacher] = (dailyLoad[cell.teacher] || 0) + 1;
          if (cell.status === LessonStatus.OCCUPANCY) occupancyLoad[cell.teacher] = (occupancyLoad[cell.teacher] || 0) + 1;
        }
      }
      for (const [teacher, count] of Object.entries(dailyLoad)) {
        if (count > ENGINE_CONFIG.MAX_DAILY_TOTAL) issues.push("تجاوز النصاب اليومي للمعلم " + teacher + ": " + count);
      }
      for (const [teacher, count] of Object.entries(occupancyLoad)) {
        if (count > ENGINE_CONFIG.MAX_OCCUPANCY_PER_DAY) issues.push("تجاوز حد الإشغال للمعلم " + teacher + ": " + count);
        const baseLoad = weeklyLoads[teacher] || 0;
        const effectiveWeeklyLoad = baseLoad + (priorWeeklyOccupancy[teacher] || 0) + count;
        if (baseLoad >= ENGINE_CONFIG.TARGET_WEEKLY_LOAD) issues.push("تم إشغال معلم نصابه " + baseLoad + ": " + teacher);
        if (effectiveWeeklyLoad > ENGINE_CONFIG.TARGET_WEEKLY_LOAD) issues.push("تجاوز السقف الأسبوعي 24 للمعلم " + teacher + ": " + effectiveWeeklyLoad);
      }
      for (const vac of vacancyList) {
        const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][vac.class] && FIELD_SCHEDULE[day][vac.class][vac.period];
        if (!cell || (cell.status !== LessonStatus.OCCUPANCY && cell.status !== LessonStatus.UNAVAILABLE)) {
          issues.push("حصة الغياب لم تُحسم: " + vac.class + " ح" + vac.period);
        }
      }
      return { allPassed: issues.length === 0, issues: issues };
    }

    function runOccupancy() {
      const day = document.getElementById("daySelect").value;
      if (!day) { alert("الرجاء اختيار اليوم أولاً"); return; }
      if (!ORIGINAL_SCHEDULE[day]) { alert("لا توجد بيانات لليوم المختار"); return; }

      const absentCountTemp = document.querySelectorAll(".teacher-chip.selected").length;
      if (absentCountTemp === 0) { alert("الرجاء تحديد معلم غائب واحد على الأقل"); return; }

      const absent = [];
      document.querySelectorAll(".teacher-chip.selected").forEach(chip => {
        const t = chip.dataset.teacher;
        if (isExcludedFromAll(t)) {
          console.warn("تم تجاهل المعلم المستثنى:", t);
          return;
        }
        absent.push(t);
      });
      if (absent.length === 0) { alert("الرجاء تحديد معلم غائب واحد على الأقل غير مستثنى"); return; }

      currentDay = day;
      currentDate = getSelectedDate() || "";
      lastOperationType = "occupancy";
      globalSearchInfo = null;
      absentList = absent.slice();

      if (!FIELD_SCHEDULE) FIELD_SCHEDULE = {};
      FIELD_SCHEDULE[day] = {};
      vacancies = [];
      movementLog = [];
      chains = [];
      buildTeacherState(day);
      calculateOriginalEnd(day);

      const origDay = ORIGINAL_SCHEDULE[day] || {};
      let occupancyCount = 0;
      const uncovered = [];

      for (const cls of ALL_CLASSES) {
        if (!FIELD_SCHEDULE[day][cls]) FIELD_SCHEDULE[day][cls] = {};
        for (let p = 1; p <= 7; p++) {
          const l = origDay[cls] && origDay[cls][p];
          if (l && isRealLessonData(l.teacher, l.subject)) {
            if (absent.includes(l.teacher)) {
              vacancies.push({ class: cls, period: p, originalTeacher: l.teacher, subject: l.subject });
              FIELD_SCHEDULE[day][cls][p] = {
                teacher: "", subject: "",
                originalPeriod: p, currentPeriod: p,
                status: LessonStatus.ABSENCE_EMPTY,
                absentTeacher: l.teacher, absentSubject: l.subject, lessonId: null
              };
            } else {
              FIELD_SCHEDULE[day][cls][p] = {
                teacher: l.teacher, subject: l.subject,
                originalPeriod: p, currentPeriod: p,
                status: LessonStatus.NORMAL,
                lessonId: day + "|" + cls + "|" + p + "|" + l.teacher + "|" + l.subject
              };
            }
          } else {
            FIELD_SCHEDULE[day][cls][p] = {
              teacher: "", subject: "", originalPeriod: p, currentPeriod: p,
              status: LessonStatus.EMPTY, lessonId: null
            };
          }
        }
      }

      const weeklyLoads = {};
      for (const d of Object.keys(ORIGINAL_SCHEDULE)) {
        for (const cls of ALL_CLASSES) {
          const row = ORIGINAL_SCHEDULE[d][cls];
          if (!row) continue;
          for (let p = 1; p <= 7; p++) {
            const l = row[p];
            if (l && isRealLessonData(l.teacher, l.subject)) {
              weeklyLoads[l.teacher] = (weeklyLoads[l.teacher] || 0) + 1;
            }
          }
        }
      }

      const dailyTotal = {};
      ALL_TEACHERS.forEach(t => dailyTotal[t] = 0);
      for (const cls of ALL_CLASSES) {
        for (let p = 1; p <= 7; p++) {
          const c = FIELD_SCHEDULE[day][cls][p];
          if (isActiveLesson(c)) dailyTotal[c.teacher] = (dailyTotal[c.teacher] || 0) + 1;
        }
      }

      const todayOccupancy = {};
      ALL_TEACHERS.forEach(t => todayOccupancy[t] = 0);
      const selectedDate = getSelectedDate();
      const fairnessRunKey = selectedDate ? selectedDate + "|" + day : "";
      const priorWeeklyOccupancy = ALL_TEACHERS.reduce((acc, t) => {
        acc[t] = FairnessLedger.getWeekCount(t, selectedDate, fairnessRunKey);
        return acc;
      }, {});
      const assignedToday = [];

      vacancies.sort((a, b) => a.period - b.period);

      for (const vac of vacancies) {
        const p = vac.period;
        const cls = vac.class;

        const busy = buildBusyMatrix(FIELD_SCHEDULE[day], ALL_CLASSES);

        let bestSub = null;
        let bestScore = -Infinity;

        for (const t of ALL_TEACHERS) {
          if (isExemptFromOccupancy(t)) continue;
          if (absent.includes(t)) continue;
          if (busy[p][t]) continue;
          
          if ((dailyTotal[t] || 0) >= ENGINE_CONFIG.MAX_DAILY_TOTAL) continue;
          if ((todayOccupancy[t] || 0) >= ENGINE_CONFIG.MAX_OCCUPANCY_PER_DAY) continue;

          const effectiveWeeklyLoad = (weeklyLoads[t] || 0) + (priorWeeklyOccupancy[t] || 0) + (todayOccupancy[t] || 0);
          const remainingToTarget = ENGINE_CONFIG.TARGET_WEEKLY_LOAD - effectiveWeeklyLoad;
          if (remainingToTarget <= 0) continue;

          // العدالة أساسها أكبر فرق متبقٍ للوصول إلى النصاب 24، ثم الأقل إشغالًا اليوم.
          const score = (remainingToTarget * 1000) - ((todayOccupancy[t] || 0) * 100) - (dailyTotal[t] || 0);
          
          if (score > bestScore) {
            bestScore = score;
            bestSub = t;
          }
        }

        if (bestSub) {
          todayOccupancy[bestSub] = (todayOccupancy[bestSub] || 0) + 1;
          dailyTotal[bestSub] = (dailyTotal[bestSub] || 0) + 1;
          assignedToday.push(bestSub);
          occupancyCount++;

          FIELD_SCHEDULE[day][cls][p] = {
            teacher: bestSub, subject: vac.subject,
            originalPeriod: p, currentPeriod: p,
            status: LessonStatus.OCCUPANCY,
            originalTeacher: vac.originalTeacher,
            lessonId: "occupancy|" + day + "|" + cls + "|" + p + "|" + bestSub
          };
        } else {
          uncovered.push(vac);
          FIELD_SCHEDULE[day][cls][p] = {
            teacher: "", subject: vac.subject,
            originalPeriod: p, currentPeriod: p,
            status: LessonStatus.UNAVAILABLE,
            absentTeacher: vac.originalTeacher, lessonId: null
          };
        }
      }

      const occupancyIntegrity = validateOccupancyIntegrity(day, absent, vacancies, weeklyLoads, priorWeeklyOccupancy);
      if (!occupancyIntegrity.allPassed) {
        console.error("فشل فحص سلامة الإشغال", occupancyIntegrity.issues);
        alert("فشل فحص سلامة الإشغال: " + occupancyIntegrity.issues.join(" | "));
        return;
      }

      if (assignedToday.length) {
        if (fairnessRunKey) FairnessLedger.add(fairnessRunKey, assignedToday);
      }

      const banner = document.getElementById("attentionBanner");
      if (uncovered.length) {
        banner.innerHTML =
          '<div class="attention-banner">⚠️ تم تغطية ' + occupancyCount +
          ' حصة. يوجد <strong>' + uncovered.length +
          '</strong> استعصاء إشغال: لم يوجد معلم بديل مؤهل ضمن القيود في ' +
          uncovered.map(u => esc(u.class) + ' ح' + u.period).join("، ") + '</div>';
      } else {
        banner.innerHTML =
          '<div class="attention-banner" style="background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.45);color:var(--success)">✅ تم إشغال ' +
          occupancyCount + ' حصة بتوزيع عادل بنجاح.</div>';
      }

      document.getElementById("quickSummary").innerHTML = "";
      updateDateDisplay();
      renderScheduleTable(day);
      document.getElementById("reportContainer").innerHTML = "";
      document.getElementById("output").style.display = "block";
    }

    function runCompensation() {
      const day = document.getElementById("daySelect").value;
      if (!day) { alert("اختر اليوم أولًا"); return; }
      if (!ORIGINAL_SCHEDULE[day]) { alert("لا يوجد جدول دراسي في اليوم الموافق للتاريخ المختار"); return; }
      const date = getSelectedDate() || "";
      const absent = [];
      document.querySelectorAll(".teacher-chip.selected").forEach(chip => absent.push(chip.dataset.teacher));
      if (absent.length === 0) { alert("اختر معلمًا غائبًا واحدًا على الأقل"); return; }

      const btnLabel = document.getElementById("runBtnLabel");
      const runBtn = document.getElementById("runBtn");
      const originalLabel = btnLabel ? btnLabel.textContent : "";
      if (btnLabel) btnLabel.textContent = "⏳ جارٍ الحساب...";
      if (runBtn) runBtn.disabled = true;

      let res;
      try {
        res = runEngine(day, date, absent);
      } catch (e) {
        alert("حدث خطأ أثناء المعالجة: " + e.message);
        if (btnLabel) btnLabel.textContent = originalLabel;
        if (runBtn) runBtn.disabled = false;
        return;
      }
      if (btnLabel) btnLabel.textContent = originalLabel;
      if (runBtn) runBtn.disabled = false;

      updateDateDisplay();

      renderQuickSummary(res);
      renderScheduleTable(day);
      document.getElementById("reportContainer").innerHTML = generateReport(day, res.integrity, res);
      document.getElementById("output").style.display = "block";
      document.getElementById("output").scrollIntoView({ behavior: "smooth" });
    }

        chip.classList.remove("selected");

      document.getElementById("output").style.display = "none";

      document.getElementById("scheduleTableWrapper").innerHTML = "";
      document.getElementById("reportContainer").innerHTML = "";
      document.getElementById("teacherPrintNotice").innerHTML = "";

      document.body.classList.remove("print-original", "print-report");
      FIELD_SCHEDULE = null;
      absentList = [];
      teacherState = {};
      originalEndMap = {};
      movementLog = [];
      chains = [];
      vacancies = [];
      currentDay = "";
      currentDate = "";
      originalScheduleSnapshot = "";
      engineRunTime = "";
      lastIntegrity = null;
      chainSeq = 0;
      globalSearchInfo = null;
      lastOperationType = "";

    function renderScheduleTable(day) {
      const wrapper = document.getElementById("scheduleTableWrapper");

      let html = '<table class="schedule-table"><thead><tr>';
      html += "<th>الحصة</th>";
      for (const cls of ALL_CLASSES) html += "<th>" + cls.replace("الصف ", "") + "</th>";
      html += "</tr></thead><tbody>";

      for (let p = 1; p <= 7; p++) {
        html += "<tr>";
        html += '<td class="period-col">' + PERIOD_NAMES[p] + "</td>";

        for (const cls of ALL_CLASSES) {
          const lesson = FIELD_SCHEDULE[day][cls][p];
          if (!lesson) { html += '<td class="cell-empty-original">—</td>'; continue; }

          const vacancyState = vacancies.find(v => (v.className || v.class) === cls && v.period === p);
          const isFallbackTarget = !!vacancyState && vacancyState.status === "FALLBACK";

          let cellClass = "";
          let content = "";

                    if (lesson.status === LessonStatus.NORMAL) {
            cellClass = "cell-normal" + (isFallbackTarget ? " cell-fallback" : "");
            content = '<div class="cell-info"><span class="subject-name">' + esc(lesson.subject) +
              '</span><span class="teacher-name">' + esc(lesson.teacher) + "</span></div>";
          } else if (lesson.status === LessonStatus.OCCUPANCY) {
            cellClass = "cell-occupancy" + (isFallbackTarget ? " cell-fallback" : "");
            content = '<div class="cell-info"><span class="subject-name">' + esc(lesson.subject) +
              '</span><span class="teacher-name" style="color:var(--success);font-weight:bold;">' + esc(lesson.teacher) + 
              '</span><span style="font-size:0.7em;color:var(--success);font-weight:700">إشغال ناجح</span>' +
              '<span style="font-size:0.7em;color:var(--text2)">بدل: ' + esc(lesson.originalTeacher) + '</span></div>';
          } else if (lesson.status === LessonStatus.SHIFTED) {
            const isCross = movementLog.some(m =>
              (m.movementType === "EXCEPTIONAL_CROSS_CLASS" || m.movementType === "EXCEPTIONAL_REVERSE") &&
              m.targetClass === cls && m.toPeriod === p);
            const isRipple = movementLog.some(m => m.movementType === "RIPPLE_SWAP" && m.targetClass === cls && m.toPeriod === p);
            cellClass = (isCross ? "cell-cross" : "cell-shifted") + (isFallbackTarget ? " cell-fallback" : "");
            const badge = isCross ? '<span class="move-badge cross">عابر</span>'
              : isRipple ? '<span class="move-badge ripple">داخلي</span>'
                : '<span class="move-badge direct">مباشر</span>';
            content = '<div class="cell-info"><span class="subject-name">' + esc(lesson.subject) +
              '</span><span class="teacher-name">' + esc(lesson.teacher) + "</span>" + badge +
              '<span style="font-size:0.65em;color:var(--text2)">من ' + lesson.originalPeriod + "</span></div>";
          } else if (lesson.status === LessonStatus.ABSENCE_EMPTY) {
            cellClass = "cell-absence-empty" + (isFallbackTarget ? " cell-fallback" : "");
            const isEndAbsence = !!vacancyState && vacancyState.status === "SUCCESS_NO_ACTION";
            const absenceLabel = isFallbackTarget ? "استعصاء تعويض" : isEndAbsence ? "غياب نهاية الدوام" : "غياب قيد المعالجة";
            const absenceIcon = isFallbackTarget ? "⚠️" : isEndAbsence ? "🕒" : "🚫";
            content = '<div class="cell-info"><span style="font-size:1.1em">' + absenceIcon + '</span><span>' + absenceLabel + '</span>' +
              (lesson.absentTeacher ? '<span class="teacher-name">' + esc(lesson.absentTeacher) + '</span>' : '') +
              (lesson.absentSubject ? '<span style="font-size:0.65em;color:var(--text2)">' + esc(lesson.absentSubject) + "</span>" : "") + "</div>";
          } else if (lesson.status === LessonStatus.UNAVAILABLE) {
            cellClass = "cell-absence-empty";
            content = '<div class="cell-info"><span style="font-size:1.1em">⚠️</span><span>استعصاء إشغال</span>' +
              (lesson.absentTeacher ? '<span class="teacher-name">' + esc(lesson.absentTeacher) + '</span>' : '') +
              (lesson.subject ? '<span style="font-size:0.65em;color:var(--text2)">' + esc(lesson.subject) + "</span>" : "") + "</div>";
          } else if (lesson.status === LessonStatus.SHIFT_EMPTY) {
            const internalGap = p < originalEndMap[cls];
            cellClass = "cell-shift-empty";
            content = '<div class="cell-info"><span style="font-size:1em">' + (internalGap ? "⚠" : "⬜") +
              '</span><span>' + (internalGap ? "استعصاء ضغط" : "فراغ نهاية الدوام") + "</span></div>";
          } else {
            cellClass = "cell-empty-original";
            content = "—";
          }
          html += '<td class="' + cellClass + '">' + content + "</td>";
        }
        html += "</tr>";
      }

      html += "</tbody></table>";
      wrapper.innerHTML = html;
    }

    // ============================================================
    // BOOT
    // ============================================================
    if (typeof document !== "undefined") {
      document.addEventListener("DOMContentLoaded", function () {
        init();
      });
    }
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محرك تعويض الحصص المدرسي </title>
  <style>
    :root {
      --bg: #f3f6fb;
      --bg2: #eef4fb;
      --bg3: #f8fafc;
      --surface: #ffffff;
      --border: #d8e1ec;
      --text: #172033;
      --text2: #64748b;
      --accent: #0369a1;
      --accent2: #4f46e5;
      --success: #059669;
      --warning: #b45309;
      --danger: #dc2626;
      --shifted: #7c3aed;
      --absence: #ef4444;
      --shift-empty: #f59e0b;
      --cross: #06b6d4;
      --fallback: #f43f5e;
      --radius: 10px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 100%;
      padding: 12px;
    }

    .header {
      background: linear-gradient(135deg, #ffffff 0%, #e8f3ff 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .header h1 {
      font-size: 1.3em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .header .school-name {
      font-size: 1em;
      color: var(--text2);
    }

    .header .date-info {
      font-size: 0.85em;
      color: var(--accent);
      margin-top: 4px;
    }

    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-group label {
      display: block;
      font-size: 0.9em;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .day-select {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
      appearance: none;
      cursor: pointer;
    }

    .derived-day:disabled {
      opacity: 1;
      cursor: default;
      color: var(--text);
      background: var(--bg3);
    }

    .no-school-day {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.1);
      color: #92400e;
      font-weight: 700;
    }

    .date-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
    }

    .teacher-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .teacher-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.82em;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .teacher-chip:active {
      transform: scale(0.95);
    }

    .teacher-chip.selected {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 600;
    }

    .teacher-chip .check {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-radius: 4px;
      margin-left: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .teacher-chip.selected .check {
      background: var(--danger);
      border-color: var(--danger);
    }

    .teacher-chip.selected .check::after {
      content: '✓';
      color: white;
      font-size: 10px;
      font-weight: bold;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: default;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-print {
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    .schedule-section {
      margin-bottom: 12px;
    }

    .schedule-section h2 {
      font-size: 1.1em;
      color: var(--accent);
      margin-bottom: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75em;
      min-width: 600px;
    }

    .schedule-table th,
    .schedule-table td {
      padding: 6px 4px;
      text-align: center;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .schedule-table thead th {
      background: var(--bg2);
      color: var(--accent);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .schedule-table tbody td {
      background: var(--surface);
      vertical-align: middle;
    }

    .schedule-table .period-col {
      background: var(--bg3);
      font-weight: 700;
      color: var(--accent);
      min-width: 40px;
    }

    .cell-occupancy {
      background: rgba(22, 163, 74, 0.15) !important;
      border-left: 3px solid var(--success) !important;
    }
    .cell-shifted {
      background: rgba(124, 58, 237, 0.2) !important;
      border-left: 3px solid var(--shifted) !important;
    }

    .cell-absence-empty {
      background: rgba(239, 68, 68, 0.15) !important;
      color: var(--danger) !important;
    }

    .cell-shift-empty {
      background: rgba(245, 158, 11, 0.15) !important;
      color: var(--shift-empty) !important;
    }

    .cell-cross {
      background: rgba(6, 182, 212, 0.2) !important;
      border-left: 3px solid var(--cross) !important;
    }

    .cell-fallback {
      background: rgba(244, 63, 94, 0.2) !important;
      color: var(--fallback) !important;
      font-weight: 600;
    }

    .cell-empty-original {
      background: var(--bg) !important;
      color: var(--text2) !important;
    }

    .teacher-name {
      font-weight: 600;
    }

    .subject-name {
      font-size: 0.9em;
      color: var(--text2);
    }

    .cell-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .move-badge {
      font-size: 0.7em;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    .move-badge.direct {
      background: rgba(52, 211, 153, 0.3);
      color: var(--success);
    }

    .move-badge.ripple {
      background: rgba(129, 140, 248, 0.3);
      color: var(--accent2);
    }

    .move-badge.cross {
      background: rgba(6, 182, 212, 0.3);
      color: var(--cross);
    }

    .report-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .report-section h2 {
      font-size: 1.1em;
      color: var(--accent);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .report-section h3 {
      font-size: 0.95em;
      color: var(--accent2);
      margin: 10px 0 6px;
    }

    .report-item {
      background: var(--bg3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.85em;
      line-height: 1.8;
    }

    .report-item .label {
      color: var(--text2);
    }

    .report-item .value {
      color: var(--text);
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }

    .status-success {
      background: rgba(52, 211, 153, 0.2);
      color: var(--success);
    }

    .status-fallback {
      background: rgba(244, 63, 94, 0.2);
      color: var(--fallback);
    }

    .status-noaction {
      background: rgba(148, 163, 184, 0.2);
      color: var(--text2);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--bg3);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .stat-card .num {
      font-size: 1.5em;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-card .lbl {
      font-size: 0.75em;
      color: var(--text2);
      margin-top: 2px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      font-size: 0.75em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    #output {
      display: none;
    }

    .chip-count {
      font-size: 0.72em;
      color: var(--text2);
      margin-left: 4px;
    }

    .teacher-chip.zero-load {
      opacity: 0.45;
    }

    .tests-table td {
      text-align: right;
    }

    .tests-table td.t-pass {
      color: var(--success);
      font-weight: 700;
    }

    .tests-table td.t-fail {
      color: var(--fallback);
      font-weight: 700;
    }

    .teacher-filter {
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 8px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9em;
      font-family: inherit;
    }

    .teacher-filter::placeholder {
      color: var(--text2);
    }

    .teacher-chip.hidden-by-filter {
      display: none;
    }

    .quick-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-summary .qs-item {
      border-radius: var(--radius);
      padding: 10px 12px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .quick-summary .qs-num {
      font-size: 1.4em;
      font-weight: 800;
      line-height: 1.1;
    }

    .quick-summary .qs-lbl {
      font-size: 0.72em;
      color: var(--text2);
      margin-top: 2px;
    }

    .quick-summary .qs-ok {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.4);
    }

    .quick-summary .qs-ok .qs-num {
      color: var(--success);
    }

    .quick-summary .qs-warn {
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.4);
    }

    .quick-summary .qs-warn .qs-num {
      color: var(--warning);
    }

    .quick-summary .qs-danger {
      background: rgba(244, 63, 94, 0.14);
      border-color: rgba(244, 63, 94, 0.45);
    }

    .quick-summary .qs-danger .qs-num {
      color: var(--fallback);
    }

    .quick-summary .qs-neutral {
      background: var(--bg3);
    }

    .quick-summary .qs-neutral .qs-num {
      color: var(--accent);
    }

    .attention-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: var(--fallback);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.88em;
      font-weight: 600;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .teacher-chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .teacher-chip {
      outline: none;
    }

    .teacher-print-notice {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
        font-size: 10pt;
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      }

      .no-print {
        display: none !important;
      }

      body.print-original #reportContainer,
      body.print-original .teacher-print-notice {
        display: none !important;
      }

      body.print-report .teacher-print-notice {
        display: block !important;
        margin-top: 5px;
        border: 2px solid #1a1a2e;
        padding: 6px;
        page-break-inside: avoid;
      }

      body.print-report #reportContainer {
        display: none !important;
      }

      body.print-report .header {
        padding: 5px 8px;
        margin-bottom: 4px;
      }

      body.print-report .schedule-section h2 {
        margin: 2px 0 4px;
        padding: 2px 0;
      }

      body.print-report .schedule-table {
        font-size: 6.7pt;
      }

      body.print-report .schedule-table th,
      body.print-report .schedule-table td {
        padding: 2px 1px;
      }

      body.print-report .teacher-name {
        font-size: 0.88em;
      }

      body.print-report .subject-name {
        font-size: 0.78em;
      }

      .teacher-print-notice h2 {
        margin: 0 0 4px;
        font-size: 9.5pt;
        color: #1a1a2e;
      }

      .teacher-print-notice table {
        width: 100%;
        border-collapse: collapse;
        font-size: 7pt;
      }

      .teacher-print-notice th,
      .teacher-print-notice td {
        border: 1px solid #777;
        padding: 2px 4px;
        text-align: right;
      }

      .teacher-print-notice th {
        background: #e5e7eb !important;
        font-weight: 700;
      }

      .container {
        padding: 0;
        max-width: 100%;
      }

      .header {
        border: 2px solid #1a1a2e;
        background: white;
        box-shadow: none;
        padding: 10px;
        margin-bottom: 8px;
        page-break-inside: avoid;
      }

      .header h1 {
        -webkit-text-fill-color: #1a1a2e;
        color: #1a1a2e;
        background: none;
        font-size: 1.2em;
      }

      .header .school-name,
      .header .date-info {
        color: #333;
        font-size: 0.9em;
      }

      .schedule-section h2 {
        color: #1a1a2e;
        border-bottom: 2px solid #1a1a2e;
        font-size: 1em;
        padding: 4px 0;
        margin-bottom: 6px;
      }

      .schedule-table {
        min-width: unset;
        font-size: 8pt;
        width: 100%;
        border-collapse: collapse;
      }

      .schedule-table th {
        background: #1a1a2e !important;
        color: white !important;
        font-weight: 700;
        padding: 4px 3px;
        font-size: 7.5pt;
      }

      .schedule-table td {
        background: white;
        color: black;
        padding: 4px 3px;
        border: 1px solid #999;
      }

      .cell-shifted {
        background: #e8dff5 !important;
        border-right: 3px solid #7c3aed !important;
        color: #3b0764 !important;
      }

      .cell-absence-empty {
        background: #fde2e2 !important;
        color: #991b1b !important;
        font-weight: 700;
      }

      .cell-shift-empty {
        background: #fef3cd !important;
        color: #78350f !important;
      }

      .cell-cross {
        background: #d1ecf1 !important;
        border-right: 3px solid #0e7490 !important;
        color: #0e4f6b !important;
      }

      .cell-fallback {
        background: #fde2e2 !important;
        color: #991b1b !important;
        font-weight: 700;
      }

      .cell-empty-original {
        background: #f8f8f8 !important;
        color: #999 !important;
      }

      .teacher-name {
        font-weight: 700;
        font-size: 0.95em;
      }

      .subject-name {
        color: #444 !important;
        font-size: 0.85em;
      }

      .move-badge {
        border: 1px solid currentColor;
        font-size: 0.65em;
      }

      .report-section {
        background: white;
        border: 1px solid #ccc;
        box-shadow: none;
        page-break-inside: avoid;
        margin-bottom: 8px;
      }

      .report-section h2 {
        color: #1a1a2e;
        font-size: 0.95em;
      }

      .report-item {
        background: #f8f8f8;
        color: black;
        font-size: 0.8em;
        padding: 6px 8px;
        margin-bottom: 5px;
      }

      .stat-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .stat-card {
        background: #f8f8f8;
        border: 1px solid #ddd;
      }

      .stat-card .num {
        color: #1a1a2e;
        font-size: 1.2em;
      }

      .stat-card .lbl {
        color: #555;
        font-size: 0.7em;
      }

      .table-wrapper {
        border: 1px solid #999;
        box-shadow: none;
        overflow: visible;
      }

      .period-col {
        background: #e0e0e0 !important;
        color: #1a1a2e !important;
        font-weight: 700;
      }

      .schedule-table thead th {
        position: static;
      }

      #output {
        display: block !important;
      }

      @page {
        margin: 1cm 0.7cm;
        size: A4 landscape;
      }

      .quick-summary,
      .attention-banner {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ محرك تعويض الحصص المدرسي </h1>
      <div class="school-name">مدرسة أبي بكر الصديق الأساسية للبنين</div>
      <div class="date-info" id="dateDisplay"></div>
    </div>

    <div class="controls no-print">
      <div style="display:flex; gap:16px; margin-bottom:12px; flex-wrap:wrap;">
        <div class="control-group" style="flex:1; margin-bottom:0; min-width:150px;">
          <label>📅 اليوم (يُحدَّد تلقائيًا)</label>
          <select class="day-select derived-day" id="daySelect" disabled aria-label="اليوم المستنتج من التاريخ">
            <option value="الأحد">الأحد</option>
            <option value="الاثنين">الاثنين</option>
            <option value="الثلاثاء">الثلاثاء</option>
            <option value="الأربعاء">الأربعاء</option>
            <option value="الخميس">الخميس</option>
            <option value="الجمعة">الجمعة</option>
            <option value="السبت">السبت</option>
          </select>
        </div>
        <div class="control-group" style="flex:2; margin-bottom:0; min-width:250px;">
          <label>📆 التاريخ</label>
          <div style="display:flex;gap:6px;align-items:center">
            <select class="day-select" id="dateDay" style="flex:1;min-width:0"></select>
            <select class="day-select" id="dateMonth" style="flex:1.4;min-width:0"></select>
            <select class="day-select" id="dateYear" style="flex:1.2;min-width:0"></select>
          </div>
        </div>
      </div>
      <div class="control-group">
        <label>🚫 المعلمون الغائبون <span id="absentCount" style="color:var(--danger)"></span></label>
        <input type="text" class="teacher-filter" id="teacherFilter"
          placeholder="🔍 ابحث عن اسم معلم للتصفية السريعة..." autocomplete="off">
        <div class="teacher-grid" id="teacherGrid"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="runBtn" onclick="runCompensation()" style="flex:1.5;min-width:120px;">
          <span id="runBtnLabel">⚡ تطبيق التعويض</span>
        </button>
        <button class="btn btn-primary" id="occupancyBtn" onclick="runOccupancy()" style="flex:1.5;min-width:120px; background:linear-gradient(135deg, var(--success), #10b981); box-shadow:0 4px 15px rgba(16,185,129,0.3);">
          <span>👤 إشغال الحصص</span>
        </button>
        <button class="btn btn-print" id="printOriginalBtn" onclick="printOriginalSchedule()" style="flex:1;min-width:120px;margin-top:0;">
          🖨️ طباعة جدول اليوم
        </button>
        <button class="btn btn-print" id="resetBtn" onclick="resetSelections()"
          style="flex:0 0 auto;width:auto;padding:12px 16px;margin-top:0;" title="مسح كل اختيارات الغائبين">

    function extractAllTeachers() {
      const set = new Set();
      for (const day of Object.keys(RAW_SCHEDULE_DATA)) {
        for (const cls of Object.keys(RAW_SCHEDULE_DATA[day])) {
          for (let p = 1; p <= 7; p++) {
            const cell = RAW_SCHEDULE_DATA[day][cls][p];
            if (cell && cell.teacher && cell.teacher.trim() !== "") {
              set.add(cell.teacher.trim());
            }
          }
        }
      }
      return Array.from(set).sort();
    }

      EXCLUDED_TEACHERS: ["عمار"],
      OCCUPANCY_EXEMPT_TEACHERS: [],
      TARGET_WEEKLY_LOAD: 24,
      MAX_DAILY_TOTAL: 6,
      MAX_OCCUPANCY_PER_DAY: 6,
      EXCEPTIONAL_REVERSE_MAX_PERIOD: 5,
      GLOBAL_SEARCH_TIME_MS: 1800,
      GLOBAL_SEARCH_MAX_NODES: 8000,
      FAIRNESS_STORAGE_KEY: "sqs_fairness_v1"
    });

    const FairnessLedger = (() => {
      let state = { version: 2, totals: {}, runs: {} };
      try {
        const saved = JSON.parse(localStorage.getItem(ENGINE_CONFIG.FAIRNESS_STORAGE_KEY));
        if (saved && saved.version === 2 && saved.totals && saved.runs) {
          state = saved;
        } else if (saved && typeof saved === "object") {
          // ترحيل آمن للنسخة القديمة التي كانت تحفظ المجاميع فقط.
          for (const [teacher, total] of Object.entries(saved)) state.totals[teacher] = Number(total) || 0;
        }
      } catch (_) {}
      const persist = () => {
        try { localStorage.setItem(ENGINE_CONFIG.FAIRNESS_STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      };
      const weekKeyFromDate = (dateStr) => {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || "");
        if (!match) return "";
        const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        const weekStart = new Date(date);
        weekStart.setDate(date.getDate() - date.getDay());
        return weekStart.getFullYear() + "-" + String(weekStart.getMonth() + 1).padStart(2, "0") + "-" + String(weekStart.getDate()).padStart(2, "0");
      };
      return {
        get(t) { return Number(state.totals[t]) || 0; },
        getWeekCount(t, dateStr, excludedRunKey) {
          const targetWeek = weekKeyFromDate(dateStr);
          if (!targetWeek) return 0;
          let count = 0;
          for (const [runKey, assignments] of Object.entries(state.runs)) {
            if (runKey === excludedRunKey || !Array.isArray(assignments)) continue;
            const runDate = runKey.split("|")[0];
            if (weekKeyFromDate(runDate) !== targetWeek) continue;
            count += assignments.filter(name => name === t).length;
          }
          return count;
        },
        add(runKey, assignments) {
          if (!runKey) return;
          const previous = Array.isArray(state.runs[runKey]) ? state.runs[runKey] : [];
          for (const t of previous) state.totals[t] = Math.max(0, (Number(state.totals[t]) || 0) - 1);
          const next = assignments.slice();
          for (const t of next) state.totals[t] = (Number(state.totals[t]) || 0) + 1;
          state.runs[runKey] = next;
          persist();
        },
        clear() {
          state = { version: 2, totals: {}, runs: {} };
          try { localStorage.removeItem(ENGINE_CONFIG.FAIRNESS_STORAGE_KEY); } catch (_) {}
        }
      };
    })();

    }

    function printFullReport() {
      if (!lastOperationType || !currentDay || !FIELD_SCHEDULE || !FIELD_SCHEDULE[currentDay]) {
        alert("طبّق التعويض أو الإشغال أولًا ثم اطبع التقرير");
        return;
      }
      const headerTitle = document.querySelector('.header h1');
      const originalTitle = headerTitle.innerHTML;
      headerTitle.innerHTML = lastOperationType === "occupancy" ? "تقرير إشغال الحصص" : "تقرير تعويض الحصص";
      document.getElementById("teacherPrintNotice").innerHTML = lastOperationType === "occupancy" ?
        buildOccupancyPrintNotice(currentDay) : buildTeacherPrintNotice(currentDay);
      document.body.classList.add("print-report");
      setTimeout(function() {
        window.print();
        document.body.classList.remove("print-report");
        headerTitle.innerHTML = originalTitle;
      }, 200);
    }

    function movementExplanation(movement) {
      const chain = chains.find(c => c.id === movement.chainId);
      const target = chain ? (chain.className + " ح" + chain.targetPeriod) : movement.targetClass;
      if (movement.movementType === "DIRECT_TAIL_PULL")
        return "لتغطية غياب " + (chain ? chain.absentTeacher : "المعلم الغائب") + " في " + target;
      if (movement.movementType === "RIPPLE_SWAP")
        return "لدفع الفراغ الناتج عن التعويض نحو نهاية دوام الشعبة";
      if (movement.movementType === "EXCEPTIONAL_REVERSE")
        return "حركة عكسية ضمن المرحلة الثالثة لتغطية غياب " + (chain ? chain.absentTeacher : "المعلم الغائب") + "؛ ضمن الحد حتى الخامسة";
      if (movement.movementType === "EXCEPTIONAL_CROSS_CLASS")
        return "جزء من تبادل آمن في المرحلة الثالثة لتغطية غياب " + (chain ? chain.absentTeacher : "المعلم الغائب") + " في " + target;
      return "ضمن سلسلة تعويض حصة غياب";
    }

    function describePressureGap(day, cls, period) {
      const end = originalEndMap[cls] || 0;
      const row = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls];
      if (!row) return "لم يوجد مسار قانوني لإغلاقه ضمن القيود الحالية";
      const excluded = new Set();
      const conflicts = new Set();
      for (let q = period + 1; q <= end; q++) {
        const candidate = row[q];
        if (!isActiveLesson(candidate)) continue;
        if (isExcludedFromAll(candidate.teacher)) {
          excluded.add(candidate.teacher);
          continue;
        }
        const busyClass = findClassOfTeacherAt(candidate.teacher, day, period);
        if (busyClass && busyClass !== cls) {
          conflicts.add(candidate.teacher + " لديه حصة في " + busyClass + " ح" + period);
        }
      }
      if (excluded.size) return "المعلم " + Array.from(excluded).join("، ") + " مستثنى من الحركة";
      if (conflicts.size) return Array.from(conflicts).join("؛ ");
      return "لم يوجد مسار قانوني لإغلاقه ضمن القيود الحالية";
    }

    function buildTeacherPrintAlerts(day) {
      const alerts = [];
      for (const cls of ALL_CLASSES) {
        const end = originalEndMap[cls] || 0;
        const row = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p < end; p++) {
          const gap = row[p];
          if (!gap || gap.status !== LessonStatus.SHIFT_EMPTY) continue;
          alerts.push('<div><strong>استعصاء ضغط — ' + esc(cls) + ' ح' + p + ':</strong> ' + esc(describePressureGap(day, cls, p)) + '.</div>');
        }
      }

      for (const v of vacancies.filter(item => item.status === "FALLBACK")) {
        alerts.push('<div><strong>استعصاء تعويض — ' + esc(v.className) + ' ح' + v.period + ':</strong> غياب ' +
          esc(v.absentTeacher) + ' لم يُغطَّ بالحركة؛ ' + esc(v.failureReason || "لم يوجد حل قانوني ضمن القيود الحالية") + '.</div>');
      }

      if (!alerts.length) return '<div><strong>الاستعصاءات:</strong> لا توجد استعصاءات أو فراغات داخلية متبقية.</div>';
      return '<div><strong>تنبيهات ضرورية:</strong></div>' + alerts.join("");
    }

    function buildTeacherPrintNotice(day) {
      const affected = absentList.map(teacher => {
        const teacherVacancies = vacancies.filter(v => v.absentTeacher === teacher);
        const classes = teacherVacancies.map(v => {
          let result = "تم التعويض";
          if (v.status === "SUCCESS_NO_ACTION") result = "غياب نهاية الدوام — لا حركة مطلوبة";
          else if (v.status === "FALLBACK") result = "استعصاء تعويض — لم تُغطَّ بالحركة";
          return v.className + " (ح" + v.period + ": " + result + ")";
        });
        return '<div><strong>المعلم الغائب: ' + esc(teacher) + '</strong> — الشعب المتأثرة: ' +
          (classes.length ? classes.map(esc).join('، ') : 'لا توجد حصص متأثرة') + '</div>';
      }).join("");

      let rows = "";
      for (const m of movementLog) {
        rows += '<tr><td>' + esc(m.teacher) + '</td><td>' + esc(m.subject) + '</td><td>' + esc(m.sourceClass) +
          '</td><td>الحصة ' + m.fromPeriod + '</td><td>الحصة ' + m.toPeriod + '</td><td>' +
          esc(movementExplanation(m)) + '</td></tr>';
      }
      if (!rows) rows = '<tr><td colspan="6">لم تتطلب الحالة تحريك أي حصة.</td></tr>';

      return '<h2>بيان الغياب والحركات — موجّه للمعلمين</h2>' +
        '<div style="margin-bottom:4px;line-height:1.35">' + affected + '</div>' +
        '<table><thead><tr><th>المعلم المتحرك</th><th>المادة</th><th>الشعبة</th><th>من</th><th>إلى</th><th>سبب الحركة</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
        '<div style="margin-top:4px;line-height:1.35;font-size:7.2pt">' + buildTeacherPrintAlerts(day) + '</div>';
    }

    function buildOccupancyPrintNotice(day) {
      const affected = absentList.map(teacher => {
        const items = vacancies.filter(v => (v.originalTeacher || v.absentTeacher) === teacher)
          .map(v => (v.class || v.className) + " (ح" + (v.period || v.targetPeriod) + ")");
        return '<div><strong>المعلم الغائب: ' + esc(teacher) + '</strong> — الشعب المتأثرة: ' +
          (items.length ? items.map(esc).join('، ') : 'لا توجد حصص متأثرة') + '</div>';
      }).join("");
      let rows = "";
      for (const cls of ALL_CLASSES) {
        for (let p = 1; p <= 7; p++) {
          const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
          if (!cell || (cell.status !== LessonStatus.OCCUPANCY && cell.status !== LessonStatus.UNAVAILABLE)) continue;
          const result = cell.status === LessonStatus.OCCUPANCY ? "إشغال ناجح — " + cell.teacher : "استعصاء إشغال — بلا معلم متاح";
          const originalTeacher = cell.originalTeacher || cell.absentTeacher || "—";
          rows += '<tr><td>' + esc(originalTeacher) + '</td><td>' + esc(cls) + '</td><td>الحصة ' + p +
            '</td><td>' + esc(cell.subject || cell.absentSubject || "—") + '</td><td>' + esc(result) + '</td></tr>';
        }
      }
      if (!rows) rows = '<tr><td colspan="5">لا توجد تكليفات إشغال في هذا التشغيل.</td></tr>';
      return '<h2>بيان إشغال حصص الغياب — موجّه للمعلمين</h2>' +
        '<div style="margin-bottom:8px;line-height:1.7">' + affected + '</div>' +
        '<table><thead><tr><th>المعلم الغائب</th><th>الشعبة</th><th>الحصة</th><th>المادة</th><th>المعلم المكلّف</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function deepFreeze(obj) {
      if (obj && typeof obj === "object") {
        Object.freeze(obj);
        Object.values(obj).forEach(deepFreeze);
      }
      return obj;
    }

    const BLANK_TOKENS = ["", "-", "*", "–", "—", "x", "X", "لا شيء", "فراغ"];

    function isBlankToken(v) {
      if (v === null || v === undefined) return true;
      return BLANK_TOKENS.indexOf(String(v).trim()) >= 0;
    }

    function isRealLessonData(teacher, subject) {
      return !isBlankToken(teacher) && !isBlankToken(subject);
    }

    function isLessonStatus(st) { return st === LessonStatus.NORMAL || st === LessonStatus.SHIFTED || st === LessonStatus.OCCUPANCY; }

    function isGapStatus(st) {
      return st === LessonStatus.ABSENCE_EMPTY || st === LessonStatus.SHIFT_EMPTY || st === LessonStatus.EMPTY;
    }

    function isActiveLesson(cell) {
      return !!cell && isLessonStatus(cell.status) &&
        !isBlankToken(cell.teacher) && !isBlankToken(cell.subject) && !!cell.lessonId;
    }

    function isAbsent(teacher) {
      const st = teacherState[teacher];
      return !!st && st.status === "UNAVAILABLE";
    }

    function normalizeOriginal(raw) {
      const out = {};
      for (const day of Object.keys(raw)) {
        out[day] = {};
        for (const cls of Object.keys(raw[day])) {
          out[day][cls] = {};
          for (let p = 1; p <= 7; p++) {
            const cell = raw[day][cls][p];
            const teacher = (cell && cell.teacher != null) ? String(cell.teacher).trim() : "";
            const subject = (cell && cell.subject != null) ? String(cell.subject).trim() : "";
            out[day][cls][p] = isRealLessonData(teacher, subject) ? { teacher, subject } : { teacher: "", subject: "" };
          }
        }
      }
      return out;
    }

    let ORIGINAL_SCHEDULE = deepFreeze(normalizeOriginal(RAW_SCHEDULE_DATA));
    let ALL_CLASSES = RAW_CLASS_LIST.slice();

    // ============================================================
    // STAGE 0
    // ============================================================
    function buildTeacherState(day) {
      teacherState = {};
      for (const cls of ALL_CLASSES) {
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (!row) continue;
        for (let p = 1; p <= 7; p++) {
          const l = row[p];
          if (l && isRealLessonData(l.teacher, l.subject)) {
            if (!teacherState[l.teacher]) teacherState[l.teacher] = { status: "AVAILABLE", originalLoad: 0, fieldLoad: 0 };
            teacherState[l.teacher].originalLoad++;
            teacherState[l.teacher].fieldLoad++;
          }
        }
      }
      for (const t of absentList) {
        if (!teacherState[t]) teacherState[t] = { status: "AVAILABLE", originalLoad: 0, fieldLoad: 0 };
        teacherState[t].status = "UNAVAILABLE";
      }
    }

    function calculateOriginalEnd(day) {
      originalEndMap = {};
      for (const cls of ALL_CLASSES) {
        let lastReal = 0;
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        if (row) {
          for (let p = 1; p <= 7; p++) {
            const l = row[p];
            if (l && isRealLessonData(l.teacher, l.subject)) lastReal = p;
          }
        }
        originalEndMap[cls] = lastReal;
      }
    }

    function createFieldSchedule(day) {
      FIELD_SCHEDULE = {};
      FIELD_SCHEDULE[day] = {};
      for (const cls of ALL_CLASSES) {
        FIELD_SCHEDULE[day][cls] = {};
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const orig = row ? row[p] : null;
          if (orig && isRealLessonData(orig.teacher, orig.subject)) {
            FIELD_SCHEDULE[day][cls][p] = {
              teacher: orig.teacher, subject: orig.subject,
              originalPeriod: p, currentPeriod: p,
              status: LessonStatus.NORMAL,
              lessonId: day + "|" + cls + "|" + p + "|" + orig.teacher + "|" + orig.subject
            };
          } else {
            FIELD_SCHEDULE[day][cls][p] = {
              teacher: "", subject: "",
              originalPeriod: p, currentPeriod: p,
              status: LessonStatus.EMPTY, lessonId: null
            };
          }
        }
      }
    }

    function markAbsentTeachers(day) {
      for (const cls of ALL_CLASSES) {
        const row = FIELD_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const lesson = row[p];
          if (lesson && lesson.status === LessonStatus.NORMAL && isAbsent(lesson.teacher)) {
            lesson.status = LessonStatus.ABSENCE_EMPTY;
          }
        }
      }
    }

    function createAbsenceVacancies(day) {
      vacancies = [];
      for (const cls of ALL_CLASSES) {
        const oe = originalEndMap[cls];
        const row = FIELD_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const lesson = row[p];
          if (lesson && lesson.status === LessonStatus.ABSENCE_EMPTY) {
            const at = lesson.teacher, sub = lesson.subject;
            lesson.teacher = "";
            lesson.subject = "";
            lesson.absentTeacher = at;
            lesson.absentSubject = sub;
            vacancies.push({
              className: cls, period: p, absentTeacher: at, subject: sub,
              originalEnd: oe, needsProcessing: p < oe,
              status: p < oe ? "PENDING" : "SUCCESS_NO_ACTION",
              chainId: null
            });
          }
        }
      }
    }

    // ============================================================
    // CORE FUNCTIONS
    // ============================================================
    function isTeacherFree(teacher, day, period) {
      if (isExcludedFromAll(teacher)) return false;
      if (!teacherState[teacher]) return false;
      if (isAbsent(teacher)) return false;
      for (const cls of ALL_CLASSES) {
        const lesson = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][period];
        if (isActiveLesson(lesson) && lesson.teacher === teacher) return false;
      }
      return true;
    }

    function findClassOfTeacherAt(teacher, day, period) {
      for (const cls of ALL_CLASSES) {
        const lesson = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][period];
        if (isActiveLesson(lesson) && lesson.teacher === teacher) return cls;
      }
      return null;
    }

    function noConflictsAtPeriod(day, p) {
      const seen = {};
      for (const cls of ALL_CLASSES) {
        const l = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
        if (!isActiveLesson(l)) continue;
        if (seen[l.teacher]) return false;
        seen[l.teacher] = cls;
      }
      return true;
    }

    function executeMove(cls, fromPeriod, toPeriod, day, movementType, reason, chainId) {
      const src = FIELD_SCHEDULE[day][cls][fromPeriod];
      const dst = FIELD_SCHEDULE[day][cls][toPeriod];
      if (!isActiveLesson(src)) throw new Error("executeMove: المصدر ليس حصة فعلية (" + cls + " ح" + fromPeriod + ")");
      if (src.protectedTargetOf) throw new Error("executeMove: المصدر هدف تعويض محمي لسلسلة أخرى (" + src.protectedTargetOf + ")");
      if (isAbsent(src.teacher)) throw new Error("executeMove: المعلم غائب (" + src.teacher + ")");
      if (!dst || !isGapStatus(dst.status)) throw new Error("executeMove: الوجهة ليست فراغًا (" + cls + " ح" + toPeriod + " = " + (dst && dst.status) + ")");
      if (toPeriod >= originalEndMap[cls]) throw new Error("executeMove: الوجهة عند Original_End أو بعده (" + cls + " ح" + toPeriod + " >= End=" + originalEndMap[cls] + ") — منع وضع حصة في منطقة الاستقبال");
      if (!isTeacherFree(src.teacher, day, toPeriod)) throw new Error("executeMove: تعارض المعلم " + src.teacher + " في الوجهة ح" + toPeriod);
      if (fromPeriod <= toPeriod) throw new Error("executeMove: الحركة العادية يجب أن تكون من حصة متأخرة إلى حصة أبكر");

      const movedTeacher = src.teacher, sourceOriginalPeriod = src.originalPeriod;
      FIELD_SCHEDULE[day][cls][toPeriod] = {
        teacher: src.teacher, subject: src.subject,
        originalPeriod: src.originalPeriod, currentPeriod: toPeriod,
        status: LessonStatus.SHIFTED, lessonId: src.lessonId
      };
      FIELD_SCHEDULE[day][cls][fromPeriod] = {
        teacher: "", subject: "",
        originalPeriod: fromPeriod, currentPeriod: fromPeriod,
        status: LessonStatus.SHIFT_EMPTY, lessonId: null,
        movedTeacher: movedTeacher, sourceOriginalPeriod: sourceOriginalPeriod,
        createdByChainId: chainId, createdByMovementSeq: null
      };
      const entry = pushMovement(day, cls, cls, src.teacher, src.subject, src.lessonId,
        fromPeriod, toPeriod, movementType, reason, chainId);
      FIELD_SCHEDULE[day][cls][fromPeriod].createdByMovementSeq = entry.seq;
      return entry;
    }

    function pushMovement(day, sourceClass, targetClass, teacher, subject, lessonId,
      fromPeriod, toPeriod, movementType, reason, chainId) {
      const entry = {
        seq: movementLog.length + 1,
        day, date: currentDate,
        sourceClass, targetClass, teacher, subject, lessonId,
        fromPeriod, toPeriod, movementType, reason,
        result: "EXECUTED", chainId, timestamp: Date.now()
      };
      movementLog.push(entry);
      const chain = chains.find(c => c.id === chainId);
      if (chain) chain.moves.push(movementLog.length);
      return entry;
    }

    function findDirectPlans(cls, targetPeriod, originalEnd, day) {
      const candidates = [];
      for (let P = originalEnd; P > targetPeriod; P--) {
        const slot = FIELD_SCHEDULE[day][cls][P];
        if (!isActiveLesson(slot)) continue;
        if (slot.protectedTargetOf) continue;
        if (!isTeacherFree(slot.teacher, day, targetPeriod)) continue;

        if (P === originalEnd) {
          candidates.push({ fromPeriod: P, teacher: slot.teacher, ripplePath: [], finalGap: originalEnd, reachedEnd: true });
          continue;
        }
        const simRow = simulateDirectMove(cls, day, P, targetPeriod);
        const ripple = findRipplePath(cls, P, originalEnd, day, false, simRow);
        candidates.push({
          fromPeriod: P, teacher: slot.teacher,
          ripplePath: ripple.path, finalGap: ripple.finalGap, reachedEnd: ripple.reachedEnd
        });
      }
      candidates.sort((a, b) => {
        if (a.reachedEnd !== b.reachedEnd) return a.reachedEnd ? -1 : 1;
        if (a.finalGap !== b.finalGap) return b.finalGap - a.finalGap;
        const am = 1 + a.ripplePath.length,
          bm = 1 + b.ripplePath.length;
        if (am !== bm) return am - bm;
        return b.fromPeriod - a.fromPeriod;
      });
      return candidates;
    }

    function findBestDirectPlan(cls, targetPeriod, originalEnd, day) {
      const candidates = findDirectPlans(cls, targetPeriod, originalEnd, day);
      return candidates.length ? candidates[0] : null;
    }

    function simulateDirectMove(cls, day, fromP, toP) {
      const row = {};
      for (let p = 1; p <= 7; p++) row[p] = Object.assign({}, FIELD_SCHEDULE[day][cls][p]);
      const source = row[fromP];
      row[toP] = Object.assign({}, source, { status: LessonStatus.SHIFTED, currentPeriod: toP });
      row[fromP] = {
        teacher: "", subject: "", originalPeriod: fromP, currentPeriod: fromP,
        status: LessonStatus.SHIFT_EMPTY, lessonId: null
      };
      return row;
    }

    function findRipplePath(cls, gapStart, originalEnd, day, filterProtected, startingRow) {
      const cloneCell = (c) => Object.assign({}, c);
      const cloneRow = () => {
        const r = {};
        for (let p = 1; p <= 7; p++) {
          const src = startingRow ? startingRow[p] :
            ((FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p]) || null);
          r[p] = cloneCell(src ||
            { teacher: "", subject: "", originalPeriod: p, currentPeriod: p, status: LessonStatus.EMPTY, lessonId: null });
        }
        return r;
      };
      const applyToRow = (row, fromP, toP) => {
        const nr = {};
        for (let p = 1; p <= 7; p++) nr[p] = cloneCell(row[p]);
        nr[toP] = Object.assign({}, row[fromP], { status: LessonStatus.SHIFTED, currentPeriod: toP });
        nr[fromP] = { teacher: "", subject: "", originalPeriod: fromP, currentPeriod: fromP, status: LessonStatus.SHIFT_EMPTY, lessonId: null };
        return nr;
      };
      const busyAt = (teacher, q, simRow) => {
        if (isExcludedFromAll(teacher)) return true;
        if (!teacherState[teacher]) return true;
        if (isAbsent(teacher)) return true;
        const sc = simRow[q];
        if (sc && isLessonStatus(sc.status) && sc.teacher === teacher) return true;
        for (const oc of ALL_CLASSES) {
          if (oc === cls) continue;
          const l = FIELD_SCHEDULE[day][oc] && FIELD_SCHEDULE[day][oc][q];
          if (l && isLessonStatus(l.status) && l.teacher === teacher) return true;
        }
        return false;
      };

      const signature = (row) => {
        let s = "";
        for (let p = 1; p <= originalEnd; p++) {
          const c = row[p];
          s += (c && isLessonStatus(c.status) && c.lessonId) ? (c.lessonId + ".") : "-.";
        }
        return s;
      };

      const start = { gap: gapStart, path: [], row: cloneRow() };
      const queue = [start];
      const visited = new Set([gapStart + "#" + signature(start.row)]);
      let reachEnd = null;
      let best = start;
      let guard = 0;

      while (queue.length && !reachEnd) {
        const node = queue.shift();
        for (let P = node.gap + 1; P <= originalEnd; P++) {
          if (++guard > 50000) return { path: [], finalGap: gapStart, reachedEnd: false };
          const slot = node.row[P];
          if (!isActiveLesson(slot)) continue;
          if (slot.protectedTargetOf) continue;
          if (busyAt(slot.teacher, node.gap, node.row)) continue;
          const next = {
            gap: P,
            path: node.path.concat([{ teacher: slot.teacher, subject: slot.subject, fromPeriod: P, toPeriod: node.gap }]),
            row: applyToRow(node.row, P, node.gap)
          };
          const key = P + "#" + signature(next.row);
          if (visited.has(key)) continue;
          visited.add(key);
          if (P === originalEnd) { reachEnd = next; break; }
          if (P > best.gap || (P === best.gap && next.path.length < best.path.length)) best = next;
          queue.push(next);
        }
      }
      if (reachEnd) return { path: reachEnd.path, finalGap: originalEnd, reachedEnd: true };
      return { path: best.path, finalGap: best.gap, reachedEnd: false };
    }

    function detectRippleLoop(path) {
      let g = null;
      for (const s of path) {
        if (g !== null && !(s.fromPeriod > g)) return true;
        g = s.fromPeriod;
      }
      return false;
    }

    function executeRipple(path, cls, day, chainId) {
      if (detectRippleLoop(path)) throw new Error("كُشفت دورة في مسار الداخلي");
      for (const step of path) {
        executeMove(cls, step.fromPeriod, step.toPeriod, day, "RIPPLE_SWAP",
          "داخلي: دفع الفراغ من الحصة " + step.toPeriod + " نحو نهاية الدوام", chainId);
      }
    }

    function findCrossClassPlans(classA, targetPeriod, originalEndA, day) {
      const attempts = [];
      const plans = [];
      if (!engineOptions.allowExceptionalReverse) {
        return { plans: [], attempts: [{ why: "المرحلة الثالثة غير مفعلة" }] };
      }
      for (let P = originalEndA; P > targetPeriod; P--) {
        const slot = FIELD_SCHEDULE[day][classA][P];
        if (!isActiveLesson(slot)) continue;
        if (slot.protectedTargetOf) continue;
        const X = slot.teacher;
        if (isTeacherFree(X, day, targetPeriod)) continue;
        const classB = findClassOfTeacherAt(X, day, targetPeriod);
        if (!classB || classB === classA) {
          attempts.push({ teacher: X, p: P, why: "تعذر تحديد شعبة إشغاله عند الهدف" });
          continue;
        }
        const endB = originalEndMap[classB];
        let foundForCandidate = false;
        const exceptionalLimit = Math.min(endB, ENGINE_CONFIG.EXCEPTIONAL_REVERSE_MAX_PERIOD);
        for (let T2 = exceptionalLimit; T2 > targetPeriod; T2--) {
          const ySlot = FIELD_SCHEDULE[day][classB][T2];
          if (!isActiveLesson(ySlot)) continue;
          if (ySlot.protectedTargetOf) continue;
          const Y = ySlot.teacher;
          if (Y === X) continue;
          if (!isTeacherFree(Y, day, targetPeriod)) continue;
          if (!isTeacherFree(X, day, T2)) continue;
          plans.push({ classA, classB, teacherX: X, teacherY: Y, targetPeriod, freePeriod: T2, candidateP: P });
          foundForCandidate = true;
        }
        if (!foundForCandidate) {
          attempts.push({
            teacher: X, p: P, classB: classB,
            why: "لا توجد حركة عكسية صالحة داخل " + classB + " حتى الحصة " + exceptionalLimit
          });
        }
      }
      plans.sort((a, b) => {
        const ad = a.freePeriod - a.targetPeriod, bd = b.freePeriod - b.targetPeriod;
        if (ad !== bd) return ad - bd;
        if (a.candidateP !== b.candidateP) return b.candidateP - a.candidateP;
        return ALL_CLASSES.indexOf(a.classB) - ALL_CLASSES.indexOf(b.classB);
      });
      return { plans, attempts };
    }

    function tryCrossClassCascade(classA, targetPeriod, originalEndA, day, chain) {
      const result = findCrossClassPlans(classA, targetPeriod, originalEndA, day);
      chain.crossAttempts = result.attempts;
      return result.plans.length ? result.plans[0] : null;
    }

    function executeCrossClass(plan, day, chain) {
      const classA = plan.classA,
        classB = plan.classB;
      const teacherX = plan.teacherX,
        teacherY = plan.teacherY;
      const T = plan.targetPeriod,
        T2 = plan.freePeriod,
        P = plan.candidateP;

      const endB = originalEndMap[classB];
      const endA = originalEndMap[classA];
      if (!engineOptions.allowExceptionalReverse) return false;
      if (T2 > endB || T2 <= T || T2 > ENGINE_CONFIG.EXCEPTIONAL_REVERSE_MAX_PERIOD) return false;
      if (P > endA || P <= T) return false;
      const aT = FIELD_SCHEDULE[day][classA][T];
      const bT = FIELD_SCHEDULE[day][classB][T];
      const bT2 = FIELD_SCHEDULE[day][classB][T2];
      const aP = FIELD_SCHEDULE[day][classA][P];
      const preOK = !!(aT && isGapStatus(aT.status)) &&
        !!(bT && isActiveLesson(bT) && !bT.protectedTargetOf && bT.teacher === teacherX && !isAbsent(teacherX)) &&
        !!(bT2 && isActiveLesson(bT2) && !bT2.protectedTargetOf && bT2.teacher === teacherY && teacherY !== teacherX && !isAbsent(teacherY)) &&
        !!(aP && isActiveLesson(aP) && !aP.protectedTargetOf && aP.teacher === teacherX) &&
        classB !== classA &&
        isTeacherFree(teacherY, day, T) &&
        isTeacherFree(teacherX, day, T2);
      if (!preOK) return false;

      const snap = { aT: deepClone(aT), bT: deepClone(bT), bT2: deepClone(bT2), aP: deepClone(aP) };

      FIELD_SCHEDULE[day][classB][T] = Object.assign({}, bT2, { status: LessonStatus.SHIFTED, currentPeriod: T });
      FIELD_SCHEDULE[day][classB][T2] = Object.assign({}, bT, { status: LessonStatus.SHIFTED, currentPeriod: T2 });
      FIELD_SCHEDULE[day][classA][T] = Object.assign({}, aP, { status: LessonStatus.SHIFTED, currentPeriod: T });
      FIELD_SCHEDULE[day][classA][P] = {
        teacher: "", subject: "", originalPeriod: P, currentPeriod: P,
        status: LessonStatus.SHIFT_EMPTY, lessonId: null,
        movedTeacher: teacherX, sourceOriginalPeriod: aP.originalPeriod,
        createdByChainId: chain.id, createdByMovementSeq: null
      };

      let ok = true;
      if (!isActiveLesson(FIELD_SCHEDULE[day][classB][T]) || FIELD_SCHEDULE[day][classB][T].teacher !== teacherY) ok = false;
      if (!isActiveLesson(FIELD_SCHEDULE[day][classB][T2]) || FIELD_SCHEDULE[day][classB][T2].teacher !== teacherX) ok = false;
      if (!isActiveLesson(FIELD_SCHEDULE[day][classA][T]) || FIELD_SCHEDULE[day][classA][T].teacher !== teacherX) ok = false;
      if (FIELD_SCHEDULE[day][classA][P].status !== LessonStatus.SHIFT_EMPTY) ok = false;
      if (FIELD_SCHEDULE[day][classA][T].lessonId !== aP.lessonId) ok = false;
      if (FIELD_SCHEDULE[day][classB][T].lessonId !== bT2.lessonId) ok = false;
      if (FIELD_SCHEDULE[day][classB][T2].lessonId !== bT.lessonId) ok = false;
      if (bT.lessonId === bT2.lessonId || bT.lessonId === aP.lessonId || bT2.lessonId === aP.lessonId) ok = false;
      if (JSON.stringify(ORIGINAL_SCHEDULE) !== originalScheduleSnapshot) ok = false;
      if (!Object.isFrozen(ORIGINAL_SCHEDULE)) ok = false;

      if (!ok) {
        FIELD_SCHEDULE[day][classA][T] = snap.aT;
        FIELD_SCHEDULE[day][classB][T] = snap.bT;
        FIELD_SCHEDULE[day][classB][T2] = snap.bT2;
        FIELD_SCHEDULE[day][classA][P] = snap.aP;
        return false;
      }

      const mv1 = pushMovement(day, classB, classB, teacherY, bT2.subject, bT2.lessonId, T2, T,
        "EXCEPTIONAL_CROSS_CLASS",
        "تحرير " + teacherX + " (مشغول في " + classB + " بالحصة " + T + ") — سحب حصة " + teacherY + " من " + T2 + " إلى " + T,
        chain.id);
      const mv2 = pushMovement(day, classB, classB, teacherX, bT.subject, bT.lessonId, T, T2,
        "EXCEPTIONAL_REVERSE",
        "إتمام تحرير " + teacherX + ": انتقال حصته إلى الحصة " + T2 + " في " + classB,
        chain.id);
      const mv3 = pushMovement(day, classA, classA, teacherX, aP.subject, aP.lessonId, P, T,
        "EXCEPTIONAL_CROSS_CLASS",
        "تعويض عبر الشعب: نقل حصة " + teacherX + " من " + P + " إلى الهدف " + T + " في " + classA + " بعد تحريره من " + classB,
        chain.id);
      FIELD_SCHEDULE[day][classA][P].createdByMovementSeq = mv3.seq;
      if (!chain.crossInfo) chain.crossInfo = {
        classA: classA, classB: classB, teacherX: teacherX, teacherY: teacherY,
        targetPeriod: T, freePeriod: T2, candidateP: P,
        movements: [mv1.seq, mv2.seq, mv3.seq],
        exceptional: true,
        result: "حل المرحلة الثالثة: نقل حصة " + teacherX + " إلى الحصة " + T2 + " (ضمن الحد الخامس) ثم تغطية الهدف دون فقد أي حصة"
      };
      return true;
    }

    function buildFailureReason(cls, T, EndA, day, chain) {
      const cands = [];
      for (let P = EndA; P > T; P--) {
        const slot = FIELD_SCHEDULE[day][cls][P];
        if (!slot) { cands.push("الحصة " + P + ": غير موجودة"); continue; }
        if (!isActiveLesson(slot)) {
          const kind = slot.status === LessonStatus.SHIFT_EMPTY ? "فراغ نقل"
            : slot.status === LessonStatus.ABSENCE_EMPTY ? "فراغ غياب" : "غير مبرمجة أصلًا";
          cands.push("الحصة " + P + ": " + kind + " — ليست مرشحًا للسحب");
          continue;
        }
        if (isTeacherFree(slot.teacher, day, T)) {
          cands.push("الحصة " + P + " (" + slot.teacher + "): متفرغ — تعارض داخلي");
        } else {
          const b = findClassOfTeacherAt(slot.teacher, day, T);
          cands.push("الحصة " + P + " (" + slot.teacher + "): مشغول عند الحصة " + T + " في " + (b || "؟"));
        }
      }
      const cc = chain.crossAttempts.length ?
        chain.crossAttempts.map(a => (a.teacher ? a.teacher + " (مرشح عند الحصة " + a.p + "): " : "") + a.why).join("؛ ") :
        "لا مرشحين فوق الهدف";
      return "فشل Direct: لا توجد حصة لاحقة (من " + EndA + " إلى " + (T + 1) + ") متفرغ معلمها عند الحصة " + T + ". " +
        "فشل Ripple: لا توجد حركة أولى ممكنة (شرط المرشح الأول مطابق لشرط Direct). " +
        "نتيجة المرحلة الثالثة العابرة للشعب: " + cc + ". " +
        "المرشحون المفحوصون: " + (cands.join("، ") || "لا يوجد");
    }

    function documentGapBlockers(cls, gap, endA, day) {
      const parts = [];
      for (let P = gap + 1; P <= endA; P++) {
        const slot = FIELD_SCHEDULE[day][cls][P];
        if (!slot || !isActiveLesson(slot)) {
          const kind = !slot ? "غير موجودة"
            : slot.status === LessonStatus.SHIFT_EMPTY ? "فراغ نقل"
              : slot.status === LessonStatus.ABSENCE_EMPTY ? "فراغ غياب (" + (slot.absentTeacher || "") + ")"
                : "غير مبرمجة أصلًا";
          parts.push("الحصة " + P + ": " + kind + " — ليست مرشحًا للسحب");
          continue;
        }
        if (slot.protectedTargetOf) {
          parts.push("الحصة " + P + " (" + slot.teacher + "): خلية هدف معوَّض لسلسلة أخرى — محمية ولا تُستنزف");
        } else if (isTeacherFree(slot.teacher, day, gap)) {
          parts.push("الحصة " + P + " (" + slot.teacher + "): متفرغ عند الحصة " + gap + " لكن مسار الدفع إليها غير قانوني ضمن القيود");
        } else {
          const b = findClassOfTeacherAt(slot.teacher, day, gap);
          parts.push("الحصة " + P + " (" + slot.teacher + "): مشغول بالحصة " + gap + " في " + (b || "؟"));
        }
      }
      return "تعذر دفع الفراغ من الحصة " + gap + " إلى نهاية الدوام (" + endA + ") — " +
        (parts.length ? parts.join("، ") : "لا توجد حصص لاحقة");
    }

    function finalizeChain(chain, method, finalGap, endA, day) {
      chain.method = method;
      chain.status = "SUCCESS_" + method;
      chain.finalGap = finalGap;
      chain.remainingGap = finalGap < endA;
      chain.completion = chain.remainingGap ? "PARTIAL" : "COMPLETE";
      if (chain.remainingGap) {
        chain.gapBlockedReason = documentGapBlockers(chain.className, finalGap, endA, day);
        if (chain.gapCrossFailedAt != null && chain.crossAttempts && chain.crossAttempts.length) {
          chain.gapBlockedReason += " | ومحاولة المرحلة الثالثة عبر الشعب فشلت أيضًا: " +
            chain.crossAttempts.map(a => (a.teacher ? a.teacher + " (مرشح عند الحصة " + a.p + "): " : "") + a.why).join("؛ ");
        }
        chain.note = "حمي الهدف وبعّد الفراغ إلى الحصة " + finalGap +
          " (أبعد موضع ممكن قانونيًا) — فراغ متبقٍ داخل الدوام يحتاج متابعة/قرارًا إداريًا";
      } else {
        chain.gapBlockedReason = null;
        chain.note = "استقر الفراغ في الحصة " + endA + " = Original_End (منطقة استقبال الفراغ) — نجاح مكتمل";
      }
    }

    function verifyChainOutcome(chain, day) {
      const cls = chain.className,
        T = chain.targetPeriod;
      const owned = [];
      for (let p = 1; p <= 7; p++) {
        const c = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
        if (c && c.status === LessonStatus.SHIFT_EMPTY && c.createdByChainId === chain.id) owned.push(p);
      }
      const targetCell = FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][T];

      if (chain.status === "SUCCESS_NO_ACTION") {
        if (chain.moves.length) throw new Error("NO_ACTION بحركات: " + chain.id);
        if (owned.length) throw new Error("NO_ACTION تملك فراغ نقل: " + chain.id);
        if (!targetCell || targetCell.status !== LessonStatus.ABSENCE_EMPTY)
          throw new Error("NO_ACTION وهدفها ليس فراغ غياب: " + chain.id);
        return;
      }
      if (chain.status === "FALLBACK") {
        if (chain.moves.length) throw new Error("FALLBACK بحركات: " + chain.id);
        if (owned.length) throw new Error("FALLBACK تملك فراغ نقل: " + chain.id);
        if (!targetCell || targetCell.status !== LessonStatus.ABSENCE_EMPTY)
          throw new Error("FALLBACK وهدفها ليس فراغ غياب متبقيًا: " + chain.id);
        return;
      }
      if (!chain.moves.length) throw new Error("سلسلة نجاح بلا حركات: " + chain.id);
      if (owned.length !== 1)
        throw new Error("سلسلة " + chain.id + " تملك " + owned.length + " فراغ نقل (المتوقع 1) — فجوة داخلية غير متطابقة");
      if (owned[0] !== chain.finalGap)
        throw new Error("finalGap المعلن " + chain.finalGap + " ≠ الفعلي " + owned[0] + " في " + chain.id);
      if (!isActiveLesson(targetCell))
        throw new Error("هدف السلسلة " + chain.id + " غير معوض رغم إعلان النجاح");
      if (!(chain.finalGap > T && chain.finalGap <= chain.originalEnd))
        throw new Error("finalGap خارج النطاق في " + chain.id);
      if (chain.completion !== (chain.remainingGap ? "PARTIAL" : "COMPLETE"))
        throw new Error("علامة completion غير متسقة في " + chain.id);
    }

    function deriveChainMethod(chain) {
      let hasExceptional = false,
        hasRipple = false;
      for (const m of movementLog) {
        if (m.chainId !== chain.id) continue;
        if (m.movementType === "EXCEPTIONAL_CROSS_CLASS" || m.movementType === "EXCEPTIONAL_REVERSE") hasExceptional = true;
        else if (m.movementType === "RIPPLE_SWAP") hasRipple = true;
      }
      if (hasExceptional) return "EXCEPTIONAL";
      if (hasRipple) return "RIPPLE";
      return "DIRECT";
    }

    function escalateGap(chain, day, gapStart, endA) {
      let gap = gapStart;
      const visited = new Set([gapStart]);
      let guard = 0;
      while (gap < endA && guard++ < 14) {
        const plan = findRipplePath(chain.className, gap, endA, day, true);
        if (plan.path.length) {
          executeRipple(plan.path, chain.className, day, chain.id);
          if (visited.has(plan.finalGap)) break;
          visited.add(plan.finalGap);
          gap = plan.finalGap;
        }
        if (gap >= endA) break;
        // الاستثناء لا يُصرف لتحسين موضع فجوة سلسلة نجحت أصلًا؛
        // يُتاح فقط لتغطية هدف غياب عجز التعويض العادي عن حله.
        break;
      }
      return gap;
    }

    function createChainForVacancy(v) {
      const cls = v.className,
        T = v.period,
        EndA = v.originalEnd;
      const chain = {
        id: "chain_" + (++chainSeq),
        className: cls, targetPeriod: T, absentTeacher: v.absentTeacher,
        subject: v.subject, originalEnd: EndA,
        method: null, status: null, finalGap: null, remainingGap: false,
        completion: null, gapBlockedReason: null, note: "",
        lastStageReached: null, failureReason: null,
        moves: [], crossInfo: null, crossAttempts: [], gapFills: [], gapCrossFailedAt: null
      };
      chains.push(chain);
      v.chainId = chain.id;
      v.chain = chain;
      return chain;
    }

    function listVacancyActions(v, day) {
      const T = v.period, EndA = v.originalEnd;
      if (T === EndA) return [{ kind: "NO_ACTION" }];
      const actions = findDirectPlans(v.className, T, EndA, day).map(plan => ({ kind: "DIRECT", plan }));
      const cross = findCrossClassPlans(v.className, T, EndA, day);
      for (const plan of cross.plans) actions.push({ kind: "CROSS", plan, crossAttempts: cross.attempts });
      actions.push({ kind: "FALLBACK", crossAttempts: cross.attempts });
      return actions;
    }

    function applyVacancyAction(v, day, action) {
      const cls = v.className,
        T = v.period,
        EndA = v.originalEnd;
      const chain = createChainForVacancy(v);

      if (action.kind === "NO_ACTION") {
        chain.method = "NO_ACTION";
        chain.status = "SUCCESS_NO_ACTION";
        chain.finalGap = T;
        chain.completion = "COMPLETE";
        chain.gapBlockedReason = null;
        chain.note = "الفراغ أصلاً في منطقة استقبال الفراغ (نهاية الدوام الأصلية) — لا حركة مطلوبة";
        v.status = chain.status;
      } else if (action.kind === "DIRECT") {
        const best = action.plan;
        chain.lastStageReached = "DIRECT";
        executeMove(cls, best.fromPeriod, T, day, "DIRECT_TAIL_PULL",
          "تغطية فراغ غياب " + v.absentTeacher + " في الحصة " + T + " ضمن الخطة العالمية",
          chain.id);
        chain.lastStageReached = "RIPPLE";
        if (best.ripplePath.length) executeRipple(best.ripplePath, cls, day, chain.id);
        finalizeChain(chain, deriveChainMethod(chain), best.finalGap, EndA, day);
        v.status = chain.status;
      } else if (action.kind === "CROSS") {
        chain.lastStageReached = "CROSS_CLASS";
        chain.crossAttempts = action.crossAttempts || [];
        if (!executeCrossClass(action.plan, day, chain)) throw new Error("تعذر تنفيذ بديل عالمي عابر للشعب");
        const gap = action.plan.candidateP;
        chain.lastStageReached = "RIPPLE";
        const rp = findRipplePath(cls, gap, EndA, day);
        if (rp.path.length) executeRipple(rp.path, cls, day, chain.id);
        finalizeChain(chain, deriveChainMethod(chain), rp.finalGap, EndA, day);
        v.status = chain.status;
      } else {
        chain.lastStageReached = "GLOBAL_SEARCH";
        chain.crossAttempts = action.crossAttempts || [];
        chain.method = "FALLBACK";
        chain.status = "FALLBACK";
        chain.finalGap = T;
        chain.completion = "FAILED";
        chain.gapBlockedReason = null;
        chain.failureReason = buildFailureReason(cls, T, EndA, day, chain);
        v.status = "FALLBACK";
      }

      verifyChainOutcome(chain, day);
      if (chain.moves.length > 0) {
        const cell = FIELD_SCHEDULE[day][chain.className] && FIELD_SCHEDULE[day][chain.className][chain.targetPeriod];
        if (cell && isActiveLesson(cell)) cell.protectedTargetOf = chain.id;
      }
      return chain;
    }

    function processTargetVacancyCore(v, day) {
      const actions = listVacancyActions(v, day);
      const preferred = actions.find(a => a.kind === "NO_ACTION") ||
        actions.find(a => a.kind === "DIRECT") ||
        actions.find(a => a.kind === "CROSS") || actions[actions.length - 1];
      return applyVacancyAction(v, day, preferred);
    }

    function processTargetVacancy(v, day) {
      return processTargetVacancyCore(v, day);
    }

    function finalizePendingPartials(day) {
      const partials = chains.filter(c => c.moves.length > 0 && c.completion === "PARTIAL");
      for (const c of partials) {
        const newGap = escalateGap(c, day, c.finalGap, c.originalEnd);
        finalizeChain(c, deriveChainMethod(c), newGap, c.originalEnd, day);
        verifyChainOutcome(c, day);
      }
    }

    function processCompensation(day) {
      const classOrder = function (a, b) {
        const ea = originalEndMap[a.className] != null ? originalEndMap[a.className] : a.originalEnd;
        const eb = originalEndMap[b.className] != null ? originalEndMap[b.className] : b.originalEnd;
        if (ea !== eb) return ea - eb;
        const pa = a.period != null ? a.period : a.targetPeriod;
        const pb = b.period != null ? b.period : b.targetPeriod;
        if (pa !== pb) return pa - pb;
        return ALL_CLASSES.indexOf(a.className) - ALL_CLASSES.indexOf(b.className);
      };
      const order = vacancies.slice().sort(classOrder);
      for (const v of order) {
        processTargetVacancy(v, day);
      }
      finalizePendingPartials(day);
    }

    function snapshotEngineState() {
      return deepClone({ FIELD_SCHEDULE, movementLog, chains, vacancies, chainSeq });
    }

    function restoreEngineState(snapshot) {
      FIELD_SCHEDULE = deepClone(snapshot.FIELD_SCHEDULE);
      movementLog = deepClone(snapshot.movementLog);
      chains = deepClone(snapshot.chains);
      vacancies = deepClone(snapshot.vacancies);
      chainSeq = snapshot.chainSeq;
      for (const v of vacancies) {
        v.chain = v.chainId ? chains.find(c => c.id === v.chainId) || null : null;
      }
    }

    function globalStateScore() {
      const compensated = chains.filter(c => c.status && c.status.indexOf("SUCCESS") === 0 && c.status !== "SUCCESS_NO_ACTION").length;
      const complete = chains.filter(c => c.moves.length > 0 && c.completion === "COMPLETE").length;
      const fallbacks = chains.filter(c => c.status === "FALLBACK").length;
      const reverse = movementLog.filter(m => m.movementType === "EXCEPTIONAL_REVERSE").length;
      const partial = chains.filter(c => c.completion === "PARTIAL").length;
      const gapDistance = chains.reduce((sum, c) => sum + (Number(c.finalGap) || 0), 0);
      return [compensated, complete, -fallbacks, -reverse, -partial, -movementLog.length, gapDistance];
    }

    function isBetterGlobalScore(a, b) {
      if (!b) return true;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return a[i] > b[i];
      }
      return false;
    }

    function runGlobalCompensation(day) {
      const searchStart = Date.now();
      const initial = snapshotEngineState();

      // نتيجة سريعة صالحة تكون نقطة أمان إذا انتهت مهلة البحث العالمي.
      processCompensation(day);
      let bestSnapshot = snapshotEngineState();
      let bestScore = globalStateScore();
      const baselineScore = bestScore.slice();
      restoreEngineState(initial);

      const deadline = searchStart + ENGINE_CONFIG.GLOBAL_SEARCH_TIME_MS;
      let nodes = 0, limitHit = false, completePlans = 0;

      function search(remaining) {
        if (Date.now() >= deadline || nodes >= ENGINE_CONFIG.GLOBAL_SEARCH_MAX_NODES) {
          limitHit = true;
          return;
        }
        if (!remaining.length) {
          completePlans++;
          finalizePendingPartials(day);
          const integrity = validateIntegrity(day);
          if (integrity.allPassed) {
            const score = globalStateScore();
            if (isBetterGlobalScore(score, bestScore)) {
              bestScore = score;
              bestSnapshot = snapshotEngineState();
            }
          }
          return;
        }

        const successes = chains.filter(c => c.status && c.status.indexOf("SUCCESS") === 0 && c.status !== "SUCCESS_NO_ACTION").length;
        if (successes + remaining.length < bestScore[0]) return;

        const choices = remaining.map(index => ({ index, actions: listVacancyActions(vacancies[index], day) }));
        choices.sort((a, b) => a.actions.length - b.actions.length || a.index - b.index);
        for (const choice of choices) {
          const nextRemaining = remaining.filter(i => i !== choice.index);
          for (const action of choice.actions) {
            if (Date.now() >= deadline || nodes >= ENGINE_CONFIG.GLOBAL_SEARCH_MAX_NODES) {
              limitHit = true;
              return;
            }
            nodes++;
            const before = snapshotEngineState();
            try {
              applyVacancyAction(vacancies[choice.index], day, action);
              search(nextRemaining);
            } catch (_) {
              // البديل غير صالح في هذه الحالة العالمية؛ يُستبعد وتستمر بقية الفروع.
            }
            restoreEngineState(before);
          }
        }
      }

      search(vacancies.map((_, i) => i));
      restoreEngineState(bestSnapshot);
      globalSearchInfo = {
        status: limitHit ? "BEST_WITHIN_LIMIT" : "OPTIMAL_MODELED",
        nodes, completePlans,
        durationMs: Date.now() - searchStart,
        improved: isBetterGlobalScore(bestScore, baselineScore),
        score: bestScore.slice()
      };
    }

    // ============================================================
    // runEngine
    // ============================================================
    function runEngine(day, date, absentArray) {
      const t0 = Date.now();
      if (!ORIGINAL_SCHEDULE[day]) throw new Error("يوم غير معروف: " + day);
      currentDay = day;
      currentDate = date || "";
      lastOperationType = "compensation";
      globalSearchInfo = null;
      absentList = Array.from(new Set(absentArray || []));
      // المراحل الثلاث تعمل آليًا؛ وتبقى الحركة العكسية مقيدة بالحد الخامس وفحوص السلامة.
      engineOptions = { allowExceptionalReverse: true };
      originalScheduleSnapshot = JSON.stringify(ORIGINAL_SCHEDULE);
      movementLog = [];
      chains = [];
      chainSeq = 0;
      vacancies = [];

      buildTeacherState(day);
      calculateOriginalEnd(day);
      createFieldSchedule(day);
      markAbsentTeachers(day);
      createAbsenceVacancies(day);

      runGlobalCompensation(day);
      lastIntegrity = validateIntegrity(day);
      if (!lastIntegrity.allPassed) {
        throw new Error("فشل فحص سلامة التعويض: " + lastIntegrity.issues.join(" | "));
      }
      engineRunTime = (Date.now() - t0) + " ms";
      return buildResults();
    }

    // ============================================================
    // buildGapFillSuggestions
    // ============================================================
    function teacherFreeAtPeriodExcept(teacher, day, period, exceptClass) {
      if (!teacherState[teacher]) return false;
      if (isAbsent(teacher)) return false;
      for (const C of ALL_CLASSES) {
        if (C === exceptClass) continue;
        const c = FIELD_SCHEDULE[day][C] && FIELD_SCHEDULE[day][C][period];
        if (isActiveLesson(c) && c.teacher === teacher) return false;
      }
      return true;
    }

    function buildGapFillSuggestions(day) {
      const out = [];
      for (const ch of chains) {
        if (ch.completion !== "PARTIAL" || !ch.moves.length) continue;
        const A = ch.className,
          G = ch.finalGap;
        const options = [];
        for (const B of ALL_CLASSES) {
          if (B === A) continue;
          const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][B] && FIELD_SCHEDULE[day][B][G];
          if (!isActiveLesson(cell)) continue;
          if (isAbsent(cell.teacher)) continue;
          let absorb = null;
          for (let P = G + 1; P <= originalEndMap[B]; P++) {
            const later = FIELD_SCHEDULE[day][B][P];
            if (!isActiveLesson(later)) continue;
            if (later.teacher === cell.teacher) continue;
            if (teacherFreeAtPeriodExcept(later.teacher, day, G, B)) {
              absorb = { period: P, teacher: later.teacher, subject: later.subject };
              break;
            }
          }
          options.push({
            classB: B, teacher: cell.teacher, subject: cell.subject, absorb: absorb,
            subjectMatch: cell.subject === ch.subject,
            cost: "طلاب " + B + " يفقدون حصة " + cell.subject + " (" + cell.teacher + ")" +
              (absorb ? " — تخفيف ممكن: سحب حصة " + absorb.subject + " (" + absorb.teacher + ") من الحصة " + absorb.period +
                " إلى الحصة " + G + " فيبقى فراغهم عند الحصة " + absorb.period
                : " — لا يوجد تخفيف ممكن (ينقص دوامهم حصة فعلية)")
          });
        }
        options.sort(function (a, b) {
          const sa = (a.absorb ? 2 : 0) + (a.subjectMatch ? 1 : 0);
          const sb = (b.absorb ? 2 : 0) + (b.subjectMatch ? 1 : 0);
          return sb - sa;
        });
        out.push({
          className: A, gap: G, targetPeriod: ch.targetPeriod,
          absentTeacher: ch.absentTeacher, subject: ch.subject,
          blockedReason: ch.gapBlockedReason, options: options.slice(0, 3)
        });
      }
      return out;
    }

    // ============================================================
    // buildResults
    // ============================================================
    function buildResults() {
      const day = currentDay;
      const METHOD_RANK = { EXCEPTIONAL: 4, RIPPLE: 3, DIRECT: 2, NO_ACTION: 1, FALLBACK: 0 };

      const absentees = absentList.map(t => {
        const st = teacherState[t] || { originalLoad: 0 };
        const vs = vacancies.filter(v => v.absentTeacher === t);
        const compensated = vs.filter(v => v.status && v.status.indexOf("SUCCESS") === 0 && v.status !== "SUCCESS_NO_ACTION").length;
        return {
          name: t, lessonsToday: st.originalLoad, affected: vs.length, compensated: compensated,
          note: st.originalLoad === 0 ? "لا حصص لهذا المعلم في هذا اليوم — لا تأثير" : ""
        };
      });

      const affectedClasses = [];
      for (const cls of ALL_CLASSES) {
        const vs = vacancies.filter(v => v.className === cls);
        if (!vs.length) continue;
        const clsChains = chains.filter(c => c.className === cls);
        const finalGaps = [];
        for (let p = 1; p <= originalEndMap[cls]; p++) {
          const c = FIELD_SCHEDULE[day][cls][p];
          if (c && !isActiveLesson(c)) finalGaps.push({ period: p, type: c.status, atEnd: p === originalEndMap[cls] });
        }
        const methods = [];
        for (const c of clsChains)
          if (c.method && methods.indexOf(c.method) < 0) methods.push(c.method);
        const anyFallback = clsChains.some(c => c.status === "FALLBACK");
        let status;
        if (anyFallback) status = "FALLBACK";
        else {
          let top = "NO_ACTION";
          for (const m of methods)
            if (METHOD_RANK[m] > METHOD_RANK[top]) top = m;
          status = "SUCCESS_" + top;
        }
        affectedClasses.push({
          name: cls, originalEnd: originalEndMap[cls],
          compensated: clsChains.filter(c => c.status && c.status.indexOf("SUCCESS") === 0 && c.status !== "SUCCESS_NO_ACTION").length,
          finalGaps: finalGaps,
          movementsCount: clsChains.reduce((n, c) => n + c.moves.length, 0),
          methods: methods, status: status, chains: clsChains
        });
      }

      const finalGapsList = [];
      for (const ac of affectedClasses) {
        for (const g of ac.finalGaps) {
          finalGapsList.push({
            className: ac.name, period: g.period, type: g.type, atEnd: g.atEnd,
            needsAttention: !g.atEnd
          });
        }
      }

      const direct = movementLog.filter(m => m.movementType === "DIRECT_TAIL_PULL");
      const ripple = movementLog.filter(m => m.movementType === "RIPPLE_SWAP");
      const cross = movementLog.filter(m => m.movementType === "EXCEPTIONAL_CROSS_CLASS" || m.movementType === "EXCEPTIONAL_REVERSE");
      const crossChains = chains.filter(c => c.crossInfo);
      const fallbackChains = chains.filter(c => c.status === "FALLBACK");

      const stats = {
        absentTeachers: absentList.length,
        completeSuccess: chains.filter(function (c) { return c.moves.length > 0 && c.completion === "COMPLETE"; }).length,
        partialSuccess: chains.filter(function (c) { return c.moves.length > 0 && c.completion === "PARTIAL"; }).length,
        affectedClasses: affectedClasses.length,
        compensatedVacancies: chains.filter(c => c.status && c.status.indexOf("SUCCESS") === 0 && c.status !== "SUCCESS_NO_ACTION").length,
        noActionVacancies: chains.filter(c => c.status === "SUCCESS_NO_ACTION").length,
        totalMovements: movementLog.length,
        directMoves: direct.length,
        rippleMoves: ripple.length,
        crossClassMoves: cross.length,
        crossClassChains: crossChains.length,
        exceptionalReverseMoves: movementLog.filter(m => m.movementType === "EXCEPTIONAL_REVERSE").length,
        finalGaps: finalGapsList.length,
        fallbacks: fallbackChains.length
      };

      return {
        ok: true,
        meta: {
          day: day, date: currentDate, runAt: new Date().toISOString(), duration: engineRunTime,
          automaticThreeStages: true,
          globalSearch: globalSearchInfo ? deepClone(globalSearchInfo) : null
        },
        field: FIELD_SCHEDULE,
        classes: ALL_CLASSES.slice(),
        originalEnd: Object.assign({}, originalEndMap),
        vacancies: vacancies, chains: chains, movementLog: movementLog,
        absentees: absentees, affectedClasses: affectedClasses, finalGaps: finalGapsList,
        fallbacks: fallbackChains,
        gapSuggestions: buildGapFillSuggestions(day),
        movements: { direct: direct, ripple: ripple, cross: cross, crossChains: crossChains },
        stats: stats,
        integrity: lastIntegrity
      };
    }

    // ============================================================
    // INTEGRITY VALIDATION
    // ============================================================
    function validateIntegrity(day) {
      const issues = [];
      if (JSON.stringify(ORIGINAL_SCHEDULE) !== originalScheduleSnapshot) issues.push("تم تعديل الجدول الأصلي أثناء المعالجة");
      if (!Object.isFrozen(ORIGINAL_SCHEDULE)) issues.push("الجدول الأصلي غير محمي من التعديل");

      const expectedIds = new Set();
      for (const cls of ALL_CLASSES) {
        const row = ORIGINAL_SCHEDULE[day] && ORIGINAL_SCHEDULE[day][cls];
        for (let p = 1; p <= 7; p++) {
          const l = row && row[p];
          if (l && isRealLessonData(l.teacher, l.subject) && !isAbsent(l.teacher)) {
            expectedIds.add(day + "|" + cls + "|" + p + "|" + l.teacher + "|" + l.subject);
          }
        }
      }

      const activeIds = new Set();
      for (let p = 1; p <= 7; p++) {
        const busy = new Map();
        for (const cls of ALL_CLASSES) {
          const cell = FIELD_SCHEDULE[day] && FIELD_SCHEDULE[day][cls] && FIELD_SCHEDULE[day][cls][p];
